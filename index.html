<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c1c">
<title>Intercity Pixel Train</title>
<style>
  html, body { margin: 0; height: 100%; background: #140c1c; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body.below { flex-direction: column; }          /* portrait: toolbar under the picture */
  body.side { flex-direction: row; }              /* wide screens: toolbar beside it */
  canvas {
    display: block;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    touch-action: manipulation;
  }
  #bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  body.side #bar { flex-direction: column; flex-wrap: nowrap; }
  body.overlay #bar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(6px + env(safe-area-inset-bottom)); flex-wrap: nowrap;
  }
  body.overlay #bar button { opacity: 0.85; }
  #bar button {
    width: 48px; height: 48px; padding: 0; margin: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: #1b1f3b; color: #f4f4ec; border: 2px solid #4a4f84; border-radius: 0;
    font: bold 9px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.5px;
    cursor: pointer; touch-action: manipulation;
  }
  #bar button:hover { border-color: #6aaee0; }
  #bar button:active { background: #2c2f5e; }
  #bar button:focus-visible { outline: 2px solid #ffd65c; outline-offset: 1px; }
  #bar button.on { color: #ffd65c; border-color: #ffd65c; }
  #bar button.big { font-size: 15px; }
  #bar svg { width: 20px; height: 20px; shape-rendering: crispEdges; fill: currentColor; }
  #bar button > * { pointer-events: none; }       /* taps always land on the button itself */
  #bar button[hidden] { display: none; }          /* AUTO and DRIVE show different controls */
</style>
</head>
<body>
<canvas id="screen" width="320" height="180"></canvas>
<div id="bar" role="toolbar" aria-label="Train controls">
  <button id="b-mode" type="button" aria-label="Driver mode" title="Drive the train yourself (C)"><svg viewBox="0 0 16 16"><path d="M5 2h6v1h2v2h1v6h-1v2h-2v1H5v-1H3v-2H2V5h1V3h2zM6 4H5v1H4v6h1v1h6v-1h1V5h-1V4zM7 4h2v3H7zM7 7h2v2H7zM4 7h3v1H4zM9 7h3v1H9zM7 9h2v3H7z"/></svg><span>AUTO</span></button>
  <button id="b-engine" type="button" class="drv" hidden aria-label="Start the engine" title="Engine start / stop (E)"><svg viewBox="0 0 16 16"><path d="M7 1h2v7H7zM4 3h2v2H4zM10 3h2v2h-2zM2 5h2v6H2zM12 5h2v6h-2zM3 11h2v2H3zM11 11h2v2h-2zM5 13h6v1H5z"/></svg><span>START</span></button>
  <button id="b-power" type="button" class="drv" hidden aria-label="Power: notch up" title="Power up / release brake (Up arrow)"><svg viewBox="0 0 16 16"><path d="M7 3h2v1h1v1h1v1h1v1h1v1h1v2H2V8h1V7h1V6h1V5h1V4h1z"/></svg><span>POWER</span></button>
  <button id="b-brake" type="button" class="drv" hidden aria-label="Brake: notch down" title="Power down / brake (Down arrow, B = emergency)"><svg viewBox="0 0 16 16"><path d="M2 5h12v2h-1v1h-1v1h-1v1h-1v1H9v1H7v-1H6v-1H5V9H4V8H3V7H2z"/></svg><span>BRAKE</span></button>
  <button id="b-doors" type="button" class="drv" hidden aria-label="Open the doors" title="Doors (O)"><svg viewBox="0 0 16 16"><path d="M2 2h12v12H2zM4 4v10h3V4zM9 4v10h3V4z"/></svg><span>OPEN</span></button>
  <button id="b-horn" type="button" class="drv" hidden aria-label="Horn" title="Horn (hold H)"><svg viewBox="0 0 16 16"><path d="M1 7h3v2H1zM4 6h2v4H4zM6 5h2v6H6zM8 3h2v10H8zM12 4h1v1h-1zM13 7h2v2h-2zM12 11h1v1h-1z"/></svg><span>HORN</span></button>
  <button id="b-light" type="button" class="drv" hidden aria-label="Headlight" title="Headlight (L)"><svg viewBox="0 0 16 16"><path d="M6 2h4v1h1v1h1v4h-1v1h-1v2H6V9H5V8H4V4h1V3h1zM6 12h4v1H6zM7 14h2v1H7z"/></svg><span>LIGHT</span></button>
  <button id="b-pause" type="button" aria-label="Pause" title="Pause (P)"><svg viewBox="0 0 16 16"></svg><span>PAUSE</span></button>
  <button id="b-speed" type="button" class="big aut" aria-label="Speed 1x" title="Speed (1 / 2 / 4)">1x</button>
  <button id="b-skip" type="button" class="aut" aria-label="Skip to next station" title="Next station (N)"><svg viewBox="0 0 16 16"><path d="M3 3h2v1h2v1h2v1h1v1h1v2h-1v1h-1v1H7v1H5v1H3zM12 3h2v10h-2z"/></svg><span>NEXT</span></button>
  <button id="b-time" type="button" class="aut" aria-label="Time of day" title="Time of day (T)"><svg viewBox="0 0 16 16"></svg><span>AUTO</span></button>
  <button id="b-rain" type="button" class="aut" aria-label="Rain" title="Rain (W)"><svg viewBox="0 0 16 16"><path d="M5 2h5v1h2v1h1v2h1v3H1V6h1V4h1V3h2zM3 11h1v2H3zM7 11h1v2H7zM11 11h1v2h-1zM5 13h1v2H5zM9 13h1v2H9z"/></svg><span>AUTO</span></button>
  <button id="b-mute" type="button" aria-label="Sound" title="Sound (M)"><svg viewBox="0 0 16 16"></svg><span>TAP</span></button>
</div>
<script>
'use strict';

// =====================================================================
// 1. CONFIG
// =====================================================================
const W = 320, H = 180;                 // internal resolution

const CONFIG = {
  STEP: 1 / 60,                         // fixed simulation timestep (s)
  MAX_FRAME: 0.25,                      // clamp long frames (tab switches)
  FAST_FACTOR: 4,                       // hold F to fast-forward

  CRUISE_SPEED: 80,                     // world px per second
  ACCEL_TIME: 7,                        // s, 0 -> cruise
  BRAKE_TIME: 6,                        // s, cruise -> 0 (nominal)
  PX_PER_KM: 20,                        // route km -> world px (compressed)
  TERRAIN_BLEND: 300,                   // world px over which one landscape fades into the next

  // station stop sequence (seconds)
  SETTLE_TIME: 0.8,                     // brakes settle before doors open
  DOOR_TIME: 0.7,                       // doors slide open / closed
  BOARD_TIMEOUT: 18,                    // safety cap on the boarding phase
  FLAG_TIME: 2.2,                       // guard waves the green flag
  HORN_TIME: 1.6,                       // horn, then depart

  // DRIVE mode: the player drives with one combined lever, -5 (emergency
  // brake) .. -1 brake steps, 0 coast, 1 .. 8 power notches
  DRIVE: {
    NOTCHES: 8, BRAKES: 4,
    ACCEL: 15, KNEE: 45,                // px/s² at full power; tractive effort fades above KNEE px/s
    DRAG: [0.5, 0.00035],               // rolling + air resistance: c0 + c1 * v²
    BRAKE: 4.5, EMERGENCY: 28,          // px/s² per brake step, emergency brake
    CRANK_TIME: 2.2, SHUTDOWN_TIME: 2.5,
    LIMIT: 100, LIMIT_HILLS: 80, LIMIT_BRIDGE: 60, LIMIT_STATION: 60,   // km/h (= px/s)
    COMFORT_ACCEL: 16,                  // px/s² passengers put up with
    FIRST_DEP: 32, DWELL: 16, SLACK: 6, // timetable: s to first departure, per stop, per leg
    SCHED_SPEED: 84,                    // px/s the timetable assumes on open line
    ON_TIME: 8,                         // game minutes either side that count as on time
  },

  // time of day follows the trip: early morning at Kamalapur, night at Sylhet
  HOUR_START: 5.6, HOUR_END: 20.4,
  HOUR_EASE: 3,                         // max game hours per second when time jumps (skip, T)

  // weather: light monsoon spells (seeded, so every trip gets the same ones)
  RAIN_GAP: [35, 80],                   // s of dry weather between spells
  RAIN_SPELL: [14, 28],                 // s a spell lasts
  LIGHTNING_RATE: 0.05,                 // strikes per second while it pours

  TRAIN_FRONT_X: 273,                   // screen x of the headlight
  LOCO_W: 46, CAR_W: 39, CAR_GAP: 2, CAR_COUNT: 5,
  WHEEL_R: 3.5, WHEEL_FRAMES: 6,
  BN_SIZE: 11,                          // px size Bangla text is rasterised at

  // particle pools [normal, low quality]; nothing is allocated while running
  SMOKE_MAX: [70, 40], RAIN_MAX: [180, 100], SPLASH_MAX: [60, 30],
  SPARK_MAX: [70, 36], FIREFLY_MAX: [40, 20], BIRD_MAX: [8, 5], FLUFF_MAX: [60, 30],
  LOW_QUALITY_MS: 11,                   // average frame cost that switches to low quality
};

// The route, in travel order. To add a station, add an entry: only en,
// bn and km are required, everything else falls back to STATION_DEFAULTS.
//   en / bn   English and Bangla names shown on the board and banner
//   code      three letters for the route map
//   km        distance from Kamalapur along the line (approximate)
//   platform  [left, right] screen x of the platform while stopped here
//   roof      'umbrella' | 'canopy' | 'shelter'
//   crowd     passengers waiting to board, alight: passengers getting off
//   idle      extra people standing around
//   backdrop  extra scenery from BACKDROPS drawn near the station (the
//             landscape along the line itself comes from TERRAIN below)
//   extras    station-specific props / characters ('porter', 'fish', 'chests')
const ROUTE = [
  { en: 'KAMALAPUR', bn: 'কমলাপুর', code: 'DHK', km: 0,
    platform: [-330, 650], roof: 'umbrella', crowd: 15, alight: 0, idle: 14,
    backdrop: ['city'], extras: ['porter'] },
  { en: 'BHAIRAB BAZAR', bn: 'ভৈরব বাজার', code: 'BRB', km: 82,
    platform: [-90, 400], roof: 'canopy', roofColor: 'red', crowd: 6, alight: 4, idle: 4,
    extras: ['fish'] },
  { en: 'SRIMANGAL', bn: 'শ্রীমঙ্গল', code: 'SMG', km: 234,
    platform: [4, 318], roof: 'shelter', crowd: 2, alight: 2, idle: 1 },
  { en: 'KULAURA JN.', bn: 'কুলাউড়া জংশন', code: 'KUL', km: 272,
    roof: 'canopy', roofColor: 'blue', crowd: 5, alight: 3, idle: 3,
    extras: ['chests'] },                                  // tea chests from the gardens around
  { en: 'SYLHET', bn: 'সিলেট', code: 'SYL', km: 319,
    platform: [-60, 380], roof: 'canopy', crowd: 0, alight: 12, idle: 2 },
];
const STATION_DEFAULTS = { platform: [-40, 360], roof: 'canopy', roofColor: 'green',
                           crowd: 4, alight: 3, idle: 3, backdrop: [], extras: [] };

// The landscape between the stations, in travel order. Each section starts
// at [station index, world px from that station]; neighbouring sections
// cross-fade over CONFIG.TERRAIN_BLEND px. What a section paints and spawns
// in the far, mid and foreground layers is defined in SECTIONS.
const TERRAIN = [
  { id: 'village' },                      // Kamalapur onwards: paddy, ponds, tin roofs
  { id: 'river', at: [1, -260] },         // the Meghna at Bhairab, and the bridge
  { id: 'kash',  at: [1, 1640] },         // sandy chars white with kash phool
  { id: 'tea',   at: [2, -420] },         // Srimangal and Kulaura tea gardens
  { id: 'hills', at: [3, 200] },          // misty hills on the approach to Sylhet
];
// Steel truss railway bridge over the Meghna, just past Bhairab Bazar
const BRIDGE = { at: [1, 600], spans: 6, span: 120 };

// Scroll speed of each parallax layer relative to the track
const PARALLAX = { clouds: 0.05, far: 0.2, mid: 0.5, track: 1.0, fg: 1.3 };

// Screen y where each layer / sprite is drawn
const LAYER_Y = { clouds: 6, far: 60, mid: 84, poles: 92,
                  track: 140, fg: 146, loco: 116, car: 121, wheel: 144 };

// Near-side platform geometry (screen y). People stand with their feet
// between WALK_MIN and WALK_MAX; doors span DOOR_TOP..DOOR_FLOOR.
const PLAT = { TOP: 148, EDGE_Y: 152, WALK_MIN: 154, WALK_MAX: 169,
               DOOR_TOP: 125, DOOR_FLOOR: 136,
               STALL_X: 280, STALL_Y: 163, BOARD_X: 132 };

// Palette lighting by hour of day: [hour, lighting]. Between two different
// lightings the world cross-fades with an ordered dither; the sky, the
// colour tint and the glow of lamps follow the hour smoothly on top.
const LIGHT_KEYS = [[0, 'night'], [4.6, 'night'], [5.4, 'dusk'], [6.4, 'dusk'], [7.4, 'day'],
                    [17.0, 'day'], [17.9, 'dusk'], [18.9, 'dusk'], [19.9, 'night'], [24, 'night']];
// The time-of-day button / T key cycles these; AUTO follows the trip
const TIME_MODES = [['AUTO', null], ['DAY', 12], ['DUSK', 18.3], ['NIGHT', 22.5]];

// =====================================================================
// 2. PALETTE  (32 colours for every sprite and tile; only the time-of-day
//    sky, the colour tint and the additive glow pass add colours on top)
// =====================================================================
const PALETTE = {
  ink:      '#140c1c', navy:      '#1b1f3b', indigo:     '#2c2f5e', slate:     '#4a4f84',
  purple:   '#6b4a7d', rose:      '#b85d6e', orange:     '#e8875a', peach:     '#f4c27a',
  skyDeep:  '#3d7fc4', skyMid:    '#6aaee0', skyLight:   '#a8d8ef', white:     '#f4f4ec',
  cloudShade:'#c4cedb', grayLight:'#9a9aa8', gray:       '#6c6c7a', grayDark:  '#43434f',
  brownDark:'#3e2a22', brown:     '#6e4a32', tan:        '#b08a5c', cream:     '#ecdcae',
  glow:     '#ffd65c', amber:     '#f0a030', red:        '#c23a30', rust:      '#8c4a3a',
  greenDeep:'#12382a', greenDark: '#1e5a36', green:      '#2e7d3e', grass:     '#4f9a3c',
  grassLight:'#86c04a', paddy:    '#c4c95a', haze:       '#4f7f6c', blue:      '#2a5a9c',
};

// Palette lighting: each lighting remaps palette keys onto other palette
// keys, and every sprite is pre-rendered once per lighting.
// Light sources (lit windows, lamps, headlight) use PALETTE directly;
// p.glow / p.amber are yellow *paint* (safety line, signs) and do darken.
const LIGHTING = {
  day:   { lit: false, map: {} },
  dusk:  { lit: true, map: {
    slate: 'indigo', orange: 'rose', peach: 'orange', glow: 'peach', amber: 'orange',
    skyDeep: 'slate', skyMid: 'purple', skyLight: 'rose', white: 'peach', cloudShade: 'rose',
    grayLight: 'gray', gray: 'grayDark', grayDark: 'navy',
    brownDark: 'ink', brown: 'brownDark', tan: 'rust', cream: 'peach', red: 'rust', rust: 'brown',
    greenDeep: 'ink', greenDark: 'greenDeep', green: 'greenDark', grass: 'green',
    grassLight: 'grass', paddy: 'tan', haze: 'slate', blue: 'indigo',
  } },
  night: { lit: true, map: {
    navy: 'ink', indigo: 'navy', slate: 'indigo', purple: 'indigo', rose: 'purple',
    orange: 'purple', peach: 'rose', glow: 'tan', amber: 'rust',
    skyDeep: 'navy', skyMid: 'indigo', skyLight: 'slate', white: 'slate', cloudShade: 'indigo',
    grayLight: 'slate', gray: 'indigo', grayDark: 'navy',
    brownDark: 'ink', brown: 'navy', tan: 'purple', cream: 'slate', red: 'purple', rust: 'indigo',
    greenDeep: 'ink', greenDark: 'greenDeep', green: 'greenDeep', grass: 'greenDeep',
    grassLight: 'greenDark', paddy: 'greenDark', haze: 'navy', blue: 'indigo',
  } },
};

// =====================================================================
// 3. DRAWING HELPERS
// =====================================================================
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bayer = (x, y) => BAYER4[((y & 3) << 2) | (x & 3)];

// Small seeded RNG so every lighting variant gets an identical layout
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const randInt = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));

// Object pools: items[0 .. n-1] are alive. Spawning reuses a dead slot and
// killing swaps the last live item into the hole, so nothing is allocated
// while the game runs.
function makePool(size, make) { return { items: Array.from({ length: size }, make), n: 0 }; }
function poolSpawn(pool, max) { return pool.n < Math.min(max, pool.items.length) ? pool.items[pool.n++] : null; }
function poolKill(pool, i) {
  const dead = pool.items[i];
  pool.items[i] = pool.items[--pool.n];
  pool.items[pool.n] = dead;
}

// Quality: phones start on the light settings; anything that averages too
// long per frame drops to them too (see frame())
const quality = { low: typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches, ema: 0 };
const cap = name => CONFIG[name][quality.low ? 1 : 0];

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}

function rect(g, x, y, w, h, col) {
  g.fillStyle = col;
  g.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function px(g, x, y, col) {
  g.fillStyle = col;
  g.fillRect(Math.floor(x), Math.floor(y), 1, 1);
}

// Filled pixel circle built from horizontal spans (no anti-aliasing)
function disc(g, cx, cy, r, col) {
  cx = Math.floor(cx); cy = Math.floor(cy);
  g.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) {
    const hw = Math.floor(Math.sqrt((r + 0.5) * (r + 0.5) - dy * dy));
    g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
  }
}

// Ordered-dither fill: paints pixels whose Bayer value is below level (0..16)
function ditherRect(g, x, y, w, h, col, level) {
  g.fillStyle = col;
  for (let yy = y; yy < y + h; yy++)
    for (let xx = x; xx < x + w; xx++)
      if (bayer(xx, yy) < level) g.fillRect(xx, yy, 1, 1);
}

// Paint a character template: each char maps to a colour (or is skipped)
function stamp(g, tpl, x, y, colors) {
  for (let r = 0; r < tpl.length; r++)
    for (let c = 0; c < tpl[r].length; c++) {
      const col = colors[tpl[r][c]];
      if (col) px(g, x + c, y + r, col);
    }
}

// Run a draw call at -tw, 0 and +tw so shapes wrap across a tile seam
function wrapX(tw, fn) { fn(-tw); fn(0); fn(tw); }

// Repeat a pre-rendered tile across the screen at a scroll offset
function drawTiled(g, tile, offset, y) {
  const tw = tile.width;
  for (let x = -(((Math.floor(offset) % tw) + tw) % tw); x < W; x += tw) g.drawImage(tile, x, y);
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [n >> 16, (n >> 8) & 255, n & 255];
}

// 3x5 bitmap font (rows top to bottom) for the debug overlay and signs
const FONT = {
  ' ': '000 000 000 000 000', '.': '000 000 000 000 010', ':': '000 010 000 010 000',
  '-': '000 000 111 000 000', '/': '001 001 010 100 100', '>': '100 010 001 010 100',
  '!': '010 010 010 000 010', '+': '000 010 111 010 000', '%': '101 001 010 100 101',
  '[': '110 100 100 100 110', ']': '011 001 001 001 011',
  '↑': '010 111 010 010 010', '↓': '010 010 010 111 010',
  '←': '010 100 111 100 010', '→': '010 001 111 001 010',
  '0': '111 101 101 101 111', '1': '010 110 010 010 111', '2': '111 001 111 100 111',
  '3': '111 001 011 001 111', '4': '101 101 111 001 001', '5': '111 100 111 001 111',
  '6': '111 100 111 101 111', '7': '111 001 010 010 010', '8': '111 101 111 101 111',
  '9': '111 101 111 001 111',
  A: '010 101 111 101 101', B: '110 101 110 101 110', C: '011 100 100 100 011',
  D: '110 101 101 101 110', E: '111 100 110 100 111', F: '111 100 110 100 100',
  G: '011 100 101 101 011', H: '101 101 111 101 101', I: '111 010 010 010 111',
  J: '001 001 001 101 010', K: '101 101 110 101 101', L: '100 100 100 100 111',
  M: '101 111 111 101 101', N: '110 101 101 101 101', O: '010 101 101 101 010',
  P: '110 101 110 100 100', Q: '010 101 101 110 011', R: '110 101 110 101 101',
  S: '011 100 010 001 110', T: '111 010 010 010 010', U: '101 101 101 101 111',
  V: '101 101 101 101 010', W: '101 101 111 111 101', X: '101 101 010 101 101',
  Y: '101 101 010 010 010', Z: '111 001 010 100 111',
};

const glyphCache = new Map();
function glyph(ch, col) {
  const key = ch + col;
  let c = glyphCache.get(key);
  if (!c) {
    const bits = (FONT[ch] || FONT[' ']).replace(/ /g, '');
    let g;
    [c, g] = makeCanvas(3, 5);
    g.fillStyle = col;
    for (let i = 0; i < 15; i++) if (bits[i] === '1') g.fillRect(i % 3, (i / 3) | 0, 1, 1);
    glyphCache.set(key, c);
  }
  return c;
}

function drawText(g, str, x, y, col) {
  str = String(str).toUpperCase();
  for (let i = 0; i < str.length; i++)
    if (str[i] !== ' ') g.drawImage(glyph(str[i], col), x + i * 4, y);
}
const textWidth = s => s.length * 4 - 1;

// Same font at 2x: glyphs are scaled by drawImage with smoothing off
function drawText2x(g, str, x, y, col) {
  str = String(str).toUpperCase();
  for (let i = 0; i < str.length; i++)
    if (str[i] !== ' ') g.drawImage(glyph(str[i], col), x + i * 8, y, 6, 10);
}

// Bangla: rasterise with a Bengali-capable system font, then threshold
// the alpha to a hard 1-bit mask. The mask is painted in palette colours,
// so the text stays crisp and never introduces off-palette pixels.
const BN_FONT = '"Nirmala UI", Vrinda, "Shonar Bangla", "Kohinoor Bangla", ' +
                '"Bangla Sangam MN", "Noto Sans Bengali", sans-serif';

function textMask(str, size) {
  const [c, g] = makeCanvas(Math.ceil(size * str.length * 1.4) + 8, size * 3);
  g.font = size + 'px ' + BN_FONT;
  g.fillStyle = '#fff';                     // scratch canvas only, never shown
  g.fillText(str, 4, size * 2);
  const cw = c.width, data = g.getImageData(0, 0, cw, c.height).data;
  let x0 = cw, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++)
    for (let x = 0; x < cw; x++)
      if (data[(y * cw + x) * 4 + 3] >= 110) {
        x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      }
  if (x1 < 0) return { w: 0, h: 0, bits: new Uint8Array(0) };   // no Bengali font available
  const w = x1 - x0 + 1, h = y1 - y0 + 1, bits = new Uint8Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) bits[y * w + x] = data[((y + y0) * cw + x + x0) * 4 + 3] >= 110 ? 1 : 0;
  return { w, h, bits };
}

function drawMask(g, m, x, y, col) {
  g.fillStyle = col;
  for (let yy = 0; yy < m.h; yy++)
    for (let xx = 0; xx < m.w; xx++) if (m.bits[yy * m.w + xx]) g.fillRect(x + xx, y + yy, 1, 1);
}

// 7x7 wheel with four spokes; frames cover a quarter turn (spoke symmetry)
function buildWheels(p) {
  const frames = [];
  for (let f = 0; f < CONFIG.WHEEL_FRAMES; f++) {
    const [c, g] = makeCanvas(7, 7);
    for (let y = 0; y < 7; y++)
      for (let x = 0; x < 7; x++) {
        const d = Math.hypot(x - 3, y - 3);
        if (d <= 3.4) px(g, x, y, d > 2.4 ? p.ink : p.grayDark);
      }
    const base = (f / CONFIG.WHEEL_FRAMES) * Math.PI / 2;
    for (let k = 0; k < 4; k++) {

// Body bounce relative to the bogies: -1, 0 or +1 px, only while moving
function swayOffset(i) {
  const k = Math.min(1, sim.speed / CONFIG.CRUISE_SPEED);
  if (k < 0.05) return 0;
  const s = (Math.sin(sim.swayPhase + i * 2.1) + 0.6 * Math.sin(sim.swayPhase * 2.3 + i * 1.3)) * k;
  return s > 1.05 ? -1 : s < -1.3 ? 1 : 0;
}

function drawTrain(g, v) {
  const p = v.p, vehicles = TRAIN.vehicles;
  const wf = v.wheels[Math.floor(sim.wheelAngle / (Math.PI / 2) * CONFIG.WHEEL_FRAMES) % CONFIG.WHEEL_FRAMES];
  // couplings (behind bodies): gangway bellows between carriages + coupler
  for (let i = 0; i < vehicles.length - 1; i++) {
    const gx = vehicles[i + 1].x + vehicles[i + 1].w;
    if (i > 0) rect(g, gx, 125, CONFIG.CAR_GAP, 11, p.grayDark);
    rect(g, gx - 1, 137, CONFIG.CAR_GAP + 2, 1, p.ink);
  }
  vehicles.forEach((veh, i) => {
    for (const wx of veh.wheels) g.drawImage(wf, veh.x + wx - 3, LAYER_Y.wheel);
    for (let k = 0; k < veh.wheels.length; k += 2) drawBogie(g, p, veh.x + veh.wheels[k], veh.x + veh.wheels[k + 1]);
    g.drawImage(i === 0 ? v.loco : v.cars[i - 1], veh.x, veh.y + swayOffset(i));
  });
  drawDoors(g, v);
  if (sim.hornWave > 0) drawHornWaves(g, p);
}

// Left pixel column of every carriage door (two per carriage)
const DOORS = TRAIN.vehicles.slice(1).flatMap(c => [c.x + 1, c.x + CONFIG.CAR_W - 5]);

// Doors slide open into the body: the 4 px doorway is revealed column by column
function drawDoors(g, v) {
  const k = Math.round(sim.doorOpen * 4), p = v.p;
  if (!k) return;
  for (const dx of DOORS) {
    rect(g, dx, PLAT.DOOR_TOP, k, PLAT.DOOR_FLOOR - PLAT.DOOR_TOP + 1, p.ink);
    if (v.lit) rect(g, dx, PLAT.DOOR_TOP, k, 1, PALETTE.amber);         // ceiling light
    if (k < 4) rect(g, dx + k, PLAT.DOOR_TOP, 1, PLAT.DOOR_FLOOR - PLAT.DOOR_TOP + 1, p.greenDark);
    if (k >= 3) rect(g, dx, 138, 4, 1, p.grayLight);                    // folding step
  }
}

function drawHornWaves(g, p) {
  const hx = TRAIN.vehicles[0].x + 42, hy = LAYER_Y.loco + 1;
  const ph = Math.floor(sim.clock * 8) % 3;
  for (let i = 0; i < 3; i++) {
    if ((i + ph) % 3 === 2) continue;                                   // flicker outward
    const r = 2 + i * 3;
    for (let a = -2; a <= 2; a++) px(g, hx + r + (Math.abs(a) === 2 ? -1 : 0), hy + a - i, p.white);
  }
}

// --- exhaust smoke -----------------------------------------------------
// Puffs live in screen space. Air is still relative to the world, so a
// puff's x velocity relaxes towards -speed: faster train, faster drift.
const smokePool = makePool(CONFIG.SMOKE_MAX[0], () => ({ x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 0, r0: 0, grow: 0, shade: 0 }));

function emitPuff(heavy) {
  const s = poolSpawn(smokePool, cap('SMOKE_MAX'));
  if (!s) return;
  s.x = TRAIN.stackX + Math.random(); s.y = TRAIN.stackY;
  s.vx = 0; s.vy = -(heavy ? 26 : 16) - Math.random() * 8;
  s.age = 0; s.life = (heavy ? 3.2 : 2.2) + Math.random();
  s.r0 = heavy ? 1.5 : 0.8; s.grow = (heavy ? 2.4 : 1.6) + Math.random();
  s.shade = heavy ? 0 : 1;
}

function updateSmoke(dt) {
  const st = sim.state, e = drive.engine;
  // idling engine puffs gently; it revs up (darker smoke) for the horn and departure.
  // A cold engine makes none; the driver's notch sets the rate in DRIVE mode.
  let rate = 0, revving = false;
  if (e === 'CRANK') rate = 2.5;
  else if (e === 'SHUTDOWN') rate = 0.6;
  else if (e === 'ON' && drive.on) { rate = 1.5 + Math.max(0, drive.rpm - 0.3) * 16; revving = drive.rpm > 0.72; }
  else if (e === 'ON') {
    revving = st === 'DEPARTING' || sim.stopPhase === 'HORN';
    rate = revving ? 12 : st === 'TRAVELING' ? 5 : st === 'ARRIVING' ? 3
         : sim.stopPhase === 'TERMINUS' ? 0.8 : 1.5;
  }
  sim.smokeAcc += rate * dt;
  while (sim.smokeAcc >= 1) { sim.smokeAcc -= 1; emitPuff(revving); }
  const windX = -(sim.speed + 4), kx = Math.min(1, dt * 2.2), ky = Math.min(1, dt * 1.5);
  for (let i = 0; i < smokePool.n; ) {
    const s = smokePool.items[i];
    s.age += dt;
    s.vx += (windX - s.vx) * kx;
    s.vy += (-5 - s.vy) * ky;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.age < s.life && s.x > -16 && s.y > -16) i++;
    else poolKill(smokePool, i);
  }
}

const SMOKE_SHADES = ['grayDark', 'gray', 'grayLight', 'cloudShade'];

// Dithered puff sprites, cached per lighting / radius / density / shade
function puffSprite(v, r, dens, shade) {
  const key = (r * 17 + dens) * 4 + shade;
  let c = v.puffs[key];
  if (!c) {
    let g;
    [c, g] = makeCanvas(r * 2 + 1, r * 2 + 1);
    g.fillStyle = v.p[SMOKE_SHADES[shade]];
    for (let y = -r; y <= r; y++)
      for (let x = -r; x <= r; x++)
        if (x * x + y * y <= (r + 0.5) * (r + 0.5) && bayer(x + r, y + r) < dens) g.fillRect(x + r, y + r, 1, 1);
    v.puffs[key] = c;
  }
  return c;
}

function drawSmoke(g, v) {
  for (let i = 0; i < smokePool.n; i++) {
    const s = smokePool.items[i], t = s.age / s.life;
    const r = Math.min(7, Math.floor(s.r0 + s.age * s.grow));
    const dens = 16 - Math.min(3, Math.floor(t * 4)) * 4;          // 16, 12, 8, 4 -> fades out
    const shade = Math.min(3, s.shade + Math.floor(t * 3));
    g.drawImage(puffSprite(v, r, dens, shade), Math.round(s.x) - r, Math.round(s.y) - r);
  }
}

function palm(g, x, base, h, lean, trunk, leaf, leafDark) {

function roundTree(g, x, base, r, trunkH, p, seed) {
  const rng = mulberry32(seed), cy = base - trunkH - r;
  rect(g, x, cy, 1, base - cy, p.brownDark);
  disc(g, x, cy, r, p.greenDark);
  disc(g, x - 1, cy - 1, Math.max(1, r - 2), p.green);
  for (let i = 0; i < r * 2; i++) {
    const a = rng() * Math.PI * 2, d = rng() * (r - 1) * 0.7;
    px(g, Math.round(x - 2 + Math.cos(a) * d), Math.round(cy - 2 + Math.sin(a) * d), p.grass);
  }
}

// Village house: woven bamboo (bera) walls, corrugated tin (or rusty) gable
// roof, and optionally a bamboo fence running off to the right
function house(g, x, base, w, p, tin, lightOn, fence = 0) {
  const wallH = 6, top = base - wallH;
  for (let yy = top; yy < base; yy++)
    for (let xx = x; xx < x + w; xx++) px(g, xx, yy, (xx + (yy >> 1)) & 1 ? p.tan : p.cream);
  rect(g, x, top + 2, w, 1, p.brown);                 // tie beam
  rect(g, x, base - 1, w, 1, p.brown);                // mud plinth
  for (let xx = x + w + 1; xx <= x + w + fence; xx++) if ((xx - x) % 2) rect(g, xx, base - 3, 1, 3, p.tan);
  if (fence) rect(g, x + w + 1, base - 2, fence, 1, p.brown);
  rect(g, x + 2, base - 4, 2, 3, p.brownDark);
  rect(g, x + w - 5, base - 4, 2, 2, lightOn ? PALETTE.glow : p.brownDark);
  const rh = 4, roof = tin ? p.grayLight : p.rust, ridge = tin ? p.gray : p.brown;
  for (let r = 0; r < rh; r++) {
    const inset = rh - 1 - r, x0 = x - 1 + inset, rw = w + 2 - inset * 2;
    rect(g, x0, top - rh + r, rw, 1, r === 0 ? ridge : roof);
    if (r > 0) for (let xx = x0 + 1; xx < x0 + rw; xx += 2) px(g, xx, top - rh + r, ridge);
  }
}

// Bell-shaped hill: top row of column i, and the filled silhouette
const humpTop = (i, w, h, base) => base - Math.round(h * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / w)));

function hump(g, x, base, w, h, col, ridge, tint) {
  for (let i = 0; i < w; i++) {
    const t = humpTop(i, w, h, base);
    if (t >= base) continue;
    rect(g, x + i, t, 1, base - t, col);
    if (tint) for (let y = t; y < Math.min(base, t + 6); y++) if (bayer(x + i, y) < 7 - (y - t)) px(g, x + i, y, tint);
    if (ridge && bayer(x + i, t) < 10) px(g, x + i, t, ridge);
  }
}

// --- 2. far clouds (0.05x) -------------------------------------------
function buildClouds(p) {
  const TW = 640, TH = 64, rng = mulberry32(7);
  const [c, g] = makeCanvas(TW, TH);
  for (let i = 0; i < 8; i++) {
    const x0 = i * 80 + randInt(rng, 0, 40), base = randInt(rng, 14, 54), n = randInt(rng, 3, 6);
    const puffs = [];
    let x = x0;
    for (let j = 0; j < n; j++) {
      const mid = 1 - Math.abs(j - (n - 1) / 2) / n;
      const r = Math.max(2, Math.round((3 + rng() * 4) * (0.6 + mid * 0.6)));
      puffs.push([x, base - r + 2, r]);
      x += r + randInt(rng, 1, 3);
    }
    wrapX(TW, o => {
      for (const [cx, cy, r] of puffs) disc(g, cx + o, cy, r, p.cloudShade);
      g.clearRect(x0 - 12 + o, base + 2, x - x0 + 24, 12);            // flat underside
      for (const [cx, cy, r] of puffs) disc(g, cx - 1 + o, cy - 1, r - 1, p.white);
    });
  }
  for (let i = 0; i < 6; i++) {                                         // thin high streaks
    const x = randInt(rng, 0, TW - 1), y = randInt(rng, 2, 20), w = randInt(rng, 12, 30);
    wrapX(TW, o => { rect(g, x + o, y, w, 1, p.white); rect(g, x + 4 + o, y + 1, w - 6, 1, p.cloudShade); });
  }
  return c;
}

// Big, bright cumulus for the kash section's autumn sky (0.07x)
function buildCumulus(p) {
  const TW = 576, TH = 60, rng = mulberry32(13);
  const [c, g] = makeCanvas(TW, TH);
  for (let i = 0; i < 5; i++) {
    const x0 = i * 115 + randInt(rng, 0, 50), base = randInt(rng, 34, 54), n = randInt(rng, 4, 6);
    const puffs = [];
    let x = x0;
    for (let j = 0; j < n; j++) {
      const mid = 1 - Math.abs(j - (n - 1) / 2) / n;
      const r = Math.max(4, Math.round((6 + rng() * 6) * (0.5 + mid * 0.7)));
      puffs.push([x, base - r + 2, r]);
      x += r + randInt(rng, 0, 3);
    }
    wrapX(TW, o => {
      for (const [cx, cy, r] of puffs) disc(g, cx + o, cy, r, p.cloudShade);
      for (const [cx, cy, r] of puffs) disc(g, cx + o, cy - 1, r, p.white);   // shade only on the underside
      g.clearRect(x0 - 16 + o, base + 2, x - x0 + 32, 20);
    });

  return c;
}

// --- 5a. telegraph poles with sagging wires (1.0x) --------------------
function buildPoles(p) {
  const TW = 192, TH = 56, SPACING = 96, TOP = 6, FOOT = 51, SAG = 5;
  const [c, g] = makeCanvas(TW, TH);
  for (let x = 48; x < TW; x += SPACING) {
    for (const ax of [-4, 5]) {                                         // catenary to the next pole
      for (let i = 0; i <= SPACING; i++) {
        const t = i / SPACING, y = TOP + Math.round(SAG * 4 * t * (1 - t));
        wrapX(TW, o => px(g, x + ax + i + o, y, p.grayDark));
      }
    }
    rect(g, x, TOP, 2, FOOT - TOP, p.brown);
    rect(g, x + 1, TOP, 1, FOOT - TOP, p.brownDark);
    rect(g, x - 4, TOP + 1, 10, 1, p.brownDark);                        // cross-arm
    px(g, x - 4, TOP, p.cloudShade);
    px(g, x + 5, TOP, p.cloudShade);                                    // insulators
  }
  return c;
}

// --- 5b. track: gravel bed, wooden sleepers, two rails (1.0x) ---------
function buildTrack(p) {
  const TW = 192, TH = 20, rng = mulberry32(5);
  const [c, g] = makeCanvas(TW, TH);
  rect(g, 0, 3, TW, 12, p.gray);                                        // ballast top
  rect(g, 0, 15, TW, 3, p.grayDark);                                    // ballast shoulder
  for (let i = 0; i < TW * 8; i++) {
    const x = randInt(rng, 0, TW - 1), y = randInt(rng, 3, 17), r = rng();
    px(g, x, y, y >= 15 ? (r < 0.5 ? p.gray : p.brownDark)
                        : r < 0.4 ? p.grayLight : r < 0.8 ? p.grayDark : p.brown);
  }
  for (let x = 0; x < TW; x++) if (bayer(x, 3) < 8) px(g, x, 3, p.grayLight);
  for (let x = 2; x < TW; x += 8) {                                     // sleepers
    rect(g, x, 5, 4, 9, p.brown);
    rect(g, x + 3, 5, 1, 9, p.brownDark);
    rect(g, x, 13, 4, 1, p.brownDark);
    px(g, x, 5, p.tan);
  }
  rect(g, 0, 6, TW, 1, p.grayLight); rect(g, 0, 7, TW, 1, p.grayDark);  // far rail
  rect(g, 0, 11, TW, 1, p.grayLight); rect(g, 0, 12, TW, 1, p.grayDark); // near rail (y 151)
  return c;
}

// --- 5c. Meghna bridge: open deck, piers, abutments, truss spans (1.0x) --
// Same sleeper spacing as the track tile, but nothing under the sleepers
// except steel and, far below, the river.
function buildDeck(p) {
  const TW = 192, [c, g] = makeCanvas(TW, 20);
  rect(g, 0, 4, TW, 10, p.blue);
  ditherRect(g, 0, 4, TW, 10, p.skyDeep, 5);
  for (const y of [8, 10]) rect(g, 0, y, TW, 1, p.grayDark);           // rail-bearing stringers
  for (let x = 2; x < TW; x += 8) {
    rect(g, x, 5, 4, 9, p.brown);
    rect(g, x + 3, 5, 1, 9, p.brownDark);
    px(g, x, 5, p.tan);
  }
  rect(g, 0, 6, TW, 1, p.grayLight); rect(g, 0, 7, TW, 1, p.grayDark);
  rect(g, 0, 11, TW, 1, p.grayLight); rect(g, 0, 12, TW, 1, p.grayDark);
  rect(g, 0, 14, TW, 1, p.grayDark);
  rect(g, 0, 15, TW, 1, p.ink);
  return c;
}

const TRUSS_Y = 96, PIER_Y = 155, REFLECT_AXIS = 158;

// One camelback through-truss span. The far truss sits behind the train
// (darker, a little higher); the near one is drawn over it.
function buildTruss(p, near) {
  const S = BRIDGE.span, P = 6, pw = S / P, bot = 57;
  const [c, g] = makeCanvas(S + 1, 62);
  const col = near ? p.gray : p.grayDark, hi = near ? p.grayLight : p.gray, dark = near ? p.grayDark : p.navy;
  const top = i => 4 + Math.round(6 * ((i - P / 2) / (P / 2 - 1)) ** 2);
  const line = (x0, y0, x1, y1, k) => {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let s = 0; s <= n; s++) px(g, Math.round(x0 + (x1 - x0) * s / n), Math.round(y0 + (y1 - y0) * s / n), k);
  };
  rect(g, 0, bot, S + 1, 2, col);                                       // bottom chord
  rect(g, 0, bot + 2, S + 1, 1, dark);
  for (let i = 1; i < P - 1; i++) {                                     // polygonal top chord
    line(i * pw, top(i), (i + 1) * pw, top(i + 1), hi);
    line(i * pw, top(i) + 1, (i + 1) * pw, top(i + 1) + 1, col);
  }
  line(0, bot, pw, top(1), hi); line(1, bot, pw + 1, top(1) + 1, col);  // inclined end posts
  line(S, bot, S - pw, top(P - 1), col); line(S - 1, bot, S - pw - 1, top(P - 1) + 1, dark);
  for (let i = 1; i < P; i++) rect(g, i * pw, top(i) + 2, 1, bot - top(i) - 2, col);   // verticals
  for (let i = 1; i < P - 1; i++) {                                     // diagonals slope down to mid-span
    if (i < P / 2) line(i * pw + 1, top(i) + 2, (i + 1) * pw - 1, bot - 1, col);
    else line((i + 1) * pw - 1, top(i + 1) + 2, i * pw + 1, bot - 1, col);
  }
  for (let i = 0; i <= P; i++) {                                        // gusset plates
    rect(g, i * pw - 1, bot - 1, 3, 3, dark);
    if (i > 0 && i < P) rect(g, i * pw - 1, top(i), 3, 2, dark);
  }
  if (near) for (let x = 3; x < S; x += 6) px(g, x, bot, p.grayLight);  // rivets
  return c;
}

// Concrete pier under a span joint, its foot in the water
function buildPier(p) {
  const [c, g] = makeCanvas(11, 8);
  rect(g, 0, 0, 11, 1, p.grayLight);
  rect(g, 1, 1, 9, 7, p.cloudShade);
  rect(g, 8, 1, 2, 7, p.gray);
  rect(g, 1, 5, 9, 1, p.grayDark);                                     // waterline stain
  px(g, 0, 7, p.skyLight); px(g, 10, 7, p.skyLight);
  return c;
}

// Brick abutment where the embankment meets the river (mirrored for the far bank)
function buildAbutment(p, flip) {
  const [c, g] = makeCanvas(16, 15);
  if (flip) { g.translate(16, 0); g.scale(-1, 1); }
  rect(g, 0, 0, 16, 1, p.cloudShade);
  rect(g, 0, 1, 16, 14, p.rust);
  for (let y = 3; y < 15; y += 3) {
    rect(g, 0, y, 16, 1, p.brown);
    for (let x = (y % 6 ? 1 : 4); x < 16; x += 6) px(g, x, y - 1, p.brown);
  }
  rect(g, 14, 1, 2, 14, p.brownDark);                                  // face towards the water
  return c;
}

// 4x4 ordered-dither pattern of one colour; with lines, every other row is
// fourth row is filled solid as well (the ripple lines of a reflection)
function tintPattern(col, level, lines) {
  const [c, g] = makeCanvas(4, 4);
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (bayer(x, y) < level || (lines && y === 3)) px(g, x, y, col);
  return g.createPattern(c, 'repeat');
}

// --- lighting variants: every sprite and tile, once per lighting -----
function buildVariant(name) {
  const def = LIGHTING[name], p = {}, rgba = {};
  for (const k in PALETTE) p[k] = PALETTE[def.map[k] || k];
  for (const k in p) {                                    // ImageData words (little-endian ABGR)
    const [r, gr, b] = hexToRgb(p[k]);
    rgba[k] = ((255 << 24) | (b << 16) | (gr << 8) | r) >>> 0;
  }
  const backdrops = {};
  for (const key in BACKDROPS) backdrops[key] = BACKDROPS[key].build(p, def.lit);
  return {
    name, lit: def.lit, p, rgba, puffs: [], people: new Map(),
    sprites: new Map(),                                   // terrain sprites, painted on first use
    chunks: { far: new Map(), mid: new Map(), fg: new Map() },
    clouds: buildClouds(p),
    cumulus: buildCumulus(p),
    poles: buildPoles(p),
    track: buildTrack(p),
    deck: buildDeck(p),
    pier: buildPier(p),
    abutment: [buildAbutment(p, false), buildAbutment(p, true)],
    trussNear: buildTruss(p, true),
    trussFar: buildTruss(p, false),
    waterTint: tintPattern(p.skyMid, 3, true),
    waterFade: Array.from({ length: 17 }, (_, l) => tintPattern(p.skyMid, l)),
    loco: buildLoco(p, def.lit),
    cars: Array.from({ length: CONFIG.CAR_COUNT }, (_, i) => buildCar(p, def.lit, i)),
    wheels: buildWheels(p),
    backdrops,
    props: buildProps(p, def.lit),
    stations: STATIONS.map(st => buildStationSprites(st, p)),
  };
}

// =====================================================================
// 5b. TERRAIN SECTIONS
// =====================================================================
// The far, mid and foreground layers are not repeating tiles: they are laid
// out once for the whole line from fixed seeds (so every trip looks the
// same), painted lazily in chunks per lighting, and overlaid every frame
// with live entities (swaying plants, boats, animals, fog, shimmer).
//
// A layer with parallax factor f shows layer column lx at screen
// x = lx - floor(dist * f), and that column stands for the world position
// u = (lx - ANCHOR_X) / f. So every layer agrees on what lies at the centre
// of the screen, and deeper layers see further ahead and behind.
//
// Ground pixels of two neighbouring sections are mixed with an ordered
// dither across the blend zone; objects are spawned with a probability
// equal to their section's weight, so they thin out instead of being cut.
const ANCHOR_X = W / 2;
const CHUNK_W = 64;                                 // multiple of 4: dither lines up across chunks; small = short builds

const TLAYERS = [
  { key: 'far', f: PARALLAX.far, y: LAYER_Y.far, h: 60, seed: 21, hiRows: null },
  { key: 'mid', f: PARALLAX.mid, y: LAYER_Y.mid, h: 80, seed: 42, hiRows: [16, 46] },
  { key: 'fg',  f: PARALLAX.fg,  y: LAYER_Y.fg,  h: 34, seed: 77, hiRows: [12, 34] },
];
const TL = Object.fromEntries(TLAYERS.map(L => [L.key, L]));
const uOf = (L, lx) => (lx - ANCHOR_X) / L.f;
const lxOf = (L, u) => Math.round(u * L.f + ANCHOR_X);

// Deterministic per-pixel noise in [0, 1)
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function setupTerrain() {
  const at = a => STATIONS[a[0]].dist + a[1];
  TERRAIN.forEach((s, i) => { s.u = i ? at(s.at) : -Infinity; });
  BRIDGE.u0 = at(BRIDGE.at);
  BRIDGE.u1 = BRIDGE.u0 + BRIDGE.spans * BRIDGE.span;
}

// Sections at world position u: a, b are TERRAIN indices, t the weight of b.
// Writes into out (a shared scratch object unless one is passed), so read
// the result before the next call.
const TERRAIN_TMP = { a: 0, b: 0, t: 0 }, TERRAIN_SW = { a: 0, b: 0, t: 0 };
function terrainAt(u, out = TERRAIN_TMP) {
  const half = CONFIG.TERRAIN_BLEND / 2, n = TERRAIN.length;
  out.a = out.b = n - 1; out.t = 0;
  for (let i = 1; i < n; i++) {
    const b = TERRAIN[i].u;
    if (u < b - half) { out.a = out.b = i - 1; break; }
    if (u < b + half) { out.a = i - 1; out.b = i; out.t = smoothstep((u - b + half) / (2 * half)); break; }
  }
  return out;
}

function sectionWeight(id, u) {
  const w = terrainAt(u, TERRAIN_SW);
  return (TERRAIN[w.a].id === id ? 1 - w.t : 0) + (TERRAIN[w.b].id === id ? w.t : 0);
}

// Breeze: waves of wind sweeping back along the line, roughly -1..1
const windAt = (u, t) => Math.sin(u * 0.016 + t * 1.7) * 0.65 + Math.sin(u * 0.043 + t * 2.9 + 1.7) * 0.35;
// How far a plant at u leans right now: -1..2 (the breeze mostly blows one way)
const leanAt = (u, t) => Math.max(-1, Math.min(2, Math.round(windAt(u, t) * 1.7 + 0.4)));

// --- layout: run every section's spawner over its stretch of each layer --
function buildTerrain() {
  setupTerrain();
  const half = CONFIG.TERRAIN_BLEND / 2, last = TERRAIN.length - 1;
  for (const L of TLAYERS) {
    L.lx0 = Math.floor(STATIONS[0].dist * L.f) - 48;
    L.lx1 = Math.ceil(STATIONS[LAST_STATION].dist * L.f) + W + 48;
    L.statics = []; L.live = []; L.data = {};
    TERRAIN.forEach((s, i) => {
      const spec = SECTIONS[s.id][L.key];
      const from = i ? Math.max(L.lx0, lxOf(L, s.u - half)) : L.lx0;
      const to = i < last ? Math.min(L.lx1, lxOf(L, TERRAIN[i + 1].u + half)) : L.lx1;
      if (!spec || from >= to) return;
      const rng = mulberry32(L.seed * 1000 + i * 97);
      const weight = lx => sectionWeight(s.id, uOf(L, lx));
      L.data[s.id] = (spec.spawn && spec.spawn({
        L, rng, from, to, weight,
        ok: lx => rng() < weight(lx),
        stat: (x0, x1, z, draw) => L.statics.push({ x0, x1, z, draw }),   // baked into the chunks
        live: e => L.live.push(e),                                          // drawn every frame
      })) || {};
    });
    L.statics.sort((a, b) => a.z - b.z);
    L.live.sort((a, b) => a.x0 - b.x0);
    L.span = L.live.reduce((m, e) => Math.max(m, e.x1 - e.x0), 0);
  }
}

// --- chunks: ground pixels via ImageData, then the static objects --------
function groundCol(L, si, lx) {
  const id = TERRAIN[si].id, spec = SECTIONS[id][L.key];
  if (!spec || !spec.ground) return null;
  return { spec, c: spec.column ? spec.column(lx, L.data[id], uOf(L, lx)) : null };
}

function terrainChunk(v, L, k) {
  const cache = v.chunks[L.key];
  let ch = cache.get(k);
  if (ch) return ch;
  const x0 = k * CHUNK_W, w = CHUNK_W, h = L.h;
  const [c, g] = makeCanvas(w, h);
  const img = g.createImageData(w, h), out = new Uint32Array(img.data.buffer);
  let hi = null;
  for (let i = 0; i < w; i++) {
    const lx = x0 + i, tw = terrainAt(uOf(L, lx));
    const A = groundCol(L, tw.a, lx), B = tw.t > 0 ? groundCol(L, tw.b, lx) : A;
    for (let y = 0; y < h; y++) {
      const s = bayer(lx, y) < tw.t * 16 ? B : A;
      if (!s) continue;
      const key = s.spec.ground(s.c, y, lx);
      if (key) out[y * w + i] = v.rgba[key];
      const hk = key && s.spec.hl && s.spec.hl(s.c, y, lx);
      if (hk) (hi || (hi = new Uint32Array(w * h)))[y * w + i] = v.rgba[hk];
    }
  }
  g.putImageData(img, 0, 0);
  const statics = L.statics.filter(s => s.x1 >= x0 && s.x0 < x0 + w);
  for (const s of statics) s.draw(g, v.p, v.lit, -x0, 0);
  ch = { c, hi: null };
  if (hi) {
    let hg;
    [ch.hi, hg] = makeCanvas(w, h);
    const himg = hg.createImageData(w, h);
    new Uint32Array(himg.data.buffer).set(hi);
    hg.putImageData(himg, 0, 0);
    hg.globalCompositeOperation = 'destination-out';     // no wind highlights over props
    for (const s of statics) s.draw(hg, v.p, v.lit, -x0, 0);
  }
  cache.set(k, ch);
  return ch;
}

// --- per frame: chunks, wind-wave highlights, then live entities ---------
const liveScratch = [];
function drawTerrain(g, v, L, afterGround) {
  const cam = Math.floor(sim.dist * L.f), t = sim.clock;
  const k0 = Math.floor(cam / CHUNK_W), k1 = Math.floor((cam + W - 1) / CHUNK_W);
  for (let k = k0; k <= k1; k++) g.drawImage(terrainChunk(v, L, k).c, k * CHUNK_W - cam, L.y);
  if (afterGround) afterGround(g, v);
  if (L.hiRows) drawWindCrests(g, v, L, cam, k0, k1);
  const list = liveScratch, live = L.live;
  list.length = 0;
  let lo = 0, hi = live.length;
  const start = cam - L.span - 4;
  while (lo < hi) { const m = (lo + hi) >> 1; if (live[m].x0 < start) lo = m + 1; else hi = m; }
  for (let i = lo; i < live.length && live[i].x0 <= cam + W + 4; i++)
    if (live[i].x1 >= cam - 4 && !(live[i].lod && quality.low)) list.push(live[i]);
  list.sort(byZ);
  for (let i = 0; i < list.length; i++) {
    const e = list[i];
    e.draw(g, v, -cam, L.y, t);
    if (e.light) addLight(e.light[0] - cam, e.light[1] + L.y, LIGHT_WINDOW);
  }
}
const byZ = (a, b) => a.z - b.z;

// Pixels flagged by a section's hl() light up under the crests of the wind
// waves: strips of rows, each a little behind the one above, so the bands
// sweep diagonally across paddy, kash and tea.
const crestX = [], crestHi = [];
function drawWindCrests(g, v, L, cam, k0, k1) {
  crestX.length = crestHi.length = 0;
  for (let k = k0; k <= k1; k++) { const ch = terrainChunk(v, L, k); if (ch.hi) { crestX.push(k * CHUNK_W - cam); crestHi.push(ch.hi); } }
  if (!crestX.length) return;
  const [r0, r1] = L.hiRows, t = sim.clock;
  for (let y = r0; y < r1; y += 3) {
    const rows = Math.min(3, r1 - y);
    let run = -1;
    for (let x = 0; x <= W; x += 2) {
      const on = x < W && windAt(uOf(L, x + cam) - (y - r0) * 7, t) > 0.38;
      if (on && run < 0) run = x;
      else if (!on && run >= 0) {
        for (let j = 0; j < crestX.length; j++) {
          const cx = crestX[j], a = Math.max(run, cx), b = Math.min(x, cx + CHUNK_W);
          if (b > a) g.drawImage(crestHi[j], a - cx, y, b - a, rows, a, L.y + y, b - a, rows);
        }
        run = -1;
      }
    }
  }
}

// --- sprite helpers for live entities ------------------------------------
function cached(v, key, w, h, paint) {
  let c = v.sprites.get(key);
  if (!c) {
    let g;
    [c, g] = makeCanvas(w, h);
    paint(g, v.p, v.lit);
    v.sprites.set(key, c);
  }
  return c;
}

// A still object that has to sort by depth with the live ones (houses in
// front of swaying palms); painted once per lighting
function spriteEnt(lx, y, w, h, ax, ay, key, paint) {
  return { x0: lx - ax, x1: lx - ax + w, z: y, warm: v => cached(v, key, w, h, paint), draw(g, v, ox, oy) {
    g.drawImage(cached(v, key, w, h, paint), lx - ax + ox, y - ay + oy);
  } };
}

// A plant that leans with the passing wind waves (one sprite per lean)
function swayer(L, lx, y, kind, a = 0, b = 0) {
  const S = SWAY[kind], [w, h, ax, ay] = S.size(a, b), u = uOf(L, lx), key = kind + a + '|' + b;
  const frames = v => {                                // all four leans, painted together
    let f = v.sprites.get(key);
    if (!f) {
      f = [];
      for (let lean = -1; lean <= 2; lean++) {
        const [c, g] = makeCanvas(w, h);
        S.paint(g, v.p, lean, a, b, ax, ay);
        f.push(c);
      }
      v.sprites.set(key, f);
    }
    return f;
  };
  return { x0: lx - ax, x1: lx - ax + w, z: y, warm: frames, draw(g, v, ox, oy, t) {
    g.drawImage(frames(v)[leanAt(u - y * 4, t) + 1], lx - ax + ox, y - ay + oy);
  } };
}

// Each kind: size(a, b) -> [w, h, anchor x, anchor y]; paint(g, p, lean, a, b, ax, ay)
const KASH_BLADES = [[[-3, 4], [2, 5]], [[-2, 5], [3, 3], [1, 4]], [[3, 4], [-2, 3]]];
const SWAY = {
  coco: {                                             // coconut palm: a = height, b = trunk lean
    size: h => [23, h + 4, 11, h + 2],
    paint(g, p, lean, h, b, ax, ay) { palm(g, ax, ay, h, b + lean, p.brown, p.green, p.greenDark); },
  },
  betel: {                                            // betel-nut palm: tall, thin, ringed trunk
    size: h => [13, h + 5, 6, h + 4],
    paint(g, p, lean, h, b, ax, ay) {
      const bend = b + lean * 0.6;
      for (let i = 0; i < h; i++) px(g, ax + Math.round(bend * (i / h) ** 2), ay - i, i % 3 ? p.grayLight : p.gray);
      stamp(g, BETEL_CROWN, ax + Math.round(bend) - 3 + (lean > 1 ? 1 : 0), ay - h - 3,
            { a: p.green, b: p.greenDark, n: p.paddy });
    },
  },
  banana: {
    size: () => [13, 8, 6, 7],
    paint(g, p, lean, a, b, ax, ay) {
      const cols = { l: p.grassLight, d: p.grass, s: p.green, b: p.tan };
      BANANA2.forEach((row, r) => stamp(g, [row], ax - 4 + (r < 5 ? Math.round(lean * (5 - r) / 5) : 0), ay - 7 + r, cols));
    },
  },
  kash: {                                             // kash phool: a = height, b = variant
    size: h => [14, h + 2, 5, h + 1],
    paint(g, p, lean, h, v, ax, ay) {
      const stalk = k => ax + Math.round(lean * 1.5 * (k / h) ** 2);
      for (const [dx, bh] of KASH_BLADES[v]) for (let k = 0; k < bh; k++) px(g, ax + Math.round(dx * (k + 1) / bh), ay - k, k < bh - 2 ? p.green : p.grass);
      for (let k = 0; k < h - 4; k++) px(g, stalk(k), ay - k, p.tan);
      const hx = stalk(h - 4), hy = ay - h + 4;    // fluffy white head, drooping downwind
      for (let j = 0; j < 6; j++) {
        const x = hx + Math.round((lean + 0.5) * j / 4), y = hy - j;
        px(g, x, y, j === 5 ? p.cloudShade : p.white);
        if (j > 0 && j < 5) px(g, x - 1, y, lean >= 2 || (j + v) % 2 ? p.white : p.cloudShade);
        if (j > 1 && j < 4 && v !== 1) px(g, x + 1, y + 1, p.cloudShade);
      }
    },
  },
  bamboo: {                                           // bamboo clump: a = height, b = culms
    size: h => [23, h + 3, 11, h + 2],
    paint(g, p, lean, h, n, ax, ay) {
      for (let i = 0; i < n; i++) {
        const spread = (i - (n - 1) / 2) * 2.2, hh = Math.round(h - Math.abs(spread) * 1.5);
        for (let k = 0; k < hh; k++) {
          const x = ax + Math.round(spread * k / hh * 1.6 + (lean + 0.5) * (k / hh) ** 2 * 2.5);
          px(g, x, ay - k, k % 4 === 3 ? p.greenDark : p.grass);
          if (k > hh * 0.45 && k % 2 === (i & 1)) px(g, x + (k % 4 < 2 ? -1 : 1), ay - k + 1, p.green);
        }
      }
    },
  },
  fern: {
    size: () => [13, 7, 6, 6],
    paint(g, p, lean, a, b, ax, ay) {
      const arc = [1, 3, 4, 4, 3];
      for (const d of [-1, 1]) for (let k = 0; k < 5; k++)
        px(g, ax + d * (k + 1) + (k > 2 ? Math.round(lean * 0.7) : 0), ay - arc[k] + (k > 3 ? 1 : 0), k > 2 ? p.grass : p.green);
      rect(g, ax, ay - 2, 1, 3, p.greenDark);
    },
  },
};

// --- what each section paints and spawns ---------------------------------
// Per layer: spawn(ctx) lays out objects (returning data for the ground),
// column(lx, data, u) prepares one column, ground(col, y, lx) returns the
// palette key of a pixel, and hl(col, y, lx) the key it takes on under a
// wind crest. Ground rows: far 52, mid 34, fg 12 (all screen y 112 / 118 / 158).
const SECTIONS = {
  village: {
    name: 'VILLAGE', sky: 'normal', birds: ['egret', 0.06],
    far: { spawn: ctx => { treeLine(ctx); }, ground: (c, y) => y >= 52 ? 'haze' : null },
    mid: { spawn: villageMid, column: paddyColumn, ground: paddyGround },
    fg:  { spawn: villageFg, column: villageFgColumn, ground: villageFgGround, hl: villageFgHl },
  },
  river: {
    name: 'MEGHNA', sky: 'normal', birds: ['gull', 0.4],
    far: {
      spawn: ctx => { farBank(ctx, 44); },
      ground: (c, y, lx) => y < 44 ? null : y < 47 ? 'haze' : y === 47 ? (bayer(lx, y) < 8 ? 'tan' : 'haze')
        : y < 50 ? 'skyLight' : hash2(lx >> 3, y) < 0.14 ? 'skyLight' : 'skyMid',
    },
    mid: { spawn: riverMid, ground: (c, y, lx) => y < 34 ? null : riverWater(lx, y, 56) },
    fg:  { spawn: riverFg, column: (lx, D, u) => bankRows(u), ground: riverFgGround },
  },
  kash: {
    name: 'KASH PHOOL', sky: 'deep', birds: ['egret', 0.05],
    far: {
      spawn: ctx => { farBank(ctx, 46); },
      ground: (c, y, lx) => y < 46 ? null : y < 49 ? 'haze' : y === 49 ? 'tan'
        : y < 54 ? (y < 51 || hash2(lx >> 3, y) < 0.15 ? 'skyLight' : 'skyMid')
        : y === 54 ? (bayer(lx, y) < 8 ? 'cream' : 'tan')
        : bayer(lx, y) < 4 ? 'white' : hash2(lx, y) < 0.3 ? 'tan' : 'cream',          // distant kash
    },
    mid: { spawn: kashMid, column: lx => 28 + Math.floor(hash2(lx, 3) * 4), ground: kashMidGround,
           hl: (top, y, lx) => y < 34 && bayer(lx, y) < 9 ? 'white' : null },
    fg:  { spawn: kashFg, ground: (c, y, lx) => y < 12 ? null : y === 12 ? (bayer(lx, y) < 8 ? 'tan' : 'cream')
             : hash2(lx, y) < 0.04 ? 'white' : hash2(lx >> 1, y >> 1) < 0.25 ? 'tan' : 'cream' },
  },
  tea: {
    name: 'TEA GARDEN', sky: 'normal', birds: null,
    far: { spawn: teaFar, ground: (c, y) => y >= 52 ? 'haze' : null },
    mid: { spawn: teaMid, ground: (c, y, lx) => y < 34 ? null : teaHedge(lx, y, 34, 5, TEA_PROF_MID) || 'greenDark' },
    fg:  { spawn: ctx => { addTufts(ctx, 14, 13, 14); }, ground: teaFgGround,
           hl: (c, y, lx) => { if (y < 15) return null; const [rel, bump] = teaFgRow(lx, y); return rel === 2 - bump && bayer(lx, y) < 9 ? 'grassLight' : null; } },
  },
  hills: {
    name: 'SYLHET HILLS', sky: 'mist', birds: ['hawk', 0.05],
    far: { spawn: hillsFar, ground: (c, y) => y >= 52 ? 'haze' : null },
    mid: { spawn: hillsMid, ground: (c, y, lx) => y < 34 ? null : hash2(lx >> 1, y >> 1) < 0.3 ? 'greenDark' : bayer(lx, y) < 3 ? 'grass' : 'green' },
    fg:  { spawn: hillsFg, column: (lx, D) => D.streams.find(s => Math.abs(lx - s.cx) < s.w + 24) || null, ground: hillsFgGround },
  },
};

// --- shared spawners ------------------------------------------------------
// Distant tree line with coconut palms, all one haze colour (far layer)
function treeLine(ctx, base = 52) {
  const { rng } = ctx;
  for (let x = ctx.from; x < ctx.to; ) {
    if (rng() < 0.12) { x += randInt(rng, 8, 26); continue; }       // open gap
    const r = randInt(rng, 2, 6), cy = base - randInt(rng, 0, 5) - r + 1, cx = x;
    if (ctx.ok(cx)) ctx.stat(cx - r, cx + r, 0, (g, p, lit, ox) => {
      disc(g, cx + ox, cy, r, p.haze);
      rect(g, cx - r + 1 + ox, cy, 2 * r - 1, base - cy, p.haze);
    });
    if (rng() < 0.06) {
      const h = randInt(rng, 12, 18), lean = randInt(rng, -2, 2), tx = x + randInt(rng, -3, 3);
      if (ctx.ok(tx)) ctx.stat(tx - 8, tx + 8, 1, (g, p, lit, ox) => palm(g, tx + ox, base, h, lean, p.haze, p.haze, p.haze));
    }
    x += r + randInt(rng, 0, 3);
  }
}

// The low far shore of a wide river, tiny sails, shimmer on the open water
function farBank(ctx, y) {
  const { rng } = ctx, dashes = [];
  for (let x = ctx.from; x < ctx.to; x += randInt(rng, 2, 6)) {
    if (!ctx.ok(x)) continue;
    const r = randInt(rng, 1, 2), tx = x, isPalm = rng() < 0.08, h = randInt(rng, 5, 8);
    ctx.stat(tx - 7, tx + 7, 0, (g, p, lit, ox) =>
      isPalm ? palm(g, tx + ox, y + 1, h, 0, p.haze, p.haze, p.haze) : disc(g, tx + ox, y - r + 1, r, p.haze));
  }
  for (let x = ctx.from; x < ctx.to; x += randInt(rng, 4, 12))
    if (ctx.ok(x)) dashes.push([x, randInt(rng, y + 5, Math.min(59, y + 14)), randInt(rng, 2, 4), rng() * 6, 1 + rng() * 2]);
  chunkedShimmer(ctx, dashes, 0);
  for (let x = ctx.from + randInt(rng, 20, 80); x < ctx.to; x += randInt(rng, 70, 160))
    if (ctx.ok(x)) ctx.live(tinySailEnt(x, randInt(rng, y + 5, y + 9), rng));
}

function addTufts(ctx, every, y0, y1, tall = 7) {
  const { rng } = ctx;
  for (let x = ctx.from + randInt(rng, 0, every); x < ctx.to; x += randInt(rng, every >> 1, (every * 1.5) | 0)) {
    const base = randInt(rng, y0, y1), h = randInt(rng, 3, tall), blades = [];
    for (let b = randInt(rng, 3, 6); b > 0; b--) blades.push([randInt(rng, -2, 2), randInt(rng, Math.max(2, h - 3), h), randInt(rng, -2, 2), rng()]);
    const flower = rng() < 0.12 ? (rng() < 0.5 ? 'red' : 'white') : null, tx = x;
    if (!ctx.ok(x)) continue;
    ctx.stat(tx - 4, tx + 4, base, (g, p, lit, ox) => {
      for (const [dx, bh, lean, cr] of blades) {
        const col = cr < 0.3 ? p.greenDark : cr < 0.7 ? p.grass : p.grassLight;
        for (let k = 0; k < bh; k++) px(g, tx + ox + dx + Math.round(lean * k / bh), base - k, col);
      }
      if (flower) { const [dx, bh, lean] = blades[0]; px(g, tx + ox + dx + lean, base - bh, p[flower]); }
    });
  }
}

// Fog banks drifting slowly back and forth (pre-dithered sprites)
function fogBands(ctx, y0, y1, gap, dens) {
  const { rng } = ctx;
  for (let x = ctx.from; x < ctx.to; x += randInt(rng, gap, gap * 2)) {
    const w = randInt(rng, 60, 150), h = randInt(rng, 4, 8), y = randInt(rng, y0, y1), ph = rng() * 6, drift = randInt(rng, 20, 50), lx = x;
    if (!ctx.ok(x + (w >> 1))) continue;
    const key = 'fog' + w + '|' + h + '|' + dens;
    ctx.live({ x0: lx - drift, x1: lx + w + drift, z: 100 + y, warm: v => fogSprite(v, key, w, h, dens), draw(g, v, ox, oy, t) {
      g.drawImage(fogSprite(v, key, w, h, dens), Math.round(lx + Math.sin(t * 0.03 + ph) * drift) + ox, y + oy);
    } });
  }
}

function fogSprite(v, key, w, h, dens) {
  return cached(v, key, w, h, (g, p) => {
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const ex = Math.min(1, Math.min(x, w - 1 - x) / (w * 0.3)), ey = 1 - Math.abs((y + 0.5) / h * 2 - 1);
        if (bayer(x, y) < dens * ex * (0.4 + 0.6 * ey)) px(g, x, y, p.white);
      }
  });
}

// --- 1. village ------------------------------------------------------------
const CROPS = {                          // [base, row lines, tips lit by the wind]
  paddy:  ['paddy', 'grassLight', 'cream'],
  young:  ['grassLight', 'grass', 'paddy'],
  green:  ['grass', 'green', 'grassLight'],
  dark:   ['green', 'greenDark', 'grass'],
  fallow: ['tan', 'brown', 'paddy'],
};
const MID_BANDS = [[34, 5], [39, 7], [46, 9], [55, 11], [66, 14]];   // field bands, taller towards the viewer

// Plots along a row of fields: sorted start columns, one crop each
function plots(rng, from, to, wMin, wMax, crops) {
  const xs = [], cs = [];
  for (let x = from - wMax; x < to + wMax; x += randInt(rng, wMin, wMax)) { xs.push(x); cs.push(pick(rng, crops)); }
  return { xs, cs };
}
function plotAt(P, lx) {
  let lo = 0, hi = P.xs.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (P.xs[m] <= lx) lo = m; else hi = m - 1; }
  return lo;
}

function villageMid(ctx) {
  const { rng, L } = ctx, G = 34;
  const bands = MID_BANDS.map(() => plots(rng, ctx.from, ctx.to, 28, 90, ['paddy', 'young', 'green', 'young', 'dark', 'fallow', 'paddy']));
  for (let vx = ctx.from + randInt(rng, 10, 40); vx < ctx.to; ) {      // hamlets
    const cw = randInt(rng, 40, 100);
    for (let x = vx; x < vx + cw; x += randInt(rng, 6, 12)) {         // back row of trees
      const r = rng(), tx = x, h = randInt(rng, 14, 21), lean = randInt(rng, -2, 2);
      const rr = randInt(rng, 4, 7), th = randInt(rng, 2, 6), seed = randInt(rng, 1, 1e6);
      if (!ctx.ok(tx)) continue;
      if (r < 0.22) ctx.live(swayer(L, tx, G - 1, 'coco', h, lean));
      else if (r < 0.36) ctx.live(swayer(L, tx, G - 1, 'betel', h + 1, Math.sign(lean)));
      else ctx.stat(tx - rr - 2, tx + rr + 1, G - 1, (g, p, lit, ox) => roundTree(g, tx + ox, G - 1, rr, th, p, seed));
    }
    for (let i = randInt(rng, 0, 2); i >= 0; i--) {                    // banana plants
      const bx = vx + randInt(rng, 0, cw);
      if (ctx.ok(bx)) ctx.live(swayer(L, bx, G + 1, 'banana'));
    }
    for (let i = randInt(rng, 1, 3); i > 0; i--) {                     // houses in front
      const hx = vx + randInt(rng, 0, cw - 16), hw = randInt(rng, 10, 16), fence = rng() < 0.6 ? randInt(rng, 4, 10) : 0;
      const tin = rng() < 0.8, roll = rng();
      if (!ctx.ok(hx)) continue;
      const e = spriteEnt(hx, G + 2, hw + fence + 3, 10, 1, 10, 'house' + hx + '|' + hw,
        (g, p, lit) => house(g, 1, 10, hw, p, tin, lit && roll < 0.7, fence));
      if (roll < 0.7) e.light = [hx + hw - 4, G - 1];      // its window glows after dark
      ctx.live(e);
    }
    vx += cw + randInt(rng, 30, 110);
  }
  for (let x = ctx.from; x < ctx.to; x += randInt(rng, 14, 40)) {    // lone trees, palms, haystacks
    const kind = rng(), tx = x, r = randInt(rng, 3, 5), th = randInt(rng, 2, 4), seed = randInt(rng, 1, 1e6);
    const h = randInt(rng, 13, 20), lean = randInt(rng, -2, 2), y = randInt(rng, G + 6, G + 18);
    if (!ctx.ok(tx)) continue;
    if (kind < 0.3) ctx.stat(tx - r - 2, tx + r + 1, G + 1, (g, p, lit, ox) => roundTree(g, tx + ox, G + 1, r, th, p, seed));
    else if (kind < 0.5) ctx.live(swayer(L, tx, G + 1, 'coco', h, lean));
    else if (kind < 0.62) ctx.live(swayer(L, tx, G + 1, 'betel', h + 2, 0));
    else if (kind < 0.85) ctx.live(spriteEnt(tx, y, 5, 4, 2, 4, 'hay', (g, p) => stamp(g, HAYSTACK, 0, 0, { s: p.brown, h: p.paddy, d: p.tan })));
  }
  return { bands };
}

function paddyColumn(lx, D) {
  return D.bands.map(P => { const i = plotAt(P, lx); return [P.cs[i], P.xs[i] === lx]; });
}

function paddyGround(c, y, lx) {
  if (y < 34) return null;
  let i = MID_BANDS.length - 1;
  while (y < MID_BANDS[i][0]) i--;
  const by = MID_BANDS[i][0], [crop, bund] = c[i], C = CROPS[crop];
  if (bund || y === by) return 'green';
  return (y - by) % 2 === 1 && bayer(lx, y) < 6 ? C[1] : C[0];
}

// Near fields: embankment (rows 12-16), a dirt road here and there (17-20),
// paddy with ponds below it
function villageFg(ctx) {
  const { rng, L } = ctx;
  const D = { plots: plots(rng, ctx.from, ctx.to, 40, 120, ['paddy', 'young', 'young', 'green', 'paddy', 'dark']), roads: [], ponds: [] };
  for (let x = ctx.from + randInt(rng, 0, 200); x < ctx.to; ) {
    const len = randInt(rng, 260, 560), a = x;
    D.roads.push([a, a + len]);
    for (let n = randInt(rng, 1, 2); n > 0; n--)                      // rickshaw or bicycle on it
      if (ctx.ok(a + (len >> 1))) ctx.live(rickshawEnt(a, a + len, 20, rng, rng() < 0.4));
    x += len + randInt(rng, 140, 420);
  }
  for (let x = ctx.from + randInt(rng, 40, 160); x < ctx.to; x += randInt(rng, 160, 380)) {
    const pd = { cx: x, rx: randInt(rng, 12, 22), ry: randInt(rng, 4, 5), cy: randInt(rng, 26, 28) };
    if (!ctx.ok(x)) continue;
    D.ponds.push(pd);
    const dashes = [];
    for (let i = 0; i < pd.rx; i++) {
      const dy = randInt(rng, -pd.ry + 1, pd.ry - 1), w = randInt(rng, 2, 4);
      const half = Math.floor(pd.rx * Math.sqrt(1 - (dy / pd.ry) ** 2)) - w;
      if (half > 1) dashes.push([pd.cx + randInt(rng, -half, half - 1), pd.cy + dy, w, rng() * 6, 1.2 + rng() * 2]);
    }
    ctx.live(shimmerEnt(dashes, pd.cy - pd.ry));
    for (let n = randInt(rng, 1, 3); n > 0; n--) ctx.live(duckEnt(pd, rng));
  }
  const clear = (x, pad) => !D.ponds.some(pd => Math.abs(x - pd.cx) < pd.rx + pad);
  for (let x = ctx.from + randInt(rng, 30, 120); x < ctx.to; x += randInt(rng, 120, 300)) {
    const y = randInt(rng, 25, 32), cow = rng() < 0.55;
    if (!ctx.ok(x) || !clear(x, 12)) continue;
    if (cow) ctx.live(cowEnt(x, y, rng));
    else { const tx = x; ctx.stat(tx - 4, tx + 5, y, (g, p, lit, ox) => stamp(g, HAYSTACK_BIG, tx - 4 + ox, y - 6, { s: p.brown, h: p.paddy, d: p.tan })); }
  }
  addTufts(ctx, 10, 13, 16);
  return D;
}

function villageFgColumn(lx, D) {
  const i = plotAt(D.plots, lx);
  let road = -1, pond = null;
  for (const [a, b] of D.roads) if (lx >= a && lx < b) { road = Math.min(lx - a, b - 1 - lx); break; }
  for (const pd of D.ponds) if (Math.abs(lx - pd.cx) <= pd.rx + 2) { pond = pd; break; }
  return { crop: D.plots.cs[i], bund: D.plots.xs[i] === lx, road, pond };
}

// Pond: muddy far rim, the sky mirrored (pale near the far bank, deeper
// blue towards the viewer), a reflection of the bank along the top
function pondPixel(pd, lx, y) {
  const dx = (lx - pd.cx) / pd.rx, dy = (y - pd.cy) / pd.ry, d = dx * dx + dy * dy;
  if (d > 1.35) return null;
  if (d > 1) return dy < 0 ? 'brown' : 'greenDark';
  if (dy < -0.7) return bayer(lx, y) < 8 ? 'green' : 'skyLight';
  return dy < -0.2 ? (bayer(lx, y) < 10 ? 'skyLight' : 'skyMid') : dy < 0.4 ? 'skyMid' : bayer(lx, y) < 6 ? 'skyDeep' : 'skyMid';
}

function villageFgGround(c, y, lx) {
  if (y < 12) return null;
  if (y === 12) return bayer(lx, y) < 10 ? 'grass' : 'green';
  if (y < 16) return hash2(lx >> 1, y) < 0.18 ? 'greenDark' : hash2(lx, y) < 0.1 ? 'grass' : 'green';
  if (y === 16) return bayer(lx, y) < 8 ? 'greenDark' : 'green';
  if (c.road >= 0 && y <= 20) {
    if (y === 17 || y === 20) return bayer(lx, y) < (c.road < 6 ? 4 : 9) ? 'tan' : 'grass';
    return y === 19 && hash2(lx >> 2, 7) < 0.6 && bayer(lx, y) < 10 ? 'brown' : hash2(lx, y) < 0.06 ? 'cream' : 'tan';
  }
  const pk = c.pond && pondPixel(c.pond, lx, y);
  if (pk) return pk;
  if (y === 17 || c.bund) return 'green';
  const C = CROPS[c.crop];
  return y % 2 === 1 && bayer(lx, y) < 7 ? C[1] : C[0];
}

// Under a wind crest the rice tips catch the light and the row lines shift
function villageFgHl(c, y, lx) {
  if (y < 18 || c.bund || (c.road >= 0 && y <= 20) || (c.pond && pondPixel(c.pond, lx, y))) return null;
  const C = CROPS[c.crop];
  if (y % 2) return bayer(lx + 2, y) < 7 ? C[1] : bayer(lx, y) < 7 ? C[0] : null;
  return bayer(lx, y) < 5 ? C[2] : null;
}

// --- 2. Meghna river ------------------------------------------------------
function riverWater(lx, y, deep) {
  return hash2(lx >> 2, y) < 0.1 ? 'skyLight' : y > deep && bayer(lx, y) < 3 ? 'skyDeep' : 'skyMid';
}

function riverMid(ctx) {
  const { rng } = ctx, dashes = [];
  for (let x = ctx.from + randInt(rng, 30, 90); x < ctx.to; x += randInt(rng, 90, 200)) {
    const r = rng(), wl = randInt(rng, 29, 33);           // waterline just above the carriage roofs
    if (!ctx.ok(x)) continue;
    ctx.live(r < 0.6 ? noukaEnt(x, wl, rng, r < 0.4 ? 'sail' : 'hood') : fisherEnt(x, wl, rng, false));
  }
  for (let x = ctx.from; x < ctx.to; x += randInt(rng, 3, 8))
    if (ctx.ok(x)) dashes.push([x, randInt(rng, 35, 78), randInt(rng, 2, 6), rng() * 6, 1 + rng() * 2]);
  chunkedShimmer(ctx, dashes, 0);
}

// Rows of riverbank left beside the track: 5 on land, sloping away to none
// over the last 60 px before each abutment
function bankRows(u) {
  const out = Math.max(BRIDGE.u0 - u, u - BRIDGE.u1, 0);
  return Math.min(5, Math.round(out / 12));
}

function riverFgGround(bank, y, lx) {
  if (y < 12) return null;
  if (y < 12 + bank) return y === 12 ? (bayer(lx, y) < 10 ? 'grass' : 'green')
                          : y === 11 + bank ? (bayer(lx, y) < 8 ? 'tan' : 'cream') : 'green';
  if (y < 15) return null;                      // under the deck: the river further back shows through
  return hash2(lx >> 3, y) < 0.08 ? 'skyLight' : y > 24 && bayer(lx, y) < y - 24 ? 'skyDeep' : 'skyMid';
}

function riverFg(ctx) {
  const { rng, L } = ctx, dashes = [];
  for (let x = ctx.from; x < ctx.to; x += randInt(rng, 2, 6))
    if (ctx.ok(x)) dashes.push([x, randInt(rng, 18, 33), randInt(rng, 2, 7), rng() * 6, 0.8 + rng() * 2.2]);
  chunkedShimmer(ctx, dashes, 0, ['skyLight', 'white']);
  for (let x = ctx.from; x < ctx.to; x += randInt(rng, 30, 90))
    if (ctx.ok(x)) ctx.live(hyacinthEnt(x, randInt(rng, 19, 32), rng));
  for (let x = ctx.from + randInt(rng, 100, 300); x < ctx.to; x += randInt(rng, 380, 700))
    if (ctx.ok(x)) ctx.live(fisherEnt(x, randInt(rng, 28, 31), rng, true));
  const onBank = { ...ctx, ok: x => ctx.ok(x) && bankRows(uOf(L, x)) >= 4 };
  addTufts(onBank, 9, 13, 15);
}

// --- 3. kash phool chars -----------------------------------------------------
// Every other plant is skipped on low quality (the densest thing on screen)
let thinCount = 0;
const thinOut = e => { if (++thinCount & 1) e.lod = true; return e; };
function kashMid(ctx) {
  const { rng, L } = ctx;
  for (let row = 0; row < 2; row++)
    for (let x = ctx.from + randInt(rng, 0, 6); x < ctx.to; x += randInt(rng, 5, 11)) {
      const y = 34 + row * 3 + randInt(rng, 0, 1), h = randInt(rng, 9, 13), v = randInt(rng, 0, 2);
      if (ctx.ok(x)) ctx.live(thinOut(swayer(L, x, y, 'kash', h, v)));
    }
}

// The dense field seen from afar: a fuzz of plumes over the sand
function kashMidGround(top, y, lx) {
  if (y < top) return null;
  if (y < 34) return bayer(lx, y) < 9 ? 'cloudShade' : y > 31 ? 'tan' : null;
  if (y < 38) return bayer(lx, y) < 5 ? 'grass' : 'tan';
  return hash2(lx, y) < 0.3 ? 'tan' : 'cream';
}

function kashFg(ctx) {
  const { rng, L } = ctx;
  // nearer rows stand taller; the back row only just reaches the ballast
  for (const [base, hMin, hMax] of [[17, 8, 11], [22, 9, 13], [27, 10, 14], [32, 11, 16]])
    for (let x = ctx.from + randInt(rng, 0, 6); x < ctx.to; x += randInt(rng, 5, 10)) {
      const y = base + randInt(rng, -1, 1), h = randInt(rng, hMin, hMax), v = randInt(rng, 0, 2);
      if (ctx.ok(x)) ctx.live(thinOut(swayer(L, x, y, 'kash', h, v)));
    }
}

// --- 4. Srimangal tea gardens --------------------------------------------------
const TEA_PROF = [0, 1, 1, 1, 1, 1, 1, 0];          // bush outline across one period (fg)
const TEA_PROF_MID = [1, 2, 2, 2, 1, 0];

// Rows of clipped tea bushes: rows `gap` px apart starting at y0
function teaHedge(lx, y, y0, gap, prof) {
  const r = Math.floor((y - y0) / gap), ry = y0 + r * gap + gap - 2, n = prof.length;
  const h = prof[((lx + r * 4) % n + n) % n];
  if (y <= ry && y >= ry - h) return y === ry - h ? 'grass' : hash2(lx, y) < 0.15 ? 'greenDark' : 'green';
  return null;
}

// Near tea: 6-row bands of a red-earth path, then a clipped hedge whose top
// is scalloped into rounded bushes, then its shadow
function teaFgRow(lx, y) {
  const r = Math.floor((y - 15) / 6), rel = y - 15 - r * 6, n = TEA_PROF.length;
  return [rel, TEA_PROF[((lx + r * 3) % n + n) % n]];
}

function teaFgGround(c, y, lx) {
  if (y < 12) return null;
  if (y < 15) return y === 12 ? (bayer(lx, y) < 10 ? 'grass' : 'green') : hash2(lx >> 1, y) < 0.2 ? 'greenDark' : 'green';
  const [rel, bump] = teaFgRow(lx, y), top = 2 - bump;
  if (rel === 5) return 'greenDark';
  if (rel < top) return rel === 0 && bayer(lx, y) < 6 ? 'rust' : bump ? 'brown' : 'brownDark';
  if (rel === top) return 'grass';
  return hash2(lx, y) < 0.15 ? 'greenDark' : 'green';
}

function teaFar(ctx) {
  const { rng } = ctx;
  for (let x = ctx.from - 60; x < ctx.to; x += randInt(rng, 40, 90)) {
    const w = randInt(rng, 70, 150), h = randInt(rng, 10, 22), tx = x, back = h > 16;
    if (ctx.ok(x + (w >> 1))) ctx.stat(tx, tx + w, back ? 0 : 1, (g, p, lit, ox) =>
      hump(g, tx + ox, 53, w, h, back ? p.haze : p.greenDark, back ? null : p.green));
  }
  fogBands(ctx, 34, 48, 40, 7);
}

function teaMid(ctx) {
  const { rng } = ctx;
  for (let x = ctx.from - 100; x < ctx.to; x += randInt(rng, 90, 170)) {
    const H = { x0: x, w: randInt(rng, 150, 260), h: randInt(rng, 16, 30), seed: randInt(rng, 1, 1e6) };
    if (!ctx.ok(x + (H.w >> 1))) continue;
    ctx.stat(H.x0, H.x0 + H.w, -H.h, (g, p, lit, ox) => teaHill(g, p, H, ox));
    for (let n = randInt(rng, 1, 3); n > 0; n--) {
      const i = randInt(rng, 20, H.w - 20), d = 2 + 4 * randInt(rng, 0, Math.max(0, Math.floor(H.h / 4) - 2));
      if (humpTop(i, H.w, H.h, 36) + d < 34) ctx.live(pickerEnt(H, i, d, rng));
    }
  }
  fogBands(ctx, 10, 26, 60, 6);
}

// A tea hill: rows of bushes following the slope, tall thin shade trees
function teaHill(g, p, H, ox) {
  const rng = mulberry32(H.seed), base = 36, x = H.x0 + ox;
  const top = i => humpTop(i, H.w, H.h, base);
  for (let i = 0; i < H.w; i++) { const t = top(i); if (t < base) { rect(g, x + i, t, 1, base - t + 2, p.greenDark); px(g, x + i, t, p.green); } }
  for (let d = 2; d < H.h; d += 4)
    for (let i = 2; i < H.w - 2; i += 4) {
      const y = top(i) + d;
      if (y >= base) continue;
      rect(g, x + i - 1, y, 3, 1, p.grass);
      px(g, x + i, y - 1, p.grassLight);
    }
  for (let i = randInt(rng, 10, 30); i < H.w - 10; i += randInt(rng, 18, 34)) {
    const t = top(i), ct = t - randInt(rng, 11, 16), cw = randInt(rng, 5, 8), tx = x + i;
    rect(g, tx, ct + 2, 1, t + 2 - ct, p.grayLight);
    px(g, tx - 1, ct + 4, p.grayLight);
    rect(g, tx - cw + 2, ct, 2 * cw - 3, 1, p.green);
    rect(g, tx - cw + 1, ct + 1, 2 * cw - 1, 2, p.greenDark);
    ditherRect(g, tx - cw + 2, ct + 1, 2 * cw - 3, 1, p.green, 6);
  }
}

// --- 5. Sylhet hills -------------------------------------------------------
function hillsFar(ctx) {
  const { rng } = ctx;
  for (let x = ctx.from - 120; x < ctx.to; x += randInt(rng, 60, 120)) {      // tall blue-green range
    const w = randInt(rng, 140, 260), h = randInt(rng, 30, 46), tx = x;
    if (ctx.ok(x + (w >> 1))) ctx.stat(tx, tx + w, 0, (g, p, lit, ox) => hump(g, tx + ox, 53, w, h, p.haze, null, p.skyMid));
  }
  for (let x = ctx.from - 80; x < ctx.to; x += randInt(rng, 50, 100)) {       // nearer, greener ridges
    const w = randInt(rng, 90, 170), h = randInt(rng, 14, 26), tx = x;
    if (ctx.ok(x + (w >> 1))) ctx.stat(tx, tx + w, 1, (g, p, lit, ox) => hump(g, tx + ox, 53, w, h, p.greenDark, p.green));
  }
  fogBands(ctx, 24, 46, 36, 8);
}

function hillsMid(ctx) {
  const { rng, L } = ctx;
  for (let x = ctx.from - 80; x < ctx.to; x += randInt(rng, 70, 140)) {
    const w = randInt(rng, 110, 200), h = randInt(rng, 12, 24), x0 = x, seed = randInt(rng, 1, 1e6);
    const stream = rng() < 0.6 ? streamPath(rng, w, h) : null;
    if (!ctx.ok(x + (w >> 1))) continue;
    ctx.stat(x0, x0 + w, -h, (g, p, lit, ox) => forestHill(g, p, x0 + ox, w, h, seed, stream));
    if (stream) ctx.live(streamFlowEnt(stream.map(([i, y]) => [x0 + i, y]), rng));
  }
  for (let x = ctx.from; x < ctx.to; x += randInt(rng, 16, 40)) {
    const y = randInt(rng, 35, 38), bamboo = rng() < 0.6, h = randInt(rng, 16, 24), n = randInt(rng, 3, 5);
    if (ctx.ok(x)) ctx.live(bamboo ? swayer(L, x, y, 'bamboo', h, n) : swayer(L, x, y, 'betel', h, n - 4));
  }
  fogBands(ctx, 10, 28, 46, 7);
}

// A stream wandering down a hillside from near the crest: [i, y] points
function streamPath(rng, w, h, base = 37) {
  let i = randInt(rng, Math.floor(w * 0.35), Math.floor(w * 0.65));
  const pts = [];
  for (let y = humpTop(i, w, h, base) + 3; y < base; y++) {
    if (y > humpTop(i, w, h, base)) pts.push([i, y]);
    i += randInt(rng, -1, 1) + (rng() < 0.3 ? Math.sign(i - w / 2) : 0);
  }
  return pts;
}

function forestHill(g, p, x, w, h, seed, stream) {
  const rng = mulberry32(seed), base = 37;
  hump(g, x, base, w, h, p.green, p.grass);
  for (let i = 0; i < w * h / 14; i++) {                          // crowns all over the slope
    const j = randInt(rng, 3, w - 4), t = humpTop(j, w, h, base), y = randInt(rng, t + 1, base), r = randInt(rng, 1, 2);
    if (y >= base) continue;
    disc(g, x + j, y, r, p.greenDark);
    px(g, x + j - 1, y - 1, p.grass);
  }
  if (stream) for (const [j, y] of stream) { px(g, x + j, y, p.skyMid); px(g, x + j + 1, y, p.skyLight); }
}

function hillsFg(ctx) {
  const { rng, L } = ctx, streams = [];
  for (let x = ctx.from + randInt(rng, 60, 200); x < ctx.to; x += randInt(rng, 260, 520)) {
    const s = { cx: x, w: randInt(rng, 7, 12) };
    if (!ctx.ok(x)) continue;
    streams.push(s);
    const pts = [];
    for (let y = 14; y < 34; y++) pts.push([Math.round(s.cx + (y - 12) * 0.8) + randInt(rng, -2, 2), y]);
    ctx.live(streamFlowEnt(pts, rng));
  }
  const dry = { ...ctx, ok: x => ctx.ok(x) && !streams.some(s => Math.abs(x - s.cx - 8) < s.w + 14) };
  for (let x = ctx.from; x < ctx.to; x += randInt(rng, 10, 30)) {
    const y = randInt(rng, 15, 33), fern = rng() < 0.5, tx = x;
    if (!dry.ok(x)) continue;
    if (fern) ctx.live(swayer(L, tx, y, 'fern'));
    else ctx.stat(tx - 2, tx + 2, y, (g, p, lit, ox) => { rect(g, tx - 1 + ox, y - 1, 3, 2, p.gray); px(g, tx + ox, y - 1, p.grayLight); });
  }
  addTufts(dry, 12, 13, 16);
  return { streams };
}

// Grass, and a hill stream running out from a culvert under the track
function hillsFgGround(s, y, lx) {
  if (y < 12) return null;
  if (s) {
    const d = Math.abs(lx - (s.cx + (y - 12) * 0.8)), hw = s.w / 2 + (y - 12) * 0.12;
    if (d < hw) return y < 14 ? 'navy' : hash2(lx >> 1, y) < 0.12 ? 'skyLight' : 'skyMid';
    if (d < hw + 2) return hash2(lx, y) < 0.4 ? 'grayLight' : 'gray';
  }
  if (y === 12) return bayer(lx, y) < 10 ? 'grass' : 'green';
  return hash2(lx >> 1, y) < 0.16 ? 'greenDark' : hash2(lx, y + 99) < 0.05 ? 'grass' : 'green';
}

// --- live entities -----------------------------------------------------------
// Every entity: { x0, x1 (layer columns it may cover), z (draw order),
// draw(g, v, ox, oy, t) } with screen x = lx + ox and screen y = y + oy.

// Glints on water: [lx, y, w, phase, rate] dashes that wink on and off
function shimmerEnt(dashes, z, cols = ['skyLight', 'white']) {
  let x0 = Infinity, x1 = -Infinity;
  for (const d of dashes) { x0 = Math.min(x0, d[0]); x1 = Math.max(x1, d[0] + d[2] + 1); }
  return { x0, x1, z, draw(g, v, ox, oy, t) {
    for (const [x, y, w, ph, rate] of dashes) {
      const s = Math.sin(t * rate + ph);
      if (s > 0.35) rect(g, x + ox + (s > 0.8 ? 1 : 0), y + oy, w, 1, v.p[s > 0.8 ? cols[1] : cols[0]]);
    }
  } };
}

// Split a long run of dashes into entities of ~64 px so culling stays cheap
function chunkedShimmer(ctx, dashes, z, cols) {
  dashes.sort((a, b) => a[0] - b[0]);
  for (let i = 0; i < dashes.length; ) {
    const grp = [], end = dashes[i][0] + 64;
    while (i < dashes.length && dashes[i][0] < end) grp.push(dashes[i++]);
    ctx.live(shimmerEnt(grp, z, cols));
  }
}

// Water running downhill: bright points travel along the path
function streamFlowEnt(pts, rng) {
  const ph = rng() * 6;
  let x0 = Infinity, x1 = -Infinity;
  for (const [x] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x + 1); }
  return { x0, x1, z: 1, draw(g, v, ox, oy, t) {
    for (let k = 0; k < pts.length; k++)
      if ((((k - t * 6 + ph) % 5) + 5) % 5 < 1) px(g, pts[k][0] + ox, pts[k][1] + oy, v.p.white);
  } };
}

function tinySailEnt(lx, y, rng) {
  const ph = rng() * 6;
  return { x0: lx - 12, x1: lx + 12, z: y, draw(g, v, ox, oy, t) {
    const p = v.p, x = Math.round(lx + Math.sin(t * 0.04 + ph) * 8) + ox, yy = y + oy;
    rect(g, x - 2, yy, 5, 1, p.brownDark);
    rect(g, x, yy - 3, 1, 3, p.cream);
    px(g, x + 1, yy - 2, p.cream);
  } };
}

// Country boats (nouka): sails patched with odd bits of cloth, or a
// bamboo-hooded cargo boat poled along
