  let x = 6;
  drawText(g, label, x, ty, PALETTE.grayLight);  x += lw + 6;
  drawMask(g, m, x, (h - m.h) >> 1, PALETTE.glow); x += m.w + 5;
  drawText(g, '/', x, ty, PALETTE.slate);          x += 8;
  drawText(g, st.en, x, ty, PALETTE.white);
  return (bannerCache[i] = c);
}

function drawBanner(g) {
  const b = bannerSprite(ui.bannerSt), y = Math.round(ui.bannerY);
  if (y <= -b.height) return;
  g.drawImage(b, Math.max(input.debug ? ui.debugW + 4 : 2, (W - b.width) >> 1), y);
}

// "Journey complete" panel with a restart button (normal + hover sprites)
const PANEL = { w: 172, h: 64 };
const COMPLETE_BN = textMask('যাত্রা সম্পন্ন', CONFIG.BN_SIZE);
let panelSprites = null;

function panelButton() {
  const bw = textWidth('RESTART TRIP') + 12, bh = 11;
  return { x: (PANEL.w - bw) >> 1, y: PANEL.h - bh - 6, w: bw, h: bh };
}

function buildPanel(hover) {
  const { w, h } = PANEL, [c, g] = makeCanvas(w, h), m = COMPLETE_BN;
  const first = STATIONS[0], last = STATIONS[LAST_STATION];
  rect(g, 0, 0, w, h, PALETTE.slate);
  rect(g, 1, 1, w - 2, h - 2, PALETTE.ink);
  const title = 'JOURNEY COMPLETE';
  drawText2x(g, title, (w - title.length * 8 + 2) >> 1, 7, PALETTE.glow);
  drawMask(g, m, (w - m.w) >> 1, 21, PALETTE.white);
  const route = first.en + ' > ' + last.en + '  ' + (last.km - first.km) + ' KM';
  drawText(g, route, (w - textWidth(route)) >> 1, 25 + m.h, PALETTE.grayLight);
  const b = panelButton();
  rect(g, b.x, b.y, b.w, b.h, PALETTE.grassLight);
  rect(g, b.x + 1, b.y + 1, b.w - 2, b.h - 2, hover ? PALETTE.grass : PALETTE.green);
  drawText(g, 'RESTART TRIP', b.x + 6, b.y + 3, PALETTE.white);
  return c;
}

function drawPanel(g) {
  const y = Math.round(ui.panelY);
  if (y <= -PANEL.h) return;
  panelSprites = panelSprites || [buildPanel(false), buildPanel(true)];
  g.drawImage(panelSprites[ui.hover ? 1 : 0], (W - PANEL.w) >> 1, y);
}

function buttonHit(x, y) {
  if (!ui.complete) return false;
  const b = panelButton(), bx = ((W - PANEL.w) >> 1) + b.x, by = Math.round(ui.panelY) + b.y;
  return x >= bx && x < bx + b.w && y >= by && y < by + b.h;
}

function drawDebug(g) {
  const stopped = sim.state === 'STOPPED';
  const st = STATIONS[stopped ? sim.station : Math.min(sim.station + 1, LAST_STATION)];
  const lines = [
    'STATE ' + sim.state + (stopped ? ' ' + sim.stopPhase.replace('_', ' ') : ''),
    'SPEED ' + sim.speed.toFixed(1) + ' PX/S',
    'DIST  ' + Math.floor(sim.dist) + ' PX',
    (stopped ? 'AT    ' : 'NEXT  ') + st.en,
    stopped ? 'PEOPLE ' + sim.people.length : 'IN    ' + Math.ceil(sim.nextStop - sim.dist) + ' PX',
    'TIME  ' + phaseLabel(sim.dayTime),
  ];
  if (input.fast) lines.push('FAST FORWARD X' + CONFIG.FAST_FACTOR);
  lines.push('D DEBUG  F FAST  T TIME', 'M SOUND ' + (audio.muted ? 'OFF' : 'ON') + '  R RESTART');
  const w = Math.max(...lines.map(textWidth)) + 6, h = lines.length * 7 + 4;
  rect(g, 2, 2, w, h, PALETTE.slate);
  rect(g, 3, 3, w - 2, h - 2, PALETTE.ink);
  lines.forEach((s, i) =>
    drawText(g, s, 5, 5 + i * 7, i >= lines.length - 2 ? PALETTE.grayLight : i === 0 ? PALETTE.glow : PALETTE.white));
  ui.debugW = w + 2;
}

// --- sound: synthesised diesel horn (browsers unlock audio on first input)
const audio = { ctx: null, muted: false };

function unlockAudio() {
  if (!audio.ctx) {
    try { audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  }
  if (audio.ctx.state === 'suspended') audio.ctx.resume();
}

// Three sawtooth voices (a minor-ish chord, like a twin-tone air horn)
// through a low-pass filter, with a short pitch scoop at the start
function playHorn() {
  const ac = audio.ctx;
  if (!ac || audio.muted || ac.state !== 'running') return;
  const t0 = ac.currentTime, dur = 1.25;
  const out = ac.createGain();
  out.gain.setValueAtTime(0, t0);
  out.gain.linearRampToValueAtTime(0.12, t0 + 0.06);
  out.gain.setValueAtTime(0.12, t0 + dur - 0.2);
  out.gain.linearRampToValueAtTime(0, t0 + dur);
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 1600;
  lp.connect(out);
  out.connect(ac.destination);
  for (const f of [277.2, 349.2, 415.3]) {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f * 0.96, t0);
    o.frequency.linearRampToValueAtTime(f, t0 + 0.1);
    o.connect(lp);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }
}

// --- input --------------------------------------------------------------
addEventListener('keydown', e => {
  unlockAudio();
  if (e.code === 'KeyF') input.fast = true;
  if (e.repeat) return;
  if (e.code === 'KeyD') input.debug = !input.debug;
  if (e.code === 'KeyT') skipTimeOfDay();
  if (e.code === 'KeyM') audio.muted = !audio.muted;
  if (e.code === 'KeyR' || (ui.complete && (e.code === 'Enter' || e.code === 'Space'))) startJourney();
});
addEventListener('keyup', e => { if (e.code === 'KeyF') input.fast = false; });
addEventListener('blur', () => { input.fast = false; });

function toInternal(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
canvas.addEventListener('pointermove', e => {
  ui.hover = buttonHit(...toInternal(e));
  canvas.style.cursor = ui.hover ? 'pointer' : 'default';
});
canvas.addEventListener('pointerdown', e => {
  unlockAudio();
  if (buttonHit(...toInternal(e))) { startJourney(); ui.hover = false; canvas.style.cursor = 'default'; }
});

// =====================================================================
// 10. MAIN LOOP
// =====================================================================
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// second buffer for dithered cross-fades between lightings
const [bufB, bctx] = makeCanvas(W, H);
const DITHER_MASKS = [];
for (let level = 0; level <= 16; level++) {
  const [c, g] = makeCanvas(4, 4);
  for (let y = 0; y < 4; y++)
    for (let x = 0; x < 4; x++) if (bayer(x, y) < level) px(g, x, y, PALETTE.ink);   // alpha only
  DITHER_MASKS.push(bctx.createPattern(c, 'repeat'));
}

const VARIANTS = { day: buildVariant('day'), dusk: buildVariant('dusk'), night: buildVariant('night') };

function renderScene(g, v) {
  const d = sim.dist;
  g.drawImage(v.sky, 0, 0);                                               // 1. sky (static)
  drawTiled(g, v.clouds, d * PARALLAX.clouds + sim.cloudDrift, LAYER_Y.clouds); // 2. clouds
  drawBackdrops(g, v, 'far');                                             //    city, hills
  drawTiled(g, v.far, d * PARALLAX.far, LAYER_Y.far);                     // 3. tree line
  drawTiled(g, v.mid, d * PARALLAX.mid, LAYER_Y.mid);                     // 4. fields, houses
  drawBackdrops(g, v, 'mid');                                             //    river, tea
  drawTiled(g, v.poles, d * PARALLAX.track, LAYER_Y.poles);               // 5. poles + wires
  drawTiled(g, v.track, d * PARALLAX.track, LAYER_Y.track);               //    gravel, rails
  drawTrain(g, v);
  drawSmoke(g, v);
  drawTiled(g, v.fg, d * PARALLAX.fg, LAYER_Y.fg);                        // 6. grass tufts
  drawStationFront(g, v);                                                 //    platform, people
}

function render() {
  const { a, b, f } = lightingAt(sim.dayTime);
  const level = Math.round(f * 16);
  renderScene(ctx, VARIANTS[level >= 16 ? b : a]);
  if (level > 0 && level < 16) {
    // keep lighting B only on pixels of the Bayer mask, then lay it over A
    renderScene(bctx, VARIANTS[b]);
    bctx.globalCompositeOperation = 'destination-in';
    bctx.fillStyle = DITHER_MASKS[level];
    bctx.fillRect(0, 0, W, H);
    bctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(bufB, 0, 0);
  }
  ui.debugW = 0;
  if (input.debug) drawDebug(ctx);
  drawBanner(ctx);
  drawPanel(ctx);
}

// --- scale to the window, keeping 16:9 --------------------------------
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit);
fit();

// --- fixed-timestep loop ----------------------------------------------
let acc = 0, last = 0;
function frame(now) {
  const dt = Math.min(CONFIG.MAX_FRAME, (now - last) / 1000);
  last = now;
  acc += dt * (input.fast ? CONFIG.FAST_FACTOR : 1);
  let steps = 0;
  while (acc >= CONFIG.STEP && steps < 120) {
    update(CONFIG.STEP);
    acc -= CONFIG.STEP;
    steps++;
  }
  render();
  requestAnimationFrame(frame);
}
startJourney();
requestAnimationFrame(now => { last = now; render(); requestAnimationFrame(frame); });
</script>
