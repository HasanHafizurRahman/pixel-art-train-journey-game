const NOUKA = {
  sail: ['.....s......', '.....ss.....', '.....sps....', '.....ssqs...', '.....sspss..', '.....sssqss.',
         '.....m......', 'h....m.....h', 'hhhhhhhhhhhh', '.dddddddddd.'],
  hood: ['...tttt..b..', '..tttttt.b..', 'h.tttttt.b.h', 'hhhhhhhhhhhh', '.dddddddddd.'],
};

function noukaEnt(lx, wl, rng, type) {
  const tpl = NOUKA[type], ph = rng() * 6, drift = randInt(rng, 10, 26);
  return { x0: lx - drift - 7, x1: lx + drift + 8, z: wl, draw(g, v, ox, oy, t) {
    const p = v.p, x = Math.round(lx + Math.sin(t * 0.035 + ph) * drift) - 6 + ox;
    const y = wl + oy - tpl.length + 1 + (Math.sin(t * 1.3 + ph) > 0.75 ? 1 : 0);
    stamp(g, tpl, x, y, { s: p.cream, p: p.tan, q: p.rust, m: p.brownDark, t: p.tan, b: p.ink, h: p.brown, d: p.brownDark });
    if (type === 'sail' && Math.sin(t * 2.1 + ph) > 0.3) px(g, x + 11, y + 5, p.cream);   // the sail's edge flutters
    px(g, x - 1, wl + oy, p.skyLight);
    px(g, x + 12, wl + oy, p.skyLight);
  } };
}

// A fisherman in a small boat throwing a cast net (jal), on a loop:
// hold, swing it up, throw, let it sink, haul it back in
function fisherEnt(lx, wl, rng, big) {
  const ph = rng() * 7, dir = rng() < 0.5 ? 1 : -1, s = big ? 2 : 1;
  const d = big ? makeDesign(rng, 'lungi') : null;
  const shirt = pick(rng, ['white', 'skyLight', 'paddy', 'rose']), lungi = pick(rng, LUNGIS)[0];
  if (d) d.carry = null;
  const reach = 15 * s;
  return { x0: lx - reach, x1: lx + reach, z: wl, draw(g, v, ox, oy, t) {
    drawFisher(g, v, lx + ox, wl + oy, (t + ph) % 7, dir, s, d, shirt, lungi);
  } };
}

// Mirror painter for the small figures drawn live: set origin and facing
// once, then plot offsets in palette keys (no closures in the frame loop)
const MP = { g: null, p: null, x: 0, y: 0, dir: 1 };
function mpAt(g, p, x, y, dir) { MP.g = g; MP.p = p; MP.x = x; MP.y = y; MP.dir = dir; }
function mp(dx, dy, key) { MP.g.fillStyle = MP.p[key]; MP.g.fillRect(MP.x + dx * MP.dir, MP.y + dy, 1, 1); }
function mpRect(dx, dy, w, h, key) {
  MP.g.fillStyle = MP.p[key];
  MP.g.fillRect(MP.dir > 0 ? MP.x + dx : MP.x - dx - w + 1, MP.y + dy, w, h);
}

function drawFisher(g, v, x, y, c, dir, s, d, shirt, lungi) {
  mpAt(g, v.p, x, y, dir);
  const hl = 5 * s;
  mpRect(-hl, 0, 2 * hl + 1, 1, 'brownDark');                               // hull, raised at both ends
  mpRect(-hl + 1, -1, 2 * hl - 1, 1, 'brown');
  for (let e = -1; e <= 1; e += 2) { mp(e * (hl + 1), -1, 'brown'); mp(e * (hl + 1), -2, 'brown'); mp(e * (hl + 2), 1, 'skyLight'); }
  const phase = c < 2.5 ? 0 : c < 3.1 ? 1 : c < 3.8 ? 2 : c < 5.5 ? 3 : 4;   // hold, raise, throw, wait, haul
  const fx = -hl + 2 * s, up = phase === 1 || phase === 2;                   // he stands at the stern
  let hx, hy;                                                                // his hand
  if (d) {
    g.drawImage(personSprite(v, d, up ? 6 : 0, dir), x + fx * dir - PERSON_CX, y - 1 - PERSON_FY);
    hx = fx + (up ? 2 : 1); hy = up ? -10 : -5;          // hand position in personSprite frames 6 / 0
  } else {
    const bent = phase === 4;
    mp(fx, -2, lungi); mp(fx, -3, lungi); mp(fx, -4, shirt);
    mp(fx + (bent ? 1 : 0), -5, bent ? 'brown' : shirt);
    if (!bent) mp(fx, -6, 'brown');
    hx = fx + 1; hy = up ? -7 : -4;
    mp(hx, hy, 'brown');
  }
  const D = 9 * s, R = 4 * s;
  if (phase === 0) mp(hx, hy + 1, 'grayDark');
  else if (phase === 1) mp(hx, hy - 1, 'grayLight');
  else if (phase === 2) {
    const k = (c - 3.1) / 0.7;
    netRing(hx + k * (D - hx), hy * (1 - k) - Math.sin(k * Math.PI) * 4 * s, 1 + k * (R - 1), -1);
  } else {
    const k = phase === 3 ? 0 : (c - 5.5) / 1.5;
    const cx = Math.round(D + (hx - D) * k), r = Math.max(1, Math.round(R * (1 - k * 0.8)));
    netRing(cx, -1, r, phase === 3 ? (c - 3.8) / 1.7 : 0.9);
    for (let i = 1; i < 4; i++) mp(Math.round(hx + (cx - hx) * i / 4), Math.round(hy + (-1 - hy) * i / 4), 'grayDark');   // the line
  }
}

// The cast net as a half ellipse of knots; sink 0..1 dissolves it
function netRing(cx, cy, r, sink) {
  const n = Math.round(6 + r * 2);
  for (let i = 0; i < n; i++) {
    const a = Math.PI * i / (n - 1), qx = Math.round(cx + Math.cos(a) * r), qy = Math.round(cy - Math.sin(a) * r * 0.45);
    if (sink < 0 || bayer(qx + MP.x, qy + MP.y) >= sink * 12) mp(qx, qy, 'grayLight');
  }
}

function hyacinthEnt(lx, y, rng) {
  const w = randInt(rng, 3, 7), ph = rng() * 6, flower = rng() < 0.5;
  return { x0: lx - 6, x1: lx + w + 6, z: y, draw(g, v, ox, oy, t) {
    const p = v.p, x = Math.round(lx + Math.sin(t * 0.12 + ph) * 4) + ox, yy = y + oy;
    rect(g, x, yy, w, 1, p.greenDark);
    rect(g, x + 1, yy - 1, w - 2, 1, p.green);
    px(g, x + 2, yy - 2, p.grass);
    if (flower) px(g, x + w - 2, yy - 2, p.purple);
    px(g, x - 1, yy + 1, p.skyLight);
  } };
}

function duckEnt(pd, rng) {
  const ph = rng() * 6, sp = 0.15 + rng() * 0.2, range = pd.rx - 5, y = pd.cy + randInt(rng, -pd.ry + 2, pd.ry - 1), white = rng() < 0.6;
  return { x0: pd.cx - pd.rx, x1: pd.cx + pd.rx, z: y, draw(g, v, ox, oy, t) {
    const a = t * sp + ph, dir = Math.cos(a) >= 0 ? 1 : -1, body = white ? 'white' : 'tan';
    mpAt(g, v.p, Math.round(pd.cx + Math.sin(a) * range) + ox, y + oy - (Math.sin(t * 2.3 + ph) > 0.7 ? 1 : 0), dir);
    mp(1, -2, white ? body : 'greenDark');                                   // head
    mp(2, -2, 'orange');                                                     // bill
    mpRect(-1, -1, 3, 1, body);
    mp(-2, -2, body);                                                        // tail up
    if (Math.abs(Math.cos(a)) > 0.3) { mp(-3, 0, 'skyLight'); mp(-4, 1, 'skyLight'); }   // wake
  } };
}

// A zebu grazing: head down, chewing, now and then looking up; tail swishes
const COW_LEGS = [-4, -2, 2, 3];
function cowEnt(lx, y, rng) {
  const ph = rng() * 20, dir = rng() < 0.5 ? 1 : -1;
  const [c0, c1] = pick(rng, [['white', 'cloudShade'], ['tan', 'brown'], ['brown', 'brownDark'], ['white', 'grayDark']]);
  return { x0: lx - 9, x1: lx + 9, z: y, draw(g, v, ox, oy, t) {
    mpAt(g, v.p, lx + ox, y + oy, dir);
    mpRect(-4, -6, 8, 4, c0);
    mpRect(-3, -3, 6, 1, c1);
    mp(-2, -5, c1); mp(-1, -5, c1); mp(1, -6, c1);                            // patches
    mp(2, -7, c0); mp(3, -7, c0);                                            // hump
    for (let i = 0; i < 4; i++) mpRect(COW_LEGS[i], -2, 1, 2, c1);           // legs
    if (Math.sin(t * 0.35 + ph) > 0.6) {                                     // looking up
      mpRect(4, -7, 2, 2, c0); mp(6, -6, c0); mp(4, -8, c1); mp(5, -8, 'cream');
    } else {                                                                 // grazing, chewing
      const chew = Math.floor(t * 2 + ph) & 1;
      mp(4, -4, c0); mp(5, -4 + chew, c0); mp(4, -3 + chew, c0); mp(5, -2 + chew, c0); mp(5, -1 + chew, 'ink');
    }
    const swish = Math.floor(t * 3 + ph) % 7 === 0;
    mp(-5, -6, c1); mp(swish ? -6 : -5, -5, c1); mp(swish ? -7 : -5, -4, 'ink');
  } };
}

// Cycle rickshaw (painted hood, a passenger) or a bicycle, pedalling along
// the dirt road and turning round at its ends
function rickshawEnt(a, b, y, rng, bike) {
  const len = b - a - 30, ph = rng() * len * 2, sp = bike ? randInt(rng, 12, 18) : randInt(rng, 8, 12);
  const o = { bike, hood: pick(rng, ['red', 'blue', 'green', 'purple', 'orange']), shirt: pick(rng, SHIRTS),
              lungi: pick(rng, LUNGIS)[0], skin: pick(rng, SKINS), pax: !bike && rng() < 0.6,
              paxCol: pick(rng, SARIS)[0], cargo: bike && rng() < 0.4 };
  return { x0: a, x1: b, z: y, draw(g, v, ox, oy, t) {
    const s = (t * sp + ph) % (2 * len), fwd = s < len;
    drawRickshaw(g, v.p, Math.round(a + 15 + (fwd ? s : 2 * len - s)) + ox, y + oy, fwd ? 1 : -1, t, o);
  } };
}

const WHEEL_RING = [-1, -2, 0, -2, 1, -2, -2, -1, 2, -1, -2, 0, 2, 0, -2, 1, 2, 1, -1, 2, 0, 2, 1, 2];
function cycleWheel(cx, cy, spin) {
  for (let i = 0; i < WHEEL_RING.length; i += 2) mp(cx + WHEEL_RING[i], cy + WHEEL_RING[i + 1], 'ink');
  mp(cx, cy, 'grayLight');
  if (spin) { mp(cx, cy - 1, 'gray'); mp(cx, cy + 1, 'gray'); } else { mp(cx - 1, cy, 'gray'); mp(cx + 1, cy, 'gray'); }
}

function cycleRider(rx, o, pedal) {
  mpRect(rx, -11, 2, 4, o.shirt);
  mpRect(rx, -13, 2, 1, 'ink');
  mpRect(rx, -12, 2, 1, o.skin);
  mpRect(rx, -7, 2, 2, o.lungi);
  if (pedal) { mp(rx + 1, -5, o.skin); mp(rx, -4, o.skin); } else { mp(rx, -5, o.skin); mp(rx + 1, -4, o.skin); }
  mp(rx + 2, -10, o.skin);
}

function drawRickshaw(g, p, x, y, dir, t, o) {
  mpAt(g, p, x, y, dir);
  const spin = Math.floor(t * 8) & 1, pedal = Math.floor(t * 5) & 1;
  if (o.bike) {
    cycleWheel(-3, -2, spin); cycleWheel(4, -2, spin);
    mpRect(-2, -4, 6, 1, 'grayDark'); mp(0, -5, 'grayDark'); mpRect(3, -7, 1, 3, 'grayDark'); mp(4, -8, 'grayDark');
    if (o.cargo) { mpRect(-5, -6, 3, 2, 'grayLight'); mp(-4, -7, 'gray'); }   // milk cans on the carrier
    cycleRider(0, o, pedal);
  } else {
    cycleWheel(-4, -2, spin); cycleWheel(5, -2, spin);
    mpRect(-4, -4, 9, 1, 'grayDark'); mpRect(5, -9, 1, 6, 'grayDark'); mp(5, -10, 'grayDark');
    if (o.pax) { mp(-5, -11, 'ink'); mp(-5, -10, o.skin); mpRect(-6, -9, 2, 3, o.paxCol); }
    mpRect(-7, -6, 5, 1, o.hood); mpRect(-7, -5, 5, 1, 'ink'); mp(-5, -4, 'glow');    // seat and painted panel
    mpRect(-7, -13, 5, 1, o.hood); mpRect(-8, -12, 1, 6, o.hood); mp(-3, -12, 'glow'); // folded hood
    cycleRider(2, o, pedal);
  }
}

// Tea picker with a basket on her back, working slowly along a row and
// stooping now and then to pluck the leaves
function pickerEnt(H, i, d, rng) {
  const ph = rng() * 20, cloth = pick(rng, SARIS)[0], skin = pick(rng, SKINS), range = 8;
  return { x0: H.x0 + i - range - 3, x1: H.x0 + i + range + 3, z: 50, draw(g, v, ox, oy, t) {
    const a = t * 0.06 + ph, j = Math.round(i + Math.sin(a) * range);
    mpAt(g, v.p, H.x0 + j + ox, humpTop(j, H.w, H.h, 36) + d + oy, Math.cos(a) >= 0 ? 1 : -1);
    mpRect(0, -3, 1, 3, cloth);
    mp(-1, -5, 'tan'); mp(-1, -4, 'tan');                                    // basket
    if (Math.sin(t * 0.7 + ph * 3) > 0.2) { mp(1, -4, cloth); mp(2, -4, skin); mp(2, -3, skin); mp(0, -5, 'brown'); }
    else { mp(0, -4, cloth); mp(0, -5, skin); mp(0, -6, cloth); mp(1, -3, skin); mp(-1, -3, 'brown'); }
  } };
}

// --- the line: poles and ballast on land, the bridge over the Meghna -------
let bridgeX0 = 0, bridgeX1 = 0;                  // screen x of the abutments, set by bridgeX()
function bridgeX() {
  const cam = Math.floor(sim.dist);
  bridgeX0 = BRIDGE.u0 - cam + ANCHOR_X;
  bridgeX1 = BRIDGE.u1 - cam + ANCHOR_X;
}

// Clip to a band of screen columns; call g.restore() when it returns true
function clipBegin(g, xa, xb) {
  xa = Math.max(xa, -64); xb = Math.min(xb, W + 64);
  if (xb <= xa) return false;
  g.save();
  g.beginPath();
  g.rect(xa, 0, xb - xa, H);
  g.clip();
  return true;
}

function drawLand(g, v, d) {
  drawTiled(g, v.poles, d, LAYER_Y.poles);
  drawTiled(g, v.track, d, LAYER_Y.track);
}

function drawLine(g, v) {
  const d = sim.dist;
  bridgeX();
  const b0 = bridgeX0, b1 = bridgeX1;
  if (b1 <= -40 || b0 >= W + 40) { drawLand(g, v, d); return; }
  if (clipBegin(g, -64, b0)) { drawLand(g, v, d); g.restore(); }
  if (clipBegin(g, b1, W + 64)) { drawLand(g, v, d); g.restore(); }
  if (clipBegin(g, b0, b1)) { drawTiled(g, v.deck, d, LAYER_Y.track); g.restore(); }
  for (let k = 1; k < BRIDGE.spans; k++) g.drawImage(v.pier, b0 + k * BRIDGE.span - 5, PIER_Y);
  g.drawImage(v.abutment[0], b0 - 14, 147);
  g.drawImage(v.abutment[1], b1 - 2, 147);
  drawTruss(g, v, false);
}

// Far truss behind the train; near truss drawn over it, so the train runs
// behind the lattice
function drawTruss(g, v, near) {
  bridgeX();
  const spr = near ? v.trussNear : v.trussFar;
  for (let k = 0; k < BRIDGE.spans; k++) {
    const x = bridgeX0 + k * BRIDGE.span;
    if (x < W && x + spr.width > 0) g.drawImage(spr, x, near ? TRUSS_Y : TRUSS_Y - 4);
  }
}

// Wavy reflection of the train and bridge in the open water under the deck:
// rows above the axis are copied upside down and squashed 2:1 (so the
// carriage bodies show), each nudged sideways by a ripple, then a
// water-coloured dither knocks them back
function drawReflection(g, v) {
  const d = sim.dist, f = PARALLAX.fg;
  const xa = Math.max(0, Math.ceil(ANCHOR_X + (BRIDGE.u0 - d) * f));
  const xb = Math.min(W, Math.floor(ANCHOR_X + (BRIDGE.u1 - d) * f));
  if (xb <= xa) return;
  const y0 = LAYER_Y.fg + 15, top = REFLECT_AXIS - 2 * (H - y0);
  rctx.clearRect(0, 0, W, REFLECT_AXIS - top);
  rctx.drawImage(g.canvas, 0, top, W, REFLECT_AXIS - top, 0, 0, W, REFLECT_AXIS - top);   // one snapshot
  for (let y = y0; y < H; y++) {
    const wob = Math.round(Math.sin(y * 1.3 + sim.clock * 3.2) * (y - y0 + 4) / 9);
    g.drawImage(reflectBuf, xa, REFLECT_AXIS - 2 * (y - y0) - 1 - top, xb - xa, 1, xa + wob, y, xb - xa, 1);
  }
  g.fillStyle = v.waterTint;
  g.fillRect(xa, y0, xb - xa, H - y0);
  for (let i = 0; i < 12; i++) {                       // fade out towards the banks
    g.fillStyle = v.waterFade[16 - Math.round(i * 4 / 3)];
    if (xa > 0) g.fillRect(xa + i, y0, 1, H - y0);
    if (xb < W) g.fillRect(xb - 1 - i, y0, 1, H - y0);
  }
}

// How much of the train is on the bridge: onBridge as a flag, bridgeMix
// 0..1 so the rumble turns louder and more metallic as the rake runs on
function updateBridge() {
  const rear = sim.dist + TRAIN.vehicles[TRAIN.vehicles.length - 1].x - ANCHOR_X;
  const front = sim.dist + CONFIG.TRAIN_FRONT_X - ANCHOR_X;
  const over = Math.max(0, Math.min(front, BRIDGE.u1) - Math.max(rear, BRIDGE.u0));
  sim.bridgeMix = over / (front - rear);
  sim.onBridge = over > 0;
}

// --- screen-space visitors: birds crossing the sky, kash seed fluff -------
const birdPool = makePool(CONFIG.BIRD_MAX[0], () => ({ kind: '', x: 0, y: 0, vx: 0, depth: 0, age: 0, ph: 0 }));
const fluffPool = makePool(CONFIG.FLUFF_MAX[0], () => ({ x: 0, y: 0, vx: 0, depth: 0, age: 0, life: 0, ph: 0, big: false }));

function trySpawnBird(si, w, dt) {
  const b = SECTIONS[TERRAIN[si].id].birds, rng = sim.fxRng;
  if (!b || w <= 0 || rng() >= b[1] * w * dt) return;
  const q = poolSpawn(birdPool, cap('BIRD_MAX'));
  if (!q) return;
  const left = rng() < 0.3, sp = 14 + rng() * 22;
  q.kind = b[0]; q.x = left ? -6 : W + 6; q.y = 64 + rng() * 40; q.vx = left ? sp : -sp;
  q.depth = 0.4 + rng() * 0.3; q.age = 0; q.ph = rng() * 4;
}

function updateBirds(dt) {
  const here = terrainAt(sim.dist), a = here.a, b = here.b, t = here.t;
  trySpawnBird(a, 1 - t, dt);
  if (b !== a) trySpawnBird(b, t, dt);
  for (let i = 0; i < birdPool.n; ) {
    const q = birdPool.items[i];
    q.age += dt;
    q.x += (q.vx - sim.speed * q.depth) * dt;          // air is still relative to the ground
    q.y += Math.sin(q.age * 0.9 + q.ph) * 3 * dt;
    if (q.x > -12 && q.x < W + 12) i++;
    else poolKill(birdPool, i);
  }
}

const WING_LIFT = [-1, 0, 1, 0];
function drawBirds(g, v) {
  const p = v.p;
  for (let n = 0; n < birdPool.n; n++) {
    const q = birdPool.items[n], x = Math.round(q.x), y = Math.round(q.y), face = Math.sign(q.vx);
    const span = q.kind === 'egret' ? 3 : 2, rate = q.kind === 'hawk' ? 1.5 : q.kind === 'egret' ? 4 : 7;
    let f = Math.floor(q.age * rate + q.ph) % 4;
    if (q.kind === 'hawk' && f !== 2) f = 1;           // mostly gliding
    const lift = WING_LIFT[f];
    const body = q.kind === 'hawk' ? p.brownDark : p.white, tip = q.kind === 'gull' ? p.grayDark : q.kind === 'hawk' ? p.ink : p.white;
    for (let i = 1; i <= span; i++) {
      const yy = y + (i === span ? lift : Math.round(lift / 2));
      px(g, x - i, yy, i === span ? tip : body);
      px(g, x + i, yy, i === span ? tip : body);
    }
    px(g, x, y, body);
    px(g, x + face, y - (q.kind === 'egret' ? 1 : 0), body);
    if (q.kind === 'egret') { px(g, x + 2 * face, y - 1, p.amber); px(g, x - 2 * face, y + 1, p.ink); }
  }
}

function updateFluff(dt) {
  const rng = sim.fxRng;
  sim.fluffAcc += 9 * sectionWeight('kash', sim.dist) * dt;
  while (sim.fluffAcc >= 1) {
    sim.fluffAcc -= 1;
    const f = poolSpawn(fluffPool, cap('FLUFF_MAX'));
    if (!f) continue;
    f.depth = 0.5 + rng() * 0.8;                       // nearer seeds sail past faster and lower
    f.x = rng() * (W + 60); f.y = f.depth > 1 ? 140 + rng() * 34 : 100 + rng() * 22;
    f.vx = -(sim.speed * f.depth) - 6; f.age = 0; f.life = 4 + rng() * 5; f.ph = rng() * 6; f.big = rng() < 0.3;
  }
  for (let i = 0; i < fluffPool.n; ) {
    const f = fluffPool.items[i];
    f.age += dt;
    f.vx += (-(sim.speed * f.depth) - 6 - f.vx) * Math.min(1, dt * 1.5);
    f.x += f.vx * dt;
    f.y += (-3 + Math.sin(f.age * 1.7 + f.ph) * 7) * dt;
    if (f.age < f.life && f.x > -4 && f.y > -4) i++;
    else poolKill(fluffPool, i);
  }
}

function drawFluff(g, v) {
  for (let i = 0; i < fluffPool.n; i++) {
    const f = fluffPool.items[i], x = Math.round(f.x), y = Math.round(f.y);
    if (bayer(x, y) >= (f.life - f.age) * 16) continue;   // dissolves in its last second
    px(g, x, y, v.p.white);
    if (f.big) { px(g, x - 1, y, v.p.cloudShade); px(g, x + 1, y - 1, v.p.cloudShade); }
  }
}

// Kash section's big white cumulus, faded in with an ordered dither
function drawCumulus(g, v, weight) {
  const level = Math.round(weight * 16), off = sim.dist * 0.07 + sim.cloudDrift * 1.4;
  if (level <= 0) return;
  if (level >= 16) { drawTiled(g, v.cumulus, off, 2); return; }
  sctx.clearRect(0, 0, W, 64);
  drawTiled(sctx, v.cumulus, off, 2);
  sctx.globalCompositeOperation = 'destination-in';
  sctx.fillStyle = DITHER_MASKS[level];
  sctx.fillRect(0, 0, W, 64);
  sctx.globalCompositeOperation = 'source-over';
  g.drawImage(scratch, 0, 0, W, 64, 0, 0, W, 64);
}

// =====================================================================
// 6. STATIONS
// =====================================================================
// Platforms are on the near side of the line, so passengers, benches and
// pillars stand in front of the train. Station content is laid out in
// "stop coordinates" - its screen x while the train stands there - so
//   screen x = stopX + station.dist - camera.

// Roof styles: y0/h of the roof sprite, pillarTop where pillars start
const ROOFS = {
  umbrella: { y0: 78, h: 14, pillarTop: 84 },            // Kamalapur's concrete umbrellas
  canopy:   { y0: 86, h: 7, pillarTop: 93, span: [30, 258] },
  shelter:  { y0: 93, h: 7, pillarTop: 100, span: [186, 266] },
};
const BOARD_TOP = 93;

const STATIONS = ROUTE.map((r, index) => {
  const st = { ...STATION_DEFAULTS, ...r, index };
  st.dist = Math.round(st.km * CONFIG.PX_PER_KM);
  st.bnMask = textMask(st.bn, CONFIG.BN_SIZE);
  st.layout = layoutStation(st);
  return st;
});
const LAST_STATION = STATIONS.length - 1;

// Fixed furniture positions for one station (same in every lighting)
function layoutStation(st) {
  const rng = mulberry32(900 + st.index * 77);
  const [L, R] = st.platform, items = [];
  const clear = x => x > L + 6 && x < R - 12 && (x < PLAT.STALL_X - 10 || x > PLAT.STALL_X + 36) &&
                     Math.abs(x - PLAT.BOARD_X) > 34;              // keep the name board unobstructed
  const span = ROOFS[st.roof].span || [L, R];
  // roof pillars sit mid-carriage (41 px apart), clear of every door
  for (let x = Math.ceil((span[0] + 6) / 41) * 41; x <= span[1] - 6; x += 41) items.push({ type: 'pillar', x, y: 158 });
  const every = (start, step, fn) => { for (let x = start + step * Math.ceil((L - start) / step); x < R; x += step) fn(x); };
  every(30, 82, x => clear(x) && items.push({ type: 'lamp', x, y: 161 }));
  every(56, 82, x => clear(x) && clear(x + 10) && items.push({ type: 'bench', x, y: 166 }));
  every(76, 164, x => clear(x) && items.push({ type: 'bin', x, y: 164 }));
  items.push({ type: 'tap', x: 256, y: 165 });
  items.push({ type: 'stall', x: PLAT.STALL_X, y: PLAT.STALL_Y });
  items.push({ type: 'board', x: PLAT.BOARD_X, y: 159 });
  if (st.extras.includes('fish'))
    for (const [x, y] of [[228, 160], [236, 165], [246, 161], [-40, 161], [-30, 166], [346, 162], [356, 167]])
      if (clear(x)) items.push({ type: 'basket', key: 'basket' + randInt(rng, 0, 2), x, y });
  if (st.extras.includes('chests'))
    for (const [x, y] of [[212, 159], [-16, 162], [-6, 166]])
      if (clear(x)) items.push({ type: 'chests', x, y });
  return items;
}

// --- shared furniture sprites; each has an anchor (ax, ay) at its foot --
function prop(w, h, ax, ay, paint) {
  const [c, g] = makeCanvas(w, h);
  paint(g);
  return { c, ax, ay };
}

function glowHalo(g, cx, cy, r0, r1, level) {
  const n = Math.ceil(r1);
  for (let y = -n; y <= n; y++)
    for (let x = -n; x <= n; x++) {
      const d = Math.hypot(x, y);
      if (d > r0 && d <= r1 && bayer(cx + x, cy + y) < level) px(g, cx + x, cy + y, PALETTE.glow);
    }
}

function buildProps(p, lit) {
  return {
    // lamp post: lantern head, warm dithered halo after dark
    lamp: prop(15, 64, 7, 63, g => {
      if (lit) glowHalo(g, 7, 8, 2, 7, 4);
      rect(g, 7, 9, 1, 52, p.grayDark);
      rect(g, 6, 61, 3, 3, p.gray);
      rect(g, 5, 6, 5, 1, p.grayDark);
      rect(g, 6, 7, 3, 2, lit ? PALETTE.glow : p.cloudShade);
      rect(g, 6, 9, 3, 1, p.grayDark);
    }),
    bench: prop(10, 5, 0, 4, g => {
      rect(g, 0, 0, 10, 1, p.brown);                     // backrest
      rect(g, 0, 1, 10, 1, p.brownDark);
      rect(g, 0, 2, 10, 1, p.tan);                       // seat
      rect(g, 1, 3, 1, 2, p.grayDark);
      rect(g, 8, 3, 1, 2, p.grayDark);
    }),
    bin: prop(4, 6, 1, 5, g => {
      rect(g, 0, 0, 4, 1, p.grayLight);
      rect(g, 0, 1, 4, 5, p.blue);
      rect(g, 3, 1, 1, 5, p.navy);
      px(g, 1, 2, p.white);
    }),
    // water tap: standpipe, spout, basin and a drip
    tap: prop(7, 9, 3, 8, g => {
      rect(g, 3, 1, 1, 6, p.grayDark);
      rect(g, 3, 0, 3, 1, p.gray);
      px(g, 5, 1, p.gray);
      px(g, 2, 0, p.red);
      px(g, 5, 3, p.skyLight);
      rect(g, 0, 7, 7, 1, p.grayLight);
      rect(g, 1, 8, 5, 1, p.gray);
    }),
    stall: prop(27, 26, 0, 25, g => paintStall(g, p, lit)),
    basket0: fishBasket(p, 0), basket1: fishBasket(p, 1), basket2: fishBasket(p, 2),
    // plywood tea chests, banded and stencilled, waiting for the goods train
    chests: prop(11, 10, 5, 9, g => {
      for (const [x, y, w] of [[0, 5, 11], [2, 0, 7]]) {
        rect(g, x, y, w, 5, p.tan);
        rect(g, x, y, w, 1, p.cream);
        rect(g, x + w - 1, y, 1, 5, p.brown);
        rect(g, x, y + 2, w - 1, 1, p.brown);                 // metal band
        px(g, x + 2, y + 3, p.brownDark); px(g, x + 3, y + 3, p.brownDark);   // stencil
      }
      rect(g, 0, 9, 11, 1, p.brownDark);
    }),
  };
}

// Woven basket heaped with silver fish (Bhairab is a big fish market)
function fishBasket(p, v) {
  return prop(9, 6, 4, 5, g => {
    rect(g, 1, 2, 7, 1, p.brownDark);
    for (let y = 3; y < 6; y++) for (let x = 1 + (y === 5); x < 8 - (y === 5); x++) px(g, x, y, (x + y) & 1 ? p.tan : p.brown);
    const fish = [p.grayLight, p.white, p.skyLight, v === 2 ? p.rose : p.cloudShade];
    for (let x = 2; x < 7; x++) px(g, x, 1, fish[(x + v) % 4]);
    for (let x = 3 - (v === 1); x < 6 + (v === 1); x++) px(g, x, 0, fish[(x + v + 1) % 4]);
    px(g, 4, 1, p.ink);
  });
}

// Tea stall: striped awning, kettle on a clay stove, glass jars, bulb
function paintStall(g, p, lit) {
  rect(g, 2, 4, 23, 12, p.brownDark);                    // dim interior
  rect(g, 3, 8, 21, 1, p.brown);                         // back shelf
  for (const [x, k] of [[4, 'red'], [6, 'paddy'], [8, 'white'], [22, 'skyMid']]) px(g, x, 7, p[k]);
  stamp(g, ['yy', 'yyy', '.y'], 20, 5, { y: p.paddy });  // hanging banana bunch
  // the tea seller behind the counter
  rect(g, 14, 10, 3, 1, p.ink);
  px(g, 14, 11, p.ink); rect(g, 15, 11, 2, 2, p.brown);
  rect(g, 13, 13, 5, 3, p.white);
  // bare bulb on a cord
  rect(g, 11, 3, 1, 2, p.ink);
  if (lit) glowHalo(g, 11, 5, 1.2, 4.6, 5);
  px(g, 11, 5, lit ? PALETTE.glow : p.cloudShade);
  // striped awning and posts
  rect(g, 0, 0, 27, 1, p.rust);
  for (let x = 0; x < 27; x++) rect(g, x, 1, 1, 2, (x >> 1) & 1 ? p.cream : p.red);
  for (let x = 0; x < 27; x += 2) px(g, x, 3, p.red);
  rect(g, 1, 3, 1, 23, p.brown);
  rect(g, 25, 3, 1, 23, p.brown);
  // clay stove with a glowing fire, aluminium kettle with spout
  rect(g, 3, 14, 6, 2, p.rust);
  px(g, 5, 15, PALETTE.amber);
  rect(g, 4, 11, 4, 3, p.grayLight);
  rect(g, 5, 10, 2, 1, p.gray);
  rect(g, 5, 9, 2, 1, p.ink);
  px(g, 8, 12, p.grayLight);
  px(g, 9, 11, p.grayLight);
  // glass jars of biscuits and sweets
  for (const [x, k, lid] of [[10, 'tan', 'red'], [18, 'red', 'blue'], [21, 'paddy', 'green']]) {
    rect(g, x, 12, 3, 1, p[lid]);
    rect(g, x, 13, 3, 3, p.skyLight);
    rect(g, x + 1, 14, 1, 2, p[k]);
  }
  // counter
  rect(g, 0, 16, 27, 1, p.tan);
  rect(g, 1, 17, 25, 9, p.brown);
  rect(g, 2, 19, 23, 2, p.green);
  for (let x = 4; x < 24; x += 3) px(g, x, 20, p.cream);
  rect(g, 2, 23, 23, 1, p.brownDark);
}

// --- per-station sprites: platform slab, roof, name board -------------
function buildStationSprites(st, p) {
  const [L, R] = st.platform, roof = ROOFS[st.roof];
  const span = roof.span || [L, R];
  return {
    slab: buildSlab(p, R - L, st.index),
    roof: st.roof === 'umbrella' ? buildUmbrellaRoof(p, span[0], span[1])
                                 : buildTinRoof(p, span[1] - span[0], st.roofColor),
    roofX: span[0], roofY: roof.y0,
    board: buildBoard(p, st),
  };
}

// Raised concrete platform seen from slightly above: coping, yellow safety
// line along the track edge, paved surface, then the front face.
function buildSlab(p, w, seed) {
  const rng = mulberry32(300 + seed);
  const [c, g] = makeCanvas(w, 32);                      // screen y 148..179
  rect(g, 0, 0, w, 1, p.cloudShade);
  rect(g, 0, 1, w, 23, p.grayLight);
  rect(g, 0, 2, w, 1, p.glow);                           // safety line
  for (const y of [9, 16]) rect(g, 0, y, w, 1, p.gray);
  [[3, 6], [10, 6], [17, 7]].forEach(([y, h], r) => {
    for (let x = (r * 7) % 16; x < w; x += 16) rect(g, x, y, 1, h, p.gray);
  });
  for (let i = 0; i < w / 3; i++) px(g, randInt(rng, 0, w - 1), randInt(rng, 3, 23), rng() < 0.6 ? p.gray : p.cloudShade);
  rect(g, 0, 24, w, 1, p.cloudShade);
  rect(g, 0, 25, w, 7, p.gray);
  rect(g, 0, 29, w, 3, p.grayDark);
  for (let x = 5; x < w; x += 24) rect(g, x, 25, 1, 7, p.grayDark);
  rect(g, 0, 0, 1, 32, p.grayDark);
  rect(g, w - 1, 0, 1, 32, p.grayDark);
  return c;
}

// Kamalapur: a row of concrete umbrella shells, one per column, giving the
// roof its wavy outline
function buildUmbrellaRoof(p, L, R) {
  const w = R - L, [c, g] = makeCanvas(w, ROOFS.umbrella.h);
  for (let x = 0; x < w; x++) {
    const sx = x + L, cx = Math.round(sx / 41) * 41, t = (sx - cx) / 20.5;
    const top = 2 + Math.round(5 * t * t);
    px(g, x, top, p.white);
    rect(g, x, top + 1, 1, 2, sx < cx ? p.cloudShade : p.grayLight);
    px(g, x, top + 3, p.gray);
    const cap = 3 - Math.abs(sx - cx);                   // flared column capital
    if (cap > 0) rect(g, x, top + 4, 1, cap, p.grayLight);
  }
  return c;
}

function buildTinRoof(p, w, color) {
  const [c, g] = makeCanvas(w, 7);
  const base = p[color], dark = p[{ red: 'rust', blue: 'navy' }[color] || 'greenDark'];
  rect(g, 1, 0, w - 2, 1, dark);
  rect(g, 0, 1, w, 4, base);
  for (let x = 1; x < w; x += 3) rect(g, x, 1, 1, 4, dark);   // corrugations
  rect(g, 0, 5, w, 1, p.grayLight);
  rect(g, 0, 6, w, 1, p.grayDark);
  return c;
}

// Yellow name board on two posts: Bangla above English
function buildBoard(p, st) {
  const m = st.bnMask, ew = textWidth(st.en);
  const bw = Math.max(m.w, ew) + 8, bh = m.h + 13, h = 160 - BOARD_TOP;
  const [c, g] = makeCanvas(bw, h);
  for (const x of [3, bw - 5]) { rect(g, x, bh, 2, h - bh, p.grayDark); rect(g, x, bh, 1, h - bh, p.gray); }
  rect(g, 0, 0, bw, bh, p.ink);
  rect(g, 1, 1, bw - 2, bh - 2, p.glow);
  drawMask(g, m, (bw - m.w) >> 1, 3, p.ink);
  drawText(g, st.en, (bw - ew) >> 1, m.h + 6, p.ink);
  return c;
}

// --- station backdrops: drawn in a parallax layer behind the line ------
// sx is the sprite's screen x while the train stands at the station.
const BACKDROPS = {
  city:  { layer: 'far', sx: -300, y: 62,  build: buildCity },    // Dhaka skyline
};

function buildCity(p, lit) {
  const TW = 540, TH = 52, rng = mulberry32(61);
  const [c, g] = makeCanvas(TW, TH);
  // two rows of blocks; the city thins out towards the right (the way out of Dhaka)
  for (const [col, side, win, hMax] of [[p.cloudShade, p.grayLight, p.grayLight, 46], [p.grayLight, p.gray, p.gray, 34]]) {
    for (let x = randInt(rng, 0, 6); x < TW - 12; ) {
      const w = randInt(rng, 8, 22), fade = Math.max(0, Math.min(1, (TW - 30 - x) / 220));
      const h = Math.max(4, Math.round(randInt(rng, 10, hMax) * (0.2 + 0.8 * fade))), top = TH - h;
      rect(g, x, top, w, h, col);
      rect(g, x + w - 1, top, 1, h, side);
      for (let yy = top + 2; yy < TH - 2; yy += 3)
        for (let xx = x + 2; xx < x + w - 2; xx += 3) {
          const on = rng() < 0.35, warm = rng() < 0.7;       // always roll: same city in every lighting
          px(g, xx, yy, lit && on ? (warm ? PALETTE.glow : PALETTE.amber) : win);
        }
      if (rng() < 0.2 && h > 24) { rect(g, x + (w >> 1), top - 5, 1, 5, p.grayDark); px(g, x + (w >> 1), top - 6, p.red); }
      x += w + randInt(rng, 0, 3) + (fade < 0.6 ? randInt(rng, 6, 18) : 0);
    }
  }
  // a mosque dome and minaret among the blocks
  const mx = 168, base = TH - 18;
  disc(g, mx, base, 7, p.white);
  rect(g, mx - 9, base, 19, 18, p.cloudShade);
  rect(g, mx, base - 10, 1, 3, p.glow);
  rect(g, mx + 13, TH - 40, 3, 40, p.white);
  rect(g, mx + 12, TH - 30, 5, 1, p.grayLight);
  rect(g, mx + 14, TH - 43, 1, 3, p.grayLight);
  return c;
}

function drawBackdrops(g, v, layer) {
  const f = PARALLAX[layer];
  for (const st of STATIONS)
    for (const key of st.backdrop) {
      const b = BACKDROPS[key];
      if (b.layer !== layer) continue;
      const spr = v.backdrops[key];
      const x = b.sx + Math.floor(st.dist * f) - Math.floor(sim.dist * f);   // same stepping as the tiles
      if (x < W && x + spr.width > 0) g.drawImage(spr, x, b.y);
    }
}

// --- near-side platform: slab, then furniture and people sorted by depth
const frontItems = [], byY = (a, b) => a.y - b.y;
function drawStationFront(g, v) {
  const cam = Math.floor(sim.dist);
  for (let i = 0; i < STATIONS.length; i++) {
    const st = STATIONS[i], off = st.dist - cam;
    if (st.platform[0] + off >= W + 40 || st.platform[1] + off <= -40) continue;
    const s = v.stations[i];
    g.drawImage(s.slab, st.platform[0] + off, PLAT.TOP);
    if (drive.on && !ui.title) drawStopMark(g, v, off);
    if (i === LAST_STATION) drawBuffer(g, v, off);
    frontItems.length = 0;
    for (let k = 0; k < st.layout.length; k++) frontItems.push(st.layout[k]);
    for (let k = 0; k < sim.people.length; k++) { const q = sim.people[k]; if (q.st === i && !q.hidden) frontItems.push(q); }
    frontItems.sort(byY);
    for (let k = 0; k < frontItems.length; k++) { const it = frontItems[k]; it.d ? drawPersonAt(g, v, it, off) : drawProp(g, v, st, it, off); }
    g.drawImage(s.roof, s.roofX + off, s.roofY);
  }
}

// Where a driver stops: a board at the platform edge, level with the
// loco's nose when the train stands on the mark
function drawStopMark(g, v, off) {
  const p = v.p, x = CONFIG.TRAIN_FRONT_X + 2 + off;
  if (x < -4 || x > W + 4) return;
  rect(g, x, 149, 1, 8, p.grayDark);
  rect(g, x - 2, 144, 5, 5, p.ink);
  rect(g, x - 1, 145, 3, 3, p.glow);
  px(g, x, 146, p.ink);
}

// The end of the line at Sylhet: a striped buffer beam on a braced frame
function drawBuffer(g, v, off) {
  const p = v.p, x = CONFIG.TRAIN_FRONT_X + BUFFER_O + 2 + off;
  if (x < -16 || x > W + 4) return;
  rect(g, x + 3, 131, 2, 15, p.grayDark);              // post with a lamp on top
  px(g, x + 3, 131, PALETTE.red);
  rect(g, x, 135, 3, 6, p.red);                        // buffer beam at the height of the loco's
  for (let y = 136; y < 141; y += 2) rect(g, x, y, 3, 1, p.white);
  for (let k = 0; k < 8; k++) px(g, x + 5 + k, 138 + k, p.gray);   // brace
  rect(g, x - 1, 146, 16, 1, p.grayDark);
}

function drawProp(g, v, st, it, off) {
  const p = v.p, x = it.x + off;
  if (it.type === 'pillar') {
    const top = ROOFS[st.roof].pillarTop, h = it.y - top + 1;
    if (st.roof === 'umbrella') {                        // round concrete column
      rect(g, x - 1, top, 3, h, p.cloudShade);
      rect(g, x + 1, top, 1, h, p.grayLight);
      rect(g, x - 2, it.y - 1, 5, 2, p.grayLight);
    } else {                                             // painted iron post with brackets
      rect(g, x, top, 2, h, p.grayDark);
      rect(g, x, top, 1, h, p.gray);
      px(g, x - 1, top, p.grayDark);
      px(g, x + 2, top, p.grayDark);
    }
  } else if (it.type === 'board') {
    const b = v.stations[st.index].board;
    g.drawImage(b, x - (b.width >> 1), BOARD_TOP);
  } else {
    const spr = v.props[it.key || it.type];
    g.drawImage(spr.c, x - spr.ax, it.y - spr.ay);
    if (it.type === 'lamp') addLight(x, it.y - 55, LIGHT_LAMP);
    else if (it.type === 'stall') { drawSteam(g, v, x + 9, it.y - 15); addLight(x + 11, it.y - 20, LIGHT_BULB); }
  }
}

// Steam curling up from the kettle spout: a few dithered wisps on a loop
function drawSteam(g, v, x, y) {
  for (let i = 0; i < 4; i++) {
    const ph = (sim.clock * 0.6 + i / 4) % 1;
    const sx = x + Math.round(Math.sin(ph * 6 + i * 2) * 1.2 + ph * 2), sy = y - Math.floor(ph * 11);
    if (bayer(sx, sy) < (1 - ph) * 22) px(g, sx, sy, v.p.white);
    if (ph < 0.45) px(g, sx + 1, sy - 1, v.p.cloudShade);
  }
}

// =====================================================================
// 7. PEOPLE
// =====================================================================
// Each person is a procedural "design" (clothes, skin, what they carry),
// painted into small sprites on demand and cached per lighting.
// Frames: 0-3 walk cycle, 4 sitting, 5/6 sipping tea, 7/8 waving a flag.
const SKINS = ['tan', 'brown', 'rust', 'brown'];
const SHIRTS = ['white', 'cream', 'skyLight', 'skyMid', 'grayLight', 'paddy', 'rose', 'orange', 'blue', 'tan'];
const TROUSERS = ['navy', 'grayDark', 'brown', 'gray', 'indigo'];
const LUNGIS = [['blue', 'navy'], ['green', 'greenDark'], ['purple', 'indigo'], ['skyMid', 'blue'],
                ['red', 'rust'], ['grayLight', 'white']];                         // checked cotton
const SARIS = [['red', 'glow'], ['rose', 'white'], ['orange', 'red'], ['purple', 'glow'], ['blue', 'skyLight'],
               ['green', 'glow'], ['glow', 'red'], ['skyMid', 'white'], ['amber', 'green']];  // [body, border]
const KAMEEZ = [['rose', 'white', 'skyMid'], ['skyMid', 'navy', 'white'], ['paddy', 'green', 'red'],
                ['purple', 'white', 'rose'], ['orange', 'cream', 'red'], ['green', 'white', 'glow']]; // [kameez, salwar, dupatta]
const BAGS = ['brown', 'ink', 'red', 'navy', 'grassLight'];
const PASSENGER_KINDS = ['lungi', 'lungi', 'trousers', 'trousers', 'trousers', 'sari', 'sari', 'kameez',
                         'kameez', 'child', 'child', 'elder'];
const PERSON_W = 13, PERSON_H = 20, PERSON_CX = 6, PERSON_FY = 19;   // sprite box, centre column, feet row
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];

let designId = 0;
function makeDesign(rng, kind) {
  kind = kind || pick(rng, PASSENGER_KINDS);
  const d = { id: ++designId, kind, skin: pick(rng, SKINS), hair: rng() < 0.85 ? 'ink' : 'brownDark', h: 12, carry: null };
  switch (kind) {
    case 'lungi':    d.top = pick(rng, SHIRTS); [d.cloth, d.cloth2] = pick(rng, LUNGIS); break;
    case 'trousers': d.top = pick(rng, SHIRTS); d.bottom = pick(rng, TROUSERS); break;
    case 'sari':     [d.cloth, d.accent] = pick(rng, SARIS); d.covered = rng() < 0.6; break;
    case 'kameez':   [d.top, d.bottom, d.accent] = pick(rng, KAMEEZ); break;
    case 'child':    d.h = 8; d.girl = rng() < 0.5; d.bottom = pick(rng, TROUSERS);
                     d.top = d.girl ? pick(rng, ['rose', 'red', 'glow', 'skyMid', 'purple']) : pick(rng, SHIRTS); break;
    case 'elder':    d.hair = 'white'; d.top = rng() < 0.6 ? 'white' : 'cream'; d.bottom = 'white'; break;
    case 'porter':   d.top = 'red'; d.cloth = 'grayLight'; d.cloth2 = 'white'; d.carry = 'case'; break;
    case 'vendor':   d.top = 'white'; [d.cloth, d.cloth2] = pick(rng, LUNGIS); d.carry = 'tray'; break;
    case 'guard':    d.top = 'white'; d.bottom = 'navy'; break;
  }
  if (['lungi', 'trousers', 'sari', 'kameez'].includes(kind)) {
    const r = rng();
    if (r < 0.3) d.carry = 'bag';
    else if (r < 0.42 && kind !== 'kameez') d.carry = kind === 'trousers' ? 'backpack' : 'bundle';
    d.bagColor = pick(rng, BAGS);
  }
  return d;
}

function paintPerson(g, d, p, frame) {
  const ox = PERSON_CX - 2, oy = PERSON_FY - d.h + 1;
  const P = (x, y, k) => { g.fillStyle = p[k]; g.fillRect(ox + x, oy + y, 1, 1); };
  const R = (x, y, w, h, k) => { g.fillStyle = p[k]; g.fillRect(ox + x, oy + y, w, h); };
  const s = d.skin, walk = frame < 4 ? frame : 0, stride = walk === 1 || walk === 3;

  if (d.kind === 'child') {                               // 8 px tall
    R(1, 0, 3, 1, d.hair); P(1, 1, d.hair); R(2, 1, 2, 1, s); R(1, 2, 3, 1, s);
    if (d.girl) {                                         // frock and a pigtail
      P(0, 1, d.hair); R(1, 3, 3, 4, d.top);
      if (stride) { P(0, 6, d.top); P(4, 6, d.top); }
    } else {
      R(1, 3, 3, 3, d.top);
      if (stride) { P(1, 6, d.bottom); P(3, 6, d.bottom); } else R(2, 6, 2, 1, d.bottom);
    }
    if (stride) { P(0, 7, s); P(4, 7, s); } else { P(2, 7, s); P(3, 7, s); }
    if (walk === 1) P(4, 4, s); else if (walk === 3) P(0, 4, s);
    return;
  }

  const sit = frame === 4, dy = sit ? 3 : 0, lean = d.kind === 'elder' && !sit ? 1 : 0;
  const cover = d.kind === 'sari' && d.covered ? d.cloth : d.kind === 'guard' ? 'navy' : d.hair;
  const longHair = d.kind === 'sari' || d.kind === 'kameez';
  // 3x3 head facing right; elders stoop forward a pixel
  R(1 + lean, dy, 3, 1, cover);
  P(1 + lean, dy + 1, cover); R(2 + lean, dy + 1, 2, 1, s);
  P(1 + lean, dy + 2, longHair ? cover : s); R(2 + lean, dy + 2, 2, 1, s);
  if (d.kind === 'guard') P(4, 0, 'navy');                // cap peak
  if (d.kind === 'elder') P(3 + lean, dy + 2, 'white');   // white beard

  const checked = d.kind === 'lungi' || d.kind === 'porter' || d.kind === 'vendor';
  const lower = (x, y) => checked ? ((x + y) & 1 ? d.cloth : d.cloth2) : (d.kind === 'sari' ? d.cloth : d.bottom);

  if (sit) {
    R(1, 6, 3, 3, d.kind === 'sari' ? d.cloth : d.top);
    if (d.kind === 'sari') P(1, 6, d.accent);
    if (d.kind === 'kameez') R(1, 6, 3, 1, d.accent);
    for (let x = 1; x <= 4; x++) P(x, 9, lower(x, 9));    // thighs along the seat
    P(4, 10, lower(4, 10));
    P(4, 11, s); P(5, 11, s);
    P(3, 8, s);                                          // hands in the lap
    return;
  }

  switch (d.kind) {
    case 'sari':                                         // drape to the ankles, pallu over the shoulder
      R(1, 3, 3, 8, d.cloth);
      R(1, 3, 1, 3, d.accent);
      R(1, 10, 3, 1, d.accent);
      if (stride) { P(0, 10, d.accent); P(4, 10, d.accent); }
      break;
    case 'kameez':                                       // long tunic, dupatta, salwar
      R(1, 3, 3, 6, d.top);
      R(1, 3, 3, 1, d.accent); R(1, 4, 1, 2, d.accent);
      if (stride) { P(1, 9, d.bottom); P(3, 9, d.bottom); P(0, 10, d.bottom); P(4, 10, d.bottom); }
      else R(2, 9, 2, 2, d.bottom);
      break;
    case 'elder':                                        // long panjabi
      R(1, 3, 3, 7, d.top);
      if (stride) { P(1, 10, d.bottom); P(3, 10, d.bottom); } else R(2, 10, 2, 1, d.bottom);
      break;
    case 'trousers': case 'guard':
      R(1, 3, 3, 4, d.top);
      R(1, 7, 3, 1, d.bottom);
      if (stride) { R(1, 8, 3, 1, d.bottom); P(1, 9, d.bottom); P(3, 9, d.bottom); P(0, 10, d.bottom); P(4, 10, d.bottom); }
      else R(2, 8, 2, 3, d.bottom);
      break;
    default:                                             // lungi (porter and vendor too)
      R(1, 3, 3, 4, d.top);
      for (let y = 7; y <= 10; y++) for (let x = 1; x <= 3; x++) P(x, y, lower(x, y));
      if (stride) { P(0, 10, lower(0, 10)); P(4, 10, lower(4, 10)); }
  }
  const shoe = d.kind === 'trousers' || d.kind === 'guard' ? 'ink' : s;
  if (stride) { P(0, 11, shoe); P(4, 11, shoe); } else { P(2, 11, shoe); P(3, 11, shoe); }
  if (shoe === 'ink') P(stride ? 5 : 4, 11, shoe);       // shoes point forward

  // arms and whatever they carry
  const hand = frame === 6 ? [4, 3] : frame === 5 ? [4, 5] : walk === 1 ? [4, 6] : walk === 3 ? [0, 6] : [3, 7];
  switch (d.carry) {
    case 'bag':      R(4, 7, 2, 2, d.bagColor); P(4, 6, s); break;
    case 'backpack': R(0, 3, 1, 4, d.bagColor); P(hand[0], hand[1], s); break;
    case 'bundle':   R(0, -2, 5, 2, d.bagColor); P(2, -3, d.bagColor); P(4, 0, s); P(4, 1, s); break;
    case 'case':     R(-1, -3, 6, 3, 'rust'); R(-1, -1, 6, 1, 'brownDark'); P(2, -4, 'ink');   // suitcase on the head
                     P(4, 3, d.top); P(4, 2, s); P(4, 1, s); break;
    case 'tray':     R(3, 5, 5, 1, 'tan'); P(4, 4, 'red'); P(5, 4, 'paddy'); P(6, 4, 'white'); P(3, 6, s); break;
    default:
      if (d.kind === 'elder') { R(5, 6, 1, 6, 'brown'); P(4, 6, s); }   // walking cane
      else if (d.kind !== 'guard') P(hand[0], hand[1], s);
  }
  if (frame === 5 || frame === 6) P(hand[0], hand[1] - 1, 'white');      // glass of tea
  if (d.kind === 'guard') {
    if (frame === 7) {                                   // flag out to the right
      P(4, 3, d.top); P(4, 2, s); R(5, -1, 1, 3, 'brownDark');
      R(6, -3, 3, 3, 'grassLight'); R(6, -1, 3, 1, 'greenDark');
    } else if (frame === 8) {                            // flag swung overhead
      P(4, 3, d.top); P(4, 2, s); R(4, -2, 1, 4, 'brownDark');
      R(0, -4, 4, 3, 'grassLight'); R(0, -2, 4, 1, 'greenDark');
    } else {                                             // rolled flag at his side
      P(4, 6, s); R(4, 7, 1, 3, 'grassLight');
    }
  }
}

function personSprite(v, d, frame, dir) {
  let set = v.people.get(d.id);
  if (!set) v.people.set(d.id, set = []);
  const key = frame * 2 + (dir < 0 ? 1 : 0);
  if (!set[key]) {
    const [c, g] = makeCanvas(PERSON_W, PERSON_H);
    if (dir < 0) { g.translate(PERSON_W, 0); g.scale(-1, 1); }   // exact pixel mirror
    paintPerson(g, d, v.p, frame);
    set[key] = c;
  }
  return set[key];
}

function personFrame(q) {
  if (q.walking) return Math.floor(q.anim) % 4;
  if (q.mode === 'sit') return 4;
  if (q.mode === 'sip') return q.t % 3.4 > 2.3 ? 6 : 5;
  if (q.mode === 'guard' && sim.state === 'STOPPED' && sim.station === q.st &&
      (sim.stopPhase === 'FLAG' || sim.stopPhase === 'HORN' || sim.stopPhase === 'CLEAR')) return 7 + (Math.floor(sim.clock * 4) & 1);
  return 0;
}

function drawPersonAt(g, v, q, off) {
  const spr = personSprite(v, q.d, personFrame(q), q.dir);
  const x = Math.round(q.x) + off - PERSON_CX, y = Math.round(q.y) - PERSON_FY;
  if (q.clip === null) { g.drawImage(spr, x, y); return; }
  // stepping through a doorway: only the part inside the door column shows
  g.save();
  g.beginPath();
  g.rect(q.clip + off, PLAT.DOOR_TOP, 4, PLAT.EDGE_Y - PLAT.DOOR_TOP + 1);
  g.clip();
  g.drawImage(spr, x, y);
  g.restore();
}

// --- behaviour ---------------------------------------------------------
// People follow a list of waypoints; a waypoint may clip them to a door
// column (climbing in or out) and may run a callback when reached.
const gone = q => { q.gone = true; };
const nearestDoor = x => DOORS.reduce((a, b) => Math.abs(b + 2 - x) < Math.abs(a + 2 - x) ? b : a);
const randWalkY = rng => PLAT.WALK_MIN + Math.floor(rng() * (PLAT.WALK_MAX - PLAT.WALK_MIN + 1));

function spawnPerson(st, d, x, y, dir, mode) {
  const speed = d.kind === 'elder' ? 7 : d.kind === 'child' ? 13 : 11 + Math.random() * 5;
  const q = { st: st.index, d, x, y, dir, mode, speed, path: [], anim: 0, t: Math.random() * 3,
              delay: 0, clip: null, hidden: false, walking: false, turnAt: 2 + Math.random() * 6 };
  sim.people.push(q);
  return q;
}

function populateStation(st) {
  sim.populated.add(st.index);
  const rng = mulberry32((Math.random() * 1e9) | 0);    // a different crowd every trip
  const [L, R] = st.platform;
  const seated = kind => { const d = makeDesign(rng, kind); d.carry = null; return d; };
  for (let i = 0; i < st.crowd; i++)                    // waiting to board, spread along the train
    spawnPerson(st, makeDesign(rng), 24 + rng() * 244, randWalkY(rng), rng() < 0.5 ? 1 : -1, 'wait');
  for (let i = 0; i < st.idle; i++) {                   // just standing about
    let x;
    do x = L + 10 + rng() * (R - L - 20); while (x > PLAT.STALL_X - 4 && x < PLAT.STALL_X + 34);
    spawnPerson(st, makeDesign(rng), x, randWalkY(rng), rng() < 0.5 ? 1 : -1, 'idle');
  }
  for (const it of st.layout)                           // someone resting on a bench
    if (it.type === 'bench' && rng() < 0.5)
      spawnPerson(st, seated(pick(rng, ['lungi', 'trousers', 'sari', 'kameez', 'elder'])), it.x + 3, it.y, rng() < 0.5 ? 1 : -1, 'sit');
  spawnPerson(st, seated(pick(rng, ['lungi', 'trousers'])), PLAT.STALL_X + 31, PLAT.STALL_Y + 2, -1, 'sip');
  const vendor = spawnPerson(st, makeDesign(rng, 'vendor'), 60 + rng() * 150, PLAT.WALK_MAX, 1, 'patrol');
  vendor.ax = Math.max(L + 20, -120);
  vendor.bx = Math.min(R - 46, 440);
  vendor.speed = 9;
  spawnPerson(st, makeDesign(rng, 'guard'), 14, 167, 1, 'guard');   // front of the platform, flag against concrete
  if (st.extras.includes('porter')) {
    const q = spawnPerson(st, makeDesign(rng, 'porter'), 300, 169, -1, 'porterWait');   // in front of the stall
    q.d2 = { ...q.d, id: ++designId, carry: null };     // same porter, luggage delivered
  }
}

// Doors are open: a few passengers step off, then the waiting ones board.
// A driver rarely stops exactly on the mark, so the doors stand at
// DOORS + sim.stopOffset in stop coordinates.
function startBoarding(st) {
  const terminus = st.index === LAST_STATION, o = Math.round(sim.stopOffset);
  // everyone gets off at the end of the line; a driver can't deliver more than they carry
  const alight = terminus ? Math.max(st.alight, Math.min(20, drive.pax)) : drive.on ? Math.min(st.alight, drive.pax) : st.alight;
  for (let i = 0; i < alight; i++) {
    const door = DOORS[Math.floor(Math.random() * DOORS.length)] + o, x = door + 2;
    const q = spawnPerson(st, makeDesign(Math.random), x, PLAT.DOOR_FLOOR, x - o < 150 ? -1 : 1, 'alight');
    const y = randWalkY(Math.random), exit = (x - o < 150 ? -24 : W + 24) + o;   // just off screen
    q.hidden = true;
    q.delay = i * (terminus ? 0.5 : 0.45) + Math.random() * 0.6;
    q.path = [{ x, y: PLAT.EDGE_Y, clip: door, speed: 18, then: passengerOut },
              { x: x + Math.sign(exit - x) * 4, y },
              { x: exit, y, then: gone }];
  }
  for (const q of sim.people) {
    if (q.st !== st.index) continue;
    if (q.mode === 'wait') {
      const door = nearestDoor(q.x - o) + o, x = door + 2;
      q.mode = 'board';
      q.delay = (st.alight ? 1.4 : 0.3) + Math.random() * 3;
      q.path = [{ x, y: q.y }, { x, y: PLAT.EDGE_Y }, { x, y: PLAT.DOOR_FLOOR, clip: door, speed: 18, then: passengerIn }];
    } else if (q.mode === 'porterWait') {
      const door = DOORS[9] + o, x = door + 2;
      q.mode = 'porter';
      q.delay = 0.5;
      q.path = [{ x, y: q.y }, { x, y: PLAT.EDGE_Y, then: r => { r.delay = 1.2; r.handed = true; } }];
    }
  }
}

function boardingDone(st) {
  return !sim.people.some(q => q.st === st.index &&
    (q.mode === 'board' || q.mode === 'porter' ||
     (q.mode === 'alight' && (q.hidden || q.path.length > 2))));
}

function moveAlong(q, dt) {
  const wp = q.path[0], dx = wp.x - q.x, dy = wp.y - q.y, dist = Math.hypot(dx, dy);
  const step = (wp.speed || q.speed) * dt;
  q.clip = wp.clip === undefined ? null : wp.clip;
  if (Math.abs(dx) > 0.01) q.dir = dx > 0 ? 1 : -1;
  q.walking = true;
  q.anim += Math.min(dist, step) / 3;
  if (dist <= step) {
    q.x = wp.x; q.y = wp.y;
    q.path.shift();
    q.clip = null;
    if (wp.then) wp.then(q);
  } else {
    q.x += dx / dist * step;
    q.y += dy / dist * step;
  }
}

function updatePerson(q, dt) {
  q.t += dt;
  q.walking = false;
  if (q.delay > 0) {
    q.delay -= dt;
    if (q.delay <= 0) q.hidden = false;
    return;
  }
  if (q.path.length) { moveAlong(q, dt); return; }
  switch (q.mode) {
    case 'idle': case 'wait': case 'porterWait':
      if (q.t > q.turnAt) { q.dir = -q.dir; q.turnAt = q.t + 2 + Math.random() * 6; }
      break;
    case 'patrol':                                       // tray vendor pacing the platform
      q.path = [{ x: q.x < (q.ax + q.bx) / 2 ? q.bx : q.ax, y: q.y }];
      q.delay = 1 + Math.random() * 2;
      break;
    case 'porter':                                       // case handed in at the door; head back
      if (q.handed) {
        forgetPerson({ d: q.d });
        q.d = q.d2;
        q.mode = 'leave';
        q.path = [{ x: q.x, y: 161 }, { x: W + 30 + Math.round(sim.stopOffset), y: 161, then: gone }];
      }
      break;
  }
}

function updatePeople(dt) {
  for (const st of STATIONS)
    if (!sim.populated.has(st.index) && Math.abs(st.dist - sim.dist) < 1000) populateStation(st);
  for (const q of sim.people) updatePerson(q, dt);
  let n = 0;
  for (const q of sim.people) {
    if (q.gone || Math.abs(STATIONS[q.st].dist - sim.dist) > 1200) { forgetPerson(q); continue; }
    sim.people[n++] = q;
  }
  sim.people.length = n;
}

function forgetPerson(q) {
  for (const k in VARIANTS) {
    VARIANTS[k].people.delete(q.d.id);
    if (q.d2) VARIANTS[k].people.delete(q.d2.id);
  }
}

// =====================================================================
// 8. JOURNEY STATE MACHINE
// =====================================================================
//   STOPPED --(stop routine)--> DEPARTING --(ACCEL_TIME)--> TRAVELING
//      ^                                                        |
//      +-------- ARRIVING <--(braking distance reached)---------+
//
// While STOPPED, a sub-phase runs the station routine:
//   SETTLE > DOORS_OPEN > BOARDING > DOORS_CLOSE > FLAG > HORN > (depart)
// and at the last station DOORS_CLOSE leads to PARKED > TERMINUS instead.
// In DRIVE mode (section 8a) the driver owns some steps, which wait for
// input: READY (open the doors), BOARDED (close them), CLEAR (depart),
// PARKED (stop the engine); between stations the state is DRIVING.
//
// Departing and arriving follow a smoothstep velocity curve (zero
// acceleration at both ends). Position is the exact integral of that
// curve, so the train always comes to rest exactly at the platform.
const sim = {
  state: 'STOPPED', stopPhase: 'SETTLE', phaseT: 0, timer: 0,
  speed: 0, dist: 0,                       // dist = world px travelled = camera x
  segStart: 0, segSpeed: 0, segDur: 0,     // current accel / brake segment
  station: 0,                              // index of the last station stopped at (or passed)
  stopOffset: 0,                           // how far past the stop mark the train stands (DRIVE)
  nextStop: 0,
  doorOpen: 0,                             // 0 closed .. 1 open
  wheelAngle: 0, swayPhase: 0, clock: 0, cloudDrift: 0,
  hour: CONFIG.HOUR_START, night: 1,       // time of day (0..24) and how dark it is (0..1)
  smokeAcc: 0, fluffAcc: 0, flyAcc: 0, sparkAcc: 0,
  people: [], populated: new Set(),
  fxRng: null, wxRng: null,                // seeded: same birds, fluff and weather every trip
  onBridge: false, bridgeMix: 0,           // see updateBridge(); drives the bridge rumble
  shake: 0, hornWave: 0, hornTimer: 8, jointAcc: 0,
};

const smoothstep = u => u * u * (3 - 2 * u);

function setState(s) {
  sim.state = s;
  sim.timer = 0;
  sim.segStart = sim.dist;
  sim.stopPhase = null;
  if (s === 'ARRIVING') {
    // fit the braking curve to the remaining distance: d = v0 * T / 2
    sim.segSpeed = sim.speed;
    sim.segDur = Math.max(0.2, 2 * (sim.nextStop - sim.dist) / Math.max(1, sim.speed));
  } else if (s === 'DEPARTING') {
    sim.shake = 1.6;                                     // couplings snatch as the train pulls away
  } else if (s === 'STOPPED') {
    sim.speed = 0;
    setStopPhase('SETTLE');
    sim.nextStop = sim.station < LAST_STATION ? STATIONS[sim.station + 1].dist : Infinity;
  }
}

function setStopPhase(ph) {
  sim.stopPhase = ph;
  sim.phaseT = 0;
  if (drive.on) syncButtons();                          // the doors button says OPEN or CLOSE
}

// Come to rest at station i, o px past its stop mark
function arrive(i, o) {
  sim.station = i;
  sim.dist = STATIONS[i].dist + o;
  sim.stopOffset = o;
  setState('STOPPED');
}

function updateStop(dt) {
  const st = STATIONS[sim.station], terminus = sim.station === LAST_STATION, auto = !drive.on;
  sim.phaseT += dt;
  switch (sim.stopPhase) {
    case 'SETTLE':
      if (sim.phaseT >= CONFIG.SETTLE_TIME) setStopPhase(auto ? 'DOORS_OPEN' : 'READY');
      break;
    case 'READY':                                         // the driver opens the doors
      if (auto) setStopPhase('DOORS_OPEN');
      break;
    case 'DOORS_OPEN':
      sim.doorOpen = Math.min(1, sim.phaseT / CONFIG.DOOR_TIME);
      if (sim.doorOpen >= 1) { startBoarding(st); setStopPhase('BOARDING'); }
      break;
    case 'BOARDING':
      if ((sim.phaseT > 1 && boardingDone(st)) || sim.phaseT >= CONFIG.BOARD_TIMEOUT) setStopPhase(auto ? 'DOORS_CLOSE' : 'BOARDED');
      break;
    case 'BOARDED':                                       // the driver closes the doors
      if (auto) setStopPhase('DOORS_CLOSE');
      else if (terminus && drive.engine === 'OFF') setStopPhase('TERMINUS');
      break;
    case 'DOORS_CLOSE':
      sim.doorOpen = Math.max(0, 1 - sim.phaseT / CONFIG.DOOR_TIME);
      if (sim.doorOpen <= 0) setStopPhase(terminus ? 'PARKED' : 'WAIT');
      break;
    case 'WAIT':                                          // a driver early on the timetable waits for departure time
      if (auto || drive.tripT >= SCHEDULE[sim.station].dep - CONFIG.FLAG_TIME) setStopPhase('FLAG');
      break;
    case 'FLAG':                                          // guard waves the green flag
      if (sim.phaseT < CONFIG.FLAG_TIME) break;
      if (auto) { setStopPhase('HORN'); playHorn(false); }
      else { setStopPhase('CLEAR'); toast('ALL CLEAR - DEPART', 'grassLight'); }
      break;
    case 'CLEAR':                                         // the driver takes the train out
      if (auto) { setStopPhase('HORN'); playHorn(false); }
      break;
    case 'HORN':
      if (sim.phaseT >= CONFIG.HORN_TIME) setState('DEPARTING');
      break;
    case 'PARKED':                                        // the driver shuts the engine down
      if (auto || drive.engine === 'OFF') setStopPhase('TERMINUS');
      break;
    case 'TERMINUS':
      if (sim.phaseT >= 1.5 && !ui.complete) finishJourney();
      break;
  }
}

// Back to Kamalapur with a fresh crowd
function startJourney() {
  for (const q of sim.people) forgetPerson(q);
  sim.people.length = 0;
  sim.populated.clear();
  smokePool.n = birdPool.n = fluffPool.n = fireflyPool.n = sparkPool.n = 0;
  sim.fxRng = mulberry32(2024);
  sim.wxRng = mulberry32(1971);
  resetWeather();
  sim.hornTimer = 8;
  sim.doorOpen = 0;
  arrive(0, 0);
  resetDrive();
  ui.complete = false;
  panelSprites = null;
}

function updateJourney(dt) {
  const V = CONFIG.CRUISE_SPEED;
  if (ui.title) return;                                 // the train waits behind the title card
  if (drive.on) { updateDrive(dt); return; }
  switch (sim.state) {
    case 'STOPPED':
      updateStop(dt);
      break;

    case 'DEPARTING': {
      sim.timer += dt;
      const T = CONFIG.ACCEL_TIME, u = Math.min(1, sim.timer / T);
      sim.speed = V * smoothstep(u);
      sim.dist = sim.segStart + V * T * (u ** 3 - u ** 4 / 2);         // integral of smoothstep
      if (u >= 1) setState('TRAVELING');
      break;
    }

    case 'TRAVELING':                                   // (eases back to cruise when the driver hands over)
      sim.speed += Math.max(-12 * dt, Math.min(12 * dt, V - sim.speed));
      sim.dist += sim.speed * dt;
      if (sim.nextStop - sim.dist <= V * CONFIG.BRAKE_TIME / 2) setState('ARRIVING');
      break;

    case 'ARRIVING': {
      sim.timer += dt;
      const T = sim.segDur, u = Math.min(1, sim.timer / T);
      sim.speed = sim.segSpeed * (1 - smoothstep(u));
      sim.dist = sim.segStart + sim.segSpeed * T * (u - u ** 3 + u ** 4 / 2);
      if (u >= 1) {
        arrive(sim.station + 1, 0);
        sim.shake = 1.4;                                 // the last jolt as the brakes hold
      }
      break;
    }
  }
}

// =====================================================================
// 8a. DRIVER MODE
// =====================================================================
// The player at the controls: start the engine, work one combined lever
// (power notches up, brake steps down), stop with every door along the
// platform, open and close the doors, wait for the guard's flag, keep to
// the speed limits and the timetable. Score: stopping accuracy,
// punctuality, passengers carried and their comfort, minus penalties.
const drive = {
  on: false,                               // DRIVE mode; AUTO when false
  engine: 'OFF', engineT: 0, rpm: 0,       // OFF | CRANK | ON | SHUTDOWN; rpm 0..1 (0.3 = idle)
  lever: 0, accel: 0,                      // lever: -5 emergency, -4..-1 brake, 0 coast, 1..8 power
  headlight: true, horn: false,
  tripT: 0,                                // s since the trip began: the timetable clock
  limit: CONFIG.DRIVE.LIMIT, over: false, beepT: 0,
  pts: { stops: 0, time: 0, pax: 0, penalty: 0 }, comfort: 100, pax: 0,
  final: null,                             // the score card once the trip is complete
};
const EB = -CONFIG.DRIVE.BRAKES - 1;       // the emergency brake position
const leverLabel = n => n > 0 ? 'P' + n : n === EB ? 'EB' : n < 0 ? 'B' + -n : 'N';

// Timetable: each leg run a little under the line speed, plus time to get
// going and to stop, plus some slack; a dwell at each stop. Built once the
// terrain (and so the speed limits) is laid out. The day's clock runs on
// it, so a late train arrives later in the evening.
const SCHEDULE = [];
let HOURS_PER_S = 0;
function buildSchedule() {
  const D = CONFIG.DRIVE;
  SCHEDULE.push({ arr: 0, dep: D.FIRST_DEP });
  for (let i = 1; i < STATIONS.length; i++) {
    let run = 0;
    for (let d = STATIONS[i - 1].dist; d < STATIONS[i].dist; d += 10) run += 10 / Math.min(D.SCHED_SPEED, speedLimitAt(d) - 6);
    const arr = SCHEDULE[i - 1].dep + run + (CONFIG.ACCEL_TIME + CONFIG.BRAKE_TIME) / 2 + D.SLACK;
    SCHEDULE.push({ arr, dep: arr + D.DWELL });
  }
  HOURS_PER_S = (CONFIG.HOUR_END - CONFIG.HOUR_START) / SCHEDULE[LAST_STATION].arr;
}
const tripHour = t => CONFIG.HOUR_START + t * HOURS_PER_S;
const lateMinutes = (t, due) => (t - due) * HOURS_PER_S * 60;

// Where the train may stand at a station and still have every door on the
// platform: [lo, hi] px around the stop mark. The terminus ends in a buffer stop.
const DOORS_LO = Math.min(...DOORS), DOORS_HI = Math.max(...DOORS) + 4, BUFFER_O = 72;
const STOP_WIN = [0, 0];
function stopWindow(st) {
  const [L, R] = st.platform;
  STOP_WIN[0] = Math.max(-60, L + 2 - DOORS_LO);
  STOP_WIN[1] = st.index === LAST_STATION ? BUFFER_O : Math.min(60, R - 2 - DOORS_HI);
  return STOP_WIN;
}

// Line speed: slower through the tea and hill curves, over the Meghna
// bridge and through stations
function speedLimitAt(d) {
  const D = CONFIG.DRIVE;
  let lim = sectionWeight('tea', d) + sectionWeight('hills', d) > 0.5 ? D.LIMIT_HILLS : D.LIMIT;
  if (d > BRIDGE.u0 - 460 && d < BRIDGE.u1 + 140) lim = Math.min(lim, D.LIMIT_BRIDGE);   // from Bhairab over the Meghna
  for (let i = 0; i < STATIONS.length; i++)
    if (d > STATIONS[i].dist - 280 && d < STATIONS[i].dist + 160) return Math.min(lim, D.LIMIT_STATION);
  return lim;
}

function resetDrive() {
  const P = drive.pts;
  P.stops = P.time = P.pax = P.penalty = 0;
  drive.comfort = 100; drive.pax = 0; drive.final = null; drive.tripT = 0;
  drive.lever = 0; drive.over = false;
  toasts.length = 0; popPool.n = 0;
  hornOff();
  if (drive.on) { setEngine('OFF'); drive.rpm = 0; setStopPhase('READY'); }
}

// AUTO hands the train to the driver, or takes it back, wherever it is
function setDriveMode(on) {
  if (on === drive.on) return;
  drive.on = on;
  ui.speed = 1;
  toasts.length = 0;
  if (on) {
    drive.lever = 0;
    drive.tripT = (journeyHour() - CONFIG.HOUR_START) / HOURS_PER_S;     // the clock carries on
    if (sim.state !== 'STOPPED') sim.state = 'DRIVING';
    else if (sim.stopPhase === 'SETTLE') setStopPhase('READY');
    else if (sim.stopPhase === 'HORN') setStopPhase('CLEAR');
    toast('YOU HAVE THE CONTROLS', 'glow');
  } else {
    hornOff();
    if (drive.engine === 'OFF' || drive.engine === 'SHUTDOWN') startEngine();
    if (sim.state === 'DRIVING') {
      const st = STATIONS[sim.station + 1], o = st ? sim.dist - st.dist : 0, w = st && stopWindow(st);
      if (st && (sim.speed < 1 || st.index === LAST_STATION) && o >= w[0] && o <= w[1]) {
        arrive(st.index, o);                             // standing at (or rolling into) the platform
      } else {
        if (st && o > 0) missStation(false);             // already past the mark: on to the next stop
        setState(sim.speed > 1 ? 'TRAVELING' : 'DEPARTING');
      }
    }
  }
  syncButtons();
}

// --- engine ---------------------------------------------------------------
function setEngine(s) {
  drive.engine = s;
  drive.engineT = 0;
  syncButtons();
}
function startEngine() { setEngine('CRANK'); playCrank(); }

function toggleEngine() {
  if (drive.engine === 'OFF') {
    if (drive.lever > 0) { toast('LEVER TO N FIRST', 'amber'); return; }
    startEngine();
  } else if (drive.engine === 'ON') {
    if (sim.speed > 0.5) toast('ENGINE OFF - COASTING', 'amber');
    setEngine('SHUTDOWN');
    playThump(0.12);
  }
}

// Engine speed: cranking, idling, revving with the notch (in AUTO with the
// journey phase), winding down
function updateEngine(dt) {
  const D = CONFIG.DRIVE;
  drive.engineT += dt;
  let target = 0, rate = 0.5;
  switch (drive.engine) {
    case 'CRANK':
      target = 0.12;
      if (drive.engineT >= D.CRANK_TIME) {              // it catches: a cough of black smoke
        setEngine('ON');
        drive.rpm = 0.5;
        sim.shake = Math.max(sim.shake, 0.7);
        for (let i = 0; i < 6; i++) emitPuff(true);
        playThump(0.25);
        toast('ENGINE RUNNING', 'grassLight');
      }
      break;
    case 'SHUTDOWN':
      rate = 0.16;
      if (drive.engineT >= D.SHUTDOWN_TIME) { setEngine('OFF'); playAir(0.9, 0.07); }
      break;
    case 'ON':
      target = drive.on ? 0.3 + 0.7 * (sim.doorOpen > 0 ? 0 : Math.max(0, drive.lever)) / D.NOTCHES
             : sim.state === 'DEPARTING' ? 0.95 : sim.state === 'TRAVELING' ? 0.65 : sim.stopPhase === 'HORN' ? 0.6 : 0.3;
      if (target > drive.rpm) rate = 0.6;               // spools up a little faster than it winds down
      break;
  }
  drive.rpm += Math.max(-rate * dt, Math.min(rate * dt, target - drive.rpm));
}

// --- controls ---------------------------------------------------------------
function setLever(n) {
  const was = drive.lever;
  drive.lever = Math.max(EB, Math.min(CONFIG.DRIVE.NOTCHES, n));
  if (drive.lever === was) return;
  playNotch();
  if (drive.lever === EB) { toast('EMERGENCY BRAKE!', 'red'); playAir(1.3, 0.14); }
  else if (was < 0 && drive.lever >= 0 && sim.speed < 1) playAir(0.5, 0.04);    // brakes released
  if (drive.lever > 0 && was <= 0) {
    if (drive.engine === 'OFF' || drive.engine === 'SHUTDOWN') toast('START THE ENGINE [E]', 'amber');
    else if (sim.doorOpen > 0) toast('CLOSE THE DOORS [O]', 'amber');
  }
}

function toggleLight() {
  drive.headlight = !drive.headlight;
  playNotch();
  toast(drive.headlight ? 'HEADLIGHT ON' : 'HEADLIGHT OFF', 'white');
}

// The doors button: open them at a platform once stopped, close them after boarding
function toggleDoors() {
  if (sim.state === 'STOPPED') {
    switch (sim.stopPhase) {
      case 'SETTLE': case 'READY': setStopPhase('DOORS_OPEN'); playAir(0.6, 0.06); break;
      case 'BOARDING': toast('PASSENGERS STILL BOARDING', 'amber'); break;
      case 'BOARDED': setStopPhase('DOORS_CLOSE'); playChime(); break;
      case 'WAIT': case 'FLAG': case 'CLEAR': case 'PARKED': toast('DOORS LOCKED', 'grayLight'); break;
    }
    return;
  }
  if (sim.speed > 0.3) { toast('STOP THE TRAIN FIRST', 'amber'); return; }
  const st = STATIONS[sim.station + 1];
  if (!st) return;
  const o = sim.dist - st.dist, w = stopWindow(st);
  if (o < -400) toast('NO PLATFORM HERE', 'amber');
  else if (o < w[0]) toast('PLATFORM AHEAD - ' + Math.ceil(w[0] - o) + ' M', 'amber');
  else if (o > w[1]) toast('OVERSHOT THE PLATFORM', 'red');
  else {
    arrive(st.index, o);
    scoreArrival(st.index, o);
    setStopPhase('DOORS_OPEN');
    playAir(0.6, 0.06);
  }
}

// --- driving ----------------------------------------------------------------
// Traction follows the engine (it has to spool up), fades at speed and is
// cut while a door is open; brakes, rolling and air resistance oppose it
function updateDrive(dt) {
  const D = CONFIG.DRIVE, v = sim.speed;
  drive.tripT += dt;
  if (sim.state === 'STOPPED') updateStop(dt);
  const power = drive.lever > 0 && drive.engine === 'ON' && sim.doorOpen === 0 && !ui.complete ? drive.lever / D.NOTCHES : 0;
  const trac = Math.min(power, Math.max(0, (drive.rpm - 0.3) / 0.7)) * D.ACCEL * Math.min(1, D.KNEE / Math.max(v, 1));
  if (sim.state === 'STOPPED') {
    drive.accel = 0;
    if (trac <= 0 || !depart()) return;
  }
  const brake = drive.lever === EB ? D.EMERGENCY : drive.lever < 0 ? -drive.lever * D.BRAKE : 0;
  const resist = v > 0 ? D.DRAG[0] + D.DRAG[1] * v * v + brake : 0;
  sim.speed = Math.max(0, v + (trac - resist) * dt);
  sim.dist += (v + sim.speed) / 2 * dt;
  drive.accel = (sim.speed - v) / dt;
  if (v > 1.5 && sim.speed === 0) sim.shake = Math.max(sim.shake, drive.lever <= -3 ? 1.2 : 0.5);   // the brakes hold
  const harsh = Math.abs(drive.accel) - D.COMFORT_ACCEL;  // passengers thrown about
  if (harsh > 0) drive.comfort = Math.max(0, drive.comfort - harsh * dt * 1.5);
  checkSpeed(dt);
  checkLine();
}

// Pulling out of a station: anyone still waiting on the platform is left behind
function depart() {
  if (sim.station === LAST_STATION) return false;
  const st = STATIONS[sim.station];
  let waiting = 0;
  for (const q of sim.people) if (q.st === st.index && q.mode === 'wait') waiting++;
  if (waiting) penalty(waiting * 40, 'LEFT ' + waiting + ' BEHIND');
  else if (sim.stopPhase === 'FLAG' || sim.stopPhase === 'WAIT') penalty(150, 'LEFT BEFORE THE FLAG');
  sim.state = 'DRIVING';
  sim.stopPhase = null;
  sim.shake = Math.max(sim.shake, 0.5 + drive.lever * 0.12);   // couplings snatch
  return true;
}

function checkSpeed(dt) {
  drive.limit = speedLimitAt(sim.dist);
  const over = sim.speed > drive.limit + 3;
  if (over && !drive.over) toast('OVERSPEED! LIMIT ' + drive.limit, 'red');
  drive.over = over;
  if (!over) return;
  drive.pts.penalty -= 20 * dt;
  if ((drive.beepT -= dt) <= 0) { drive.beepT = 0.45; playBeep(); }
}

// Rolling past a platform without stopping, or into the buffers at Sylhet
function checkLine() {
  const st = STATIONS[sim.station + 1];
  if (!st) return;
  const o = sim.dist - st.dist;
  if (st.index !== LAST_STATION) { if (o > stopWindow(st)[1] + 40) missStation(true); return; }
  if (o < BUFFER_O) return;
  const hard = sim.speed > 12, bump = sim.speed > 3;
  sim.dist = st.dist + BUFFER_O;
  sim.speed = 0;
  if (!bump) return;                                    // just leaning on them
  sim.shake = hard ? 3 : 1;
  playThump(hard ? 0.6 : 0.2);
  if (hard) { drive.comfort = Math.max(0, drive.comfort - 35); penalty(300, 'HIT THE BUFFERS!'); }
}

function missStation(announce) {
  sim.station++;
  sim.nextStop = sim.station < LAST_STATION ? STATIONS[sim.station + 1].dist : Infinity;
  if (announce) penalty(400, 'MISSED ' + STATIONS[sim.station].en);
}

function penalty(n, msg) {
  drive.pts.penalty -= n;
  toast(msg + ' -' + n, 'red');
}

// Doors opened at a platform: how close to the mark, how close to time
function scoreArrival(i, o) {
  const a = Math.abs(o), late = lateMinutes(drive.tripT, SCHEDULE[i].arr), ok = CONFIG.DRIVE.ON_TIME;
  const tp = late <= ok ? 200 : Math.max(-200, Math.round(200 - 6 * (late - ok)));   // early is fine: departure waits
  drive.pts.time += tp;
  toast((late < -ok ? 'EARLY ' + Math.round(-late) + ' MIN' : late <= ok ? 'ON TIME' : 'LATE ' + Math.round(late) + ' MIN') +
        (tp < 0 ? ' ' : ' +') + tp, tp >= 150 ? 'grassLight' : tp > 0 ? 'amber' : 'red');
  const [label, pts, col] = a <= 3 ? ['PERFECT STOP', 500, 'glow'] : a <= 10 ? ['GREAT STOP', 300, 'grassLight']
                          : a <= 25 ? ['GOOD STOP', 150, 'skyLight'] : ['STOPPED', 50, 'white'];
  drive.pts.stops += pts;
  toast(label + ' +' + pts, col, true);
  playScore(a <= 10);
}

function finishJourney() {
  ui.complete = true;
  panelSprites = null;
  hornOff();
  if (!drive.on) return;
  const P = drive.pts, comfort = Math.round(drive.comfort * 4);
  const total = Math.round(P.stops + P.time + P.pax + comfort + P.penalty);
  const best = readBest();
  if (total > best) try { localStorage.setItem('ipt-best', String(total)); } catch (e) { /* storage blocked */ }
  drive.final = { total, comfort, best, record: total > best && best > 0,
                  stars: total >= 3000 ? 3 : total >= 2200 ? 2 : total >= 1200 ? 1 : 0 };
  playScore(true);
}

// How hard the brakes bite, 0..1 (sparks) and how loudly they squeal near a stop
function brakeEffort() {
  if (drive.on) return sim.state === 'DRIVING' && drive.lever <= -2 ? (-drive.lever - 1) / 4 : 0;
  return sim.state === 'ARRIVING' ? Math.sin(Math.min(1, sim.timer / sim.segDur) * Math.PI) : 0;
}
function squealLevel() {
  const v = sim.speed, k = drive.on ? (drive.lever < 0 ? Math.min(1, -drive.lever / 3) : 0) : sim.state === 'ARRIVING' ? 0.6 : 0;
  return v > 0.3 && v < 26 ? k * (1 - v / 26) * Math.min(1, v / 2) : 0;
}

// --- messages: toasts across the sky, +10s over the doors -------------------
const toasts = [], TOAST_LIFE = 2.6;
function toast(text, col = 'white', big = false) {
  if (!drive.on) return;
  const last = toasts[toasts.length - 1];
  if (last && last.text === text) { last.t = 0; return; }
  toasts.push({ text, col, big, t: 0 });
  if (toasts.length > 3) toasts.shift();
}
function updateToasts(dt) {
  for (let i = toasts.length - 1; i >= 0; i--) if ((toasts[i].t += dt) > TOAST_LIFE) toasts.splice(i, 1);
}

const popPool = makePool(24, () => ({ x: 0, y: 0, t: 0, text: '', col: '' }));
function popup(x, y, text, col) {
  const q = poolSpawn(popPool, 24);
  if (q) { q.x = x; q.y = y; q.t = 0; q.text = text; q.col = col; }
}
function updatePopups(dt) {
  for (let i = 0; i < popPool.n; ) { if ((popPool.items[i].t += dt) < 1.2) i++; else poolKill(popPool, i); }
}

// Passengers in and out: a head count, and a fare for the driver
const screenXOf = q => Math.round(q.x + STATIONS[q.st].dist - Math.floor(sim.dist));
function passengerIn(q) {
  q.gone = true;
  drive.pax++;
  if (drive.on) { drive.pts.pax += 10; popup(screenXOf(q), PLAT.DOOR_TOP - 6, '+10', 'glow'); }
}
function passengerOut(q) {
  drive.pax = Math.max(0, drive.pax - 1);
  if (drive.on) { drive.pts.pax += 10; popup(screenXOf(q), PLAT.DOOR_TOP - 6, '+10', 'white'); }
}

// What the driver should do next, shown under the route map
function driveHint() {
  const e = drive.engine;
  if (ui.complete) return '';
  if (e === 'CRANK') return 'STARTING THE ENGINE...';
  const power = drive.lever < 0 ? 'RELEASE THE BRAKE [↑]' : 'APPLY POWER [↑]';
  if (sim.state === 'STOPPED') {
    const term = sim.station === LAST_STATION;
    switch (sim.stopPhase) {
      case 'SETTLE': case 'READY': return e === 'OFF' && sim.station === 0 ? 'START THE ENGINE [E]' : 'OPEN THE DOORS [O]';
      case 'DOORS_OPEN': case 'BOARDING': return term ? 'PASSENGERS GETTING OFF...' : 'PASSENGERS BOARDING...';
      case 'BOARDED': return !term ? 'CLOSE THE DOORS [O]' : e === 'ON' ? 'STOP THE ENGINE [E]' : '';
      case 'DOORS_CLOSE': return 'DOORS CLOSING...';
      case 'WAIT': return 'DEPARTS AT ' + hhmm(tripHour(SCHEDULE[sim.station].dep)) + ' - WAIT';
      case 'FLAG': return 'WAIT FOR THE GUARD...';
      case 'CLEAR': return e === 'OFF' ? 'START THE ENGINE [E]' : e === 'ON' ? power : '';
      case 'PARKED': return e === 'ON' ? 'STOP THE ENGINE [E]' : '';
    }
    return '';
  }
  if (drive.over) return 'SLOW DOWN! LIMIT ' + drive.limit;
  const st = STATIONS[sim.station + 1];
  if (!st) return '';
  const o = sim.dist - st.dist, w = stopWindow(st);
  if (sim.speed < 0.3) {
    if (o >= w[0] && o <= w[1]) return 'OPEN THE DOORS [O]';
    if (e === 'OFF') return 'START THE ENGINE [E]';
    if (o > w[1]) return 'OVERSHOT! DRIVE ON [↑]';
    if (o > -160) return 'CREEP UP ' + Math.ceil(w[0] - o) + ' M [↑]';
    return power;
  }
  if (o > -440 && o < w[0]) return 'BRAKE FOR ' + st.en + ' [↓]';
  return '';
}

// =====================================================================
// 8b. ATMOSPHERE: time of day, sky, weather, glow and effects
// =====================================================================
// --- time of day -------------------------------------------------------
// sim.hour eases towards its target - the trip's own clock (AUTO) or the
// hour picked with the time button - so it never jumps
function journeyHour() {
  const d0 = STATIONS[0].dist, d1 = STATIONS[LAST_STATION].dist;
  const p = Math.max(0, Math.min(1, (sim.dist - d0) / (d1 - d0)));
  return CONFIG.HOUR_START + p * (CONFIG.HOUR_END - CONFIG.HOUR_START);
}

function updateHour(dt) {
  // AUTO follows the distance travelled; a driver's day runs on the timetable clock
  const fixed = TIME_MODES[ui.timeMode][1];
  const target = fixed !== null ? fixed : drive.on ? Math.min(23.9, tripHour(drive.tripT)) : journeyHour();
  const diff = ((target - sim.hour + 36) % 24) - 12, step = CONFIG.HOUR_EASE * dt;   // shortest way round
  sim.hour = (sim.hour + Math.max(-step, Math.min(step, diff)) + 24) % 24;
  sim.night = nightAt(sim.hour);
}

const LIGHT_TMP = { a: 'day', b: 'day', f: 0 };
function lightingAt(h) {
  for (let i = 0; i < LIGHT_KEYS.length - 1; i++) {
    const k0 = LIGHT_KEYS[i], k1 = LIGHT_KEYS[i + 1];
    if (h >= k0[0] && h < k1[0]) {
      LIGHT_TMP.a = k0[1]; LIGHT_TMP.b = k1[1];
      LIGHT_TMP.f = k0[1] === k1[1] ? 0 : (h - k0[0]) / (k1[0] - k0[0]);
      return LIGHT_TMP;
    }
  }
  LIGHT_TMP.a = LIGHT_TMP.b = 'night'; LIGHT_TMP.f = 0;
  return LIGHT_TMP;
}

// 0 in daylight .. 1 at night: stars, lamps, fireflies
function nightAt(h) {
  if (h >= 7 && h <= 17.5) return 0;
  if (h > 17.5 && h < 20) return smoothstep((h - 17.5) / 2.5);
  if (h >= 4.5 && h < 7) return 1 - smoothstep((h - 4.5) / 2.5);
  return 1;
}

const hhmm = h => { const m = Math.floor(h * 60) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

// Interpolate a table of [hour, ...hex colours] rows into out (RGB floats)
function hexRgbF(hex) { const [r, g, b] = hexToRgb(hex); return [r, g, b]; }
function keyedColours(keys, h, out) {
  let i = 0;
  while (i < keys.length - 2 && h >= keys[i + 1][0]) i++;
  const k0 = keys[i], k1 = keys[i + 1], t = smoothstep(Math.max(0, Math.min(1, (h - k0[0]) / (k1[0] - k0[0]))));
  for (let c = 0; c < out.length; c++) out[c] = k0[1][c] + (k1[1][c] - k0[1][c]) * t;
  return out;
}
// rows: [hour, [top rgb, mid rgb, horizon rgb] flattened]
const skyKey = (h, top, mid, hor) => [h, [...hexRgbF(top), ...hexRgbF(mid), ...hexRgbF(hor)]];
const SKY_KEYS = [
  skyKey(0, '#0c0e22', '#151a3a', '#262c58'), skyKey(4.6, '#0c0e22', '#151a3a', '#262c58'),
  skyKey(5.4, '#1b1f3b', '#3a3a6e', '#b85d6e'), skyKey(6.1, '#2c4a84', '#a87a9e', '#f4c27a'),
  skyKey(7.0, '#3d7fc4', '#8cc4e8', '#f2e2b8'), skyKey(8.5, '#3d7fc4', '#6aaee0', '#a8d8ef'),
  skyKey(15.6, '#3d7fc4', '#6aaee0', '#a8d8ef'), skyKey(17.0, '#3a6cb0', '#88b2d8', '#f4d08a'),
  skyKey(18.0, '#2c2f5e', '#b85d6e', '#e8875a'), skyKey(18.8, '#1b1f3b', '#4a4f84', '#b85d6e'),
  skyKey(19.8, '#0f1228', '#1b1f3b', '#2c2f5e'), skyKey(24, '#0c0e22', '#151a3a', '#262c58'),
];
// section moods (daylight only) and rain, as targets the sky leans towards
const SKY_DEEP = [...hexRgbF('#2a60b2'), ...hexRgbF('#4a92d8'), ...hexRgbF('#9ccff0')];
const SKY_MIST = [...hexRgbF('#8fb3cf'), ...hexRgbF('#b8c8d6'), ...hexRgbF('#d0d8e0')];
const SKY_RAIN_DAY = [...hexRgbF('#5d6577'), ...hexRgbF('#7d8596'), ...hexRgbF('#9aa1ad')];
const SKY_RAIN_NIGHT = [...hexRgbF('#14161e'), ...hexRgbF('#1c1f2a'), ...hexRgbF('#262a36')];

// The sky is a vertical gradient dithered to 4x4 Bayer steps, so it only
// varies with x & 3: a 4 px strip, repeated as a pattern
const sky = { strip: null, sg: null, img: null, pattern: null, key: -1, cols: new Float32Array(9), tmp: new Float32Array(9) };
function updateSky(g) {
  const d = sim.dist, day = 1 - sim.night, deep = sectionWeight('kash', d) * day, mist = sectionWeight('hills', d) * day;
  const rain = weather.level;
  const key = ((Math.round(sim.hour * 60) * 21 + Math.round(deep * 20)) * 21 + Math.round(mist * 20)) * 21 + Math.round(rain * 20);
  if (key === sky.key) return;
  sky.key = key;
  if (!sky.strip) { [sky.strip, sky.sg] = makeCanvas(4, H); sky.img = sky.sg.createImageData(4, H); }
  const c = keyedColours(SKY_KEYS, sim.hour, sky.cols), t = sky.tmp;
  for (let i = 0; i < 9; i++) {
    let v = c[i];
    v += (SKY_DEEP[i] - v) * deep;
    v += (SKY_MIST[i] - v) * mist * 0.7;
    t[i] = SKY_RAIN_NIGHT[i] + (SKY_RAIN_DAY[i] - SKY_RAIN_NIGHT[i]) * day;
    c[i] = v + (t[i] - v) * rain * 0.65;
  }
  const out = new Uint32Array(sky.img.data.buffer), Q = 6;
  for (let y = 0; y < H; y++) {
    const a = y < 60 ? 0 : 3, b = y < 60 ? 3 : 6, f = y < 60 ? y / 60 : Math.min(1, (y - 60) / 52);
    for (let x = 0; x < 4; x++) {
      const dz = (bayer(x, y) / 16 - 0.5) * Q;
      const r = Math.round((c[a] + (c[b] - c[a]) * f + dz) / Q) * Q, gg = Math.round((c[a + 1] + (c[b + 1] - c[a + 1]) * f + dz) / Q) * Q,
            bb = Math.round((c[a + 2] + (c[b + 2] - c[a + 2]) * f + dz) / Q) * Q;
      out[y * 4 + x] = (255 << 24 | Math.min(255, bb) << 16 | Math.min(255, gg) << 8 | Math.min(255, r)) >>> 0;
    }
  }
  sky.sg.putImageData(sky.img, 0, 0);
  sky.pattern = g.createPattern(sky.strip, 'repeat');
}

// --- sun, moon, stars, lightning bolt (behind everything) -----------------
const STARS = (() => {
  const rng = mulberry32(3), s = [];
  for (let i = 0; i < 110; i++) s.push({ x: randInt(rng, 0, W - 1), y: randInt(rng, 0, 100), th: rng(), ph: rng() * 6, big: rng() < 0.08 });
  return s;
})();

function celestialSprite(r, rim, core, coreR) {
  const [c, g] = makeCanvas(r * 2 + 1, r * 2 + 1);
  disc(g, r, r, r, rim);
  disc(g, r - (r > 5 ? 1 : 0), r - (r > 5 ? 1 : 0), coreR, core);
  return c;
}
const SUN_SPRITES = [celestialSprite(6, PALETTE.glow, PALETTE.white, 4),     // high
                     celestialSprite(7, PALETTE.amber, PALETTE.peach, 5),    // getting low
                     celestialSprite(8, PALETTE.orange, PALETTE.peach, 5)];  // on the horizon
const MOON = (() => {
  const [c, g] = makeCanvas(11, 11);
  disc(g, 5, 5, 5, PALETTE.cloudShade);
  disc(g, 6, 4, 4, PALETTE.white);
  for (const [x, y] of [[3, 6], [4, 3], [6, 7], [2, 4]]) px(g, x, y, PALETTE.grayLight);
  return c;
})();
